     already happened. */
  function takeFlash() {
    let m = null;
    try {
      m = localStorage.getItem(FLASH_KEY);
      if (m !== null) localStorage.removeItem(FLASH_KEY);
    } catch (e) { m = null; }
    if (m) state.ui.message = m;
  }

  /* ── state ───────────────────────────────────────────────────────────── */
  /* Local to the screen: re-entering shows every terminal, no query, ALL. */
  function defaults(preview) {
    const u = { bq: '', status: 'ALL', message: null };
    /* Filtered: a query and the status filter applied at once. */
    if (preview === 'filtered') { u.bq = 'olon'; u.status = 'ACTIVE'; }
    if (preview === 'empty') { u.bq = 'zzz'; }
    return u;
  }

  const state = { preview: 'default', ui: defaults('default'), sheet: null, lastFocus: null, busy: false };

  /* ── one derivation: search → status → sort ─────────────────────────── */
  function derive() {
    const ui = state.ui;
    const needle = ui.bq.trim().toLowerCase();
    const passStatus = function (active) {
      return ui.status === 'ALL' || (ui.status === 'ACTIVE') === active;
    };

    let rows = TERMINALS.filter(function (row) {
      if (needle === '') return true;
      /* The marker is searchable as the driver reads it, in KM — "232.4" — and
         not in the thousandths that are actually stored. */
      return terminalNameOf(row.name).toLowerCase().indexOf(needle) !== -1 ||
        municipalityNameOf(row.name).toLowerCase().indexOf(needle) !== -1 ||
        captionOf(row).toLowerCase().indexOf(needle) !== -1 ||
        fmtKm(row.km).toLowerCase().indexOf(needle) !== -1;
    }).filter(function (row) { return passStatus(row.active); });
    /* km_marker ascending, then the name — never by id, so an added row sorts
       among the seed by where it sits on the route and not by when it was
       typed. This is the order the trip reader uses. */
    rows = rows.slice().sort(function (x, y) {
      return x.km - y.km || terminalNameOf(x.name).localeCompare(terminalNameOf(y.name));
    });

    return {
      rows: rows,
      total: TERMINALS.length,
      active: TERMINALS.filter(function (r) { return r.active; }).length,
      filtered: needle !== '' || ui.status !== 'ALL',
      hasQuery: needle !== ''
    };
  }

  /* The card's second line. The LINKED municipality wins over the one in the
     stored name, because the link is the editable fact and the composed name
     is what the other screen wrote at the time. A row with no link still names
     the municipality its own name carries, so the seed is not information-free;
     only a row with neither prints "Not linked". */
  const captionOf = function (row) {
    const linked = row.mid === null ? null : muniOf(row.mid);
    return linked ? linked.name : municipalityNameOf(row.name);
  };

  /* Whether the row is genuinely homeless, as opposed to merely unlinked.
     These are different states and the sibling collapsed them: the seed's five
     rows all read mid: null, so flagging on the link alone paints every row on
     a fresh install in the error container, and an all-red list reads as a
     failure rather than as the app's seed. A row that still names its
     municipality in its own name is not missing one, and only a row with
     neither the link nor the name is. */
  const homeless = function (row) { return row.mid === null && captionOf(row) === ''; };


  /* ── chrome, state blocks ────────────────────────────────────────────── */
  function renderChrome(v) {
    let sub = v.total + ' ' + plural(v.total, 'terminal', 'terminals') + ' · ' +
      v.active + ' active';
    if (state.preview === 'loading') sub = 'Loading terminals';
    if (state.preview === 'error') sub = 'Terminal configuration unavailable';
    $('chromeSub').textContent = sub;
  }

  /* Four skeleton rows in the row geometry, because the list is what is
     loading. A spinner says nothing about the shape of what is coming. */
  function skRow() {
    return '<div class="sk-row" aria-hidden="true">' +
      '<span class="sk" style="width:48px;height:48px;border-radius:var(--radius-md)"></span>' +
      '<span class="sk-lines"><span class="sk" style="display:block;height:14px;width:62%"></span>' +
      '<span class="sk" style="display:block;height:12px;width:38%;margin-top:8px"></span></span>' +
      '</div>';
  }

  function renderState() {
    const slot = $('stateSlot');
    const live = $('live');
    const p = state.preview;
    if (p === 'loading') {
      slot.hidden = false;
      live.hidden = true;
      slot.innerHTML = '<p class="sr-only" role="status">Loading terminals</p>' +
        '<div class="list">' + skRow() + skRow() + skRow() + skRow() + '</div>';
      return;
    }
    if (p === 'error') {
      slot.hidden = false;
      live.hidden = true;
      /* The shell's own failure block. Settings ships this card, so a driver
         who has seen it there recognises it here without reading it. */
      slot.innerHTML = '<div class="state error" role="alert">' +
        '<h3 class="title-m">Terminal configuration unavailable</h3>' +
        '<p class="body-m">Unable to load terminals.</p>' +
        '<a class="primary-btn label-l" href="settings.html" data-od-id="tc-goback">GO BACK</a>' +
        '</div>';
      return;
    }
    slot.hidden = true;
    slot.innerHTML = '';
    live.hidden = false;
  }

  /* .caution, the shell's inline notice. */
  function renderMsg() {
    const ui = state.ui;
    $('msgSlot').innerHTML = ui.message === null ? '' :
      '<div class="caution bc-msg" role="status" data-od-id="tc-banner" style="margin-top:16px">' +
      '<p class="body-s">' + esc(ui.message) + '</p>' +
      '<button type="button" data-act="dismissmsg" data-od-id="tc-msg-x" aria-label="Dismiss message">' + icon('close', 18) + '</button>' +
      '</div>';
  }

  function renderHead(v) {
    const total = v.total;
    const shown = v.rows.length;
    $('secLabel').textContent = 'TERMINALS';
    /* "3 of 5", not "5 total · 3 shown". The eyebrow already says what these
       are; the number in the pill only has to answer how many are on screen,
       and it prints white there because it shares the button's fill. */
    $('secCount').innerHTML = shown === total ? '<b>' + total + '</b>' : '<b>' + shown + '</b> of ' + total;
    $('secCount').setAttribute('aria-label', shown + ' of ' + total + ' ' + plural(total, 'terminal', 'terminals') + ' shown');
    $('secNote').textContent = 'Terminals mark where a trip starts and ends.';
    $('offlineBody').textContent = 'All terminals are saved locally and work offline.';
  }

  /* The search box is add-trip's `.field` with a caret in it. */
  function renderControls() {
    const q = state.ui.bq;
    $('controlFields').innerHTML =
      '<label class="field as-input" data-od-id="tc-searchwrap">' +
      '<span class="f-icon">' + icon('search', 18) + '</span>' +
      '<span class="f-body"><span class="sr-only">Search terminals</span>' +
      '<span class="f-value"><input type="search" id="q" data-od-id="tc-q" autocomplete="off" spellcheck="false" ' +
      'aria-label="Search terminals" placeholder="Search terminals" value="' + esc(q) + '" /></span>' +
      '</span></label>';
  }

  /* Dashboard's caption: the one sentence that qualifies the control above it.
     Here it names the status filter — a control that tinted itself without ever
     saying which value was applied is the defect the old build had. */
  function renderStatusLine() {
    const ui = state.ui;
    const on = ui.status !== 'ALL';
    $('statusCaption').innerHTML = '<span class="dot" style="background:' + (on ? 'var(--primary)' : 'var(--outline)') + '"></span>' +
      '<span>Status filter: <b>' + ui.status + '</b>, applied to this list. ' +
      '<button type="button" class="text-action label-l" data-act="status" data-od-id="tc-status" ' +
      'aria-haspopup="dialog" ' +
      'aria-label="Status filter is ' + ui.status + '. Change it.">Change</button></span>';
  }

  /* ── the row ─────────────────────────────────────────────────────────── */
  /* Settings' `.mod` minus its chip: title, value, trailing status and chevron.
     The chip is gone for the same reason barangay-config dropped it — every row
     would wear the same twenty-four-pixel glyph telling the driver something the
     section header already says, and deleting it gives the name and the location
     the 60px that the two-line clamp was starving. */
  function terminalCard(row) {
    const muni = captionOf(row);
    const value = (muni === '' ? 'Not linked' : muni) + ' · ' + fmtKm(row.km);
    const name = terminalNameOf(row.name);
    return '<button type="button" class="mod' + (homeless(row) ? ' unlinked' : '') + '" data-act="open" ' +
      'data-id="' + row.id + '" data-od-id="tc-row-' + row.id + '" ' +
      'aria-label="' + esc(name + ', ' + value + '. ' + (row.active ? 'Active.' : 'Inactive.') + ' Opens the record.') + '">' +
      '<span class="mod-body">' +
      '<span class="mod-title">' + esc(name) + '</span>' +
      '<span class="mod-value body-m">' + esc(value) + '</span>' +
      '</span>' +
      '<span class="mod-end">' +
      '<span class="bc-state ' + (row.active ? 'on' : 'off') + ' label-s" aria-hidden="true">' + (row.active ? 'ACTIVE' : 'INACTIVE') + '</span>' +
      '<span class="mod-chev" aria-hidden="true">' + icon('chevron', 18, 'currentColor', 2) + '</span>' +
      '</span></button>';
  }

  /* ── the empty state, three shapes ───────────────────────────────────── */
  function inlineEmpty(odId, title, body, action) {
    return '<div class="inline-empty" data-od-id="' + odId + '">' +
      '<p class="label-s" style="color:var(--glass-on)">' + title + '</p>' +
      '<p class="body-s" style="margin-top:8px">' + body + '</p>' +
      (action ? '<div class="card-actions">' + action + '</div>' : '') + '</div>';
  }
  function emptyHTML(v) {
    const ui = state.ui;
    if (v.hasQuery) {
      return inlineEmpty('tc-empty', 'NO MATCH', 'No terminal matches that search.',
        '<button type="button" class="ghost-btn" data-act="clearquery" data-od-id="tc-clearq">' +
        '<span class="label-l">Clear the search</span></button>');
    }
    if (v.filtered) {
      return inlineEmpty('tc-empty', 'FILTERED OUT',
        'No terminals are ' + esc(ui.status) + '. They are still saved.',
        '<button type="button" class="ghost-btn" data-act="clear" data-od-id="tc-clear">' +
        '<span class="label-l">Clear the filter</span></button>');
    }
    return inlineEmpty('tc-empty', 'NOTHING HERE YET', 'Add a terminal to mark where trips start and end.', '');
  }

  function renderList(v) {
    if (v.rows.length === 0) {
      $('list').innerHTML = emptyHTML(v);
      return;
    }
    $('list').innerHTML = v.rows.map(terminalCard).join('');
  }

  /* ── overlays ────────────────────────────────────────────────────────── */
  function closeOverlay() {
    const root = $('overlayRoot');
    if (!root.firstChild) return;
    if (state.lastFocus && state.lastFocus.isConnected) state.lastFocus.focus();
    root.innerHTML = '';
    state.sheet = null;
    state.busy = false;
  }
  function openOverlay(html) {
    state.lastFocus = document.activeElement;
    state.sheet = html;
    $('overlayRoot').innerHTML = html;
    const af = $('overlayRoot').querySelector('[data-autofocus]');
    if (af) af.focus();
  }
  function renderOverlay() {
    if (state.sheet !== null) $('overlayRoot').innerHTML = state.sheet;
  }
  function detailRow(k, v) {
    return '<div class="detail-row"><span class="k body-m">' + esc(k) +
      '</span><span class="v body-m tabular">' + esc(v) + '</span></div>';
  }
  function sheet(title, sub, body) {
    return '<div class="scrim bottom" data-scrim="1">' +
      '<div class="sheet bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">' +
      '<div class="sheet-head"><div class="sheet-titles">' +
      '<h2 class="headline-s" id="sheetTitle">' + esc(title) + '</h2>' +
      (sub ? '<p class="body-s muted">' + esc(sub) + '</p>' : '') +
      '</div><button type="button" class="icon-btn" data-act="close" data-od-id="tc-sheet-close" ' +
      'data-autofocus aria-label="Close">' + icon('close', 20) + '</button></div>' +
      '<div class="sheet-body">' + body + '</div></div></div>';
  }
  /* The filter opens the same bottom sheet every other screen opens, and the
     list inside it is `.pick-row` — the row add-ticket and passenger use to hand
     a boarding to a terminal. A filter is a pick. */
  function pickRow(value, label, current, odId) {
    return '<button type="button" class="pick-row" data-act="pickstatus" data-value="' + esc(value) +
      '" data-od-id="' + odId + '" aria-current="' + (current ? 'true' : 'false') + '">' +
      '<span class="pk-body"><span class="pk-name">' + esc(label) + '</span>' +
      (current ? '<span class="pk-sub body-s">Currently applied</span>' : '') + '</span>' +
      '<span class="mod-chev" aria-hidden="true">' + icon('check', 18, 'currentColor', 2.4) + '</span></button>';
  }

  function openStatusMenu() {
    const ui = state.ui;
    let o = '';
    ['ALL', 'ACTIVE', 'INACTIVE'].forEach(function (v) {
      o += pickRow(v, v, ui.status === v, 'tc-status-' + v);
    });
    openOverlay(sheet('Status filter', 'Applies to this list', o));
  }

  /* The record sheet: what is stored, and the one write this screen owns. */
  function openRecord(id) {
    const r = TERMINALS.filter(function (x) { return x.id === id; })[0];
    if (!r) return;
    const name = terminalNameOf(r.name);
    const linked = r.mid === null ? null : muniOf(r.mid);
    /* The sheet has to agree with the card it was opened from. Reading the link
       alone printed "Not linked" under a subtitle that said "Zambales", because
       the seed carries its municipality in the name and not in mid. Say which of
       the two the value came from instead of choosing one and dropping the other. */
    const muniValue = linked ? linked.name + ', ' + linked.province
      : captionOf(r) === '' ? 'Not linked'
      : captionOf(r) + ' (from the terminal name)';
    const rows = detailRow('Municipality', muniValue) +
      detailRow('Registered KM', fmtKm(r.km)) +
      detailRow('Status', r.active ? 'ACTIVE' : 'INACTIVE') +
      detailRow('Terminal ID', String(r.id));
    openOverlay(sheet(name, captionOf(r) === '' ? 'Terminal' : captionOf(r),
      '<div class="detail-card" data-od-id="tc-record-rows">' + rows + '</div>' +
      '<p class="body-s muted" style="margin-top:12px">The stored values this record reads. Only the status is written from this sheet.</p>' +
      '<div class="sheet-actions">' +
      '<button type="button" class="destructive label-l" data-act="deact" data-id="' + id + '" ' +
      'data-od-id="tc-deact-' + id + '"' + (r.active ? '' : ' aria-disabled="true"') + '>DEACTIVATE</button>' +
      '</div>'));
  }

  /* The confirmation. Deliberately not error-tinted: nothing here is deleted,
     only deactivated, and a red confirm on a reversible write teaches the wrong
     reflex for the one screen where the reflex matters. */
  function openDeactivate(id) {
    const r = TERMINALS.filter(function (x) { return x.id === id; })[0];
    if (!r) return;
    const name = terminalNameOf(r.name);
    openOverlay(sheet('Deactivate Terminal?', '',
      '<p class="body-m muted" data-od-id="tc-confirm-body">' + esc(name) +
      ' will no longer be offered when creating a trip. Existing trips will not be affected.</p>' +
      '<div class="sheet-actions">' +
      '<button type="button" class="ghost label-l" data-act="cancel" data-od-id="tc-confirm-cancel">CANCEL</button>' +
      '<button type="button" class="primary-btn" data-act="confirm" data-id="' + id + '" ' +
      'data-od-id="tc-confirm-go" style="margin-top:0">DEACTIVATE</button>' +
      '</div>'));
  }

  /* The one write, and it stands in for the app's deactivateTerminal()
     (tripTicketsStore.ts:979). An added row goes back to the key it came from,
     so a deactivation survives a reload. A seeded row has no table to write to
     and lasts for the session.

     ponytail: a seeded deactivation is memory-only. Call deactivateTerminal()
     here and drop the localStorage branch when this screen ships against the
     store instead of a prototype. */
  function runDeactivate(id) {
    if (state.busy) return;
    state.busy = true;
    const btn = $('overlayRoot').querySelector('[data-act="confirm"]');
    if (btn) { btn.disabled = true; btn.textContent = 'Deactivating…'; }
    window.setTimeout(function () {
      state.busy = false;
      const r = TERMINALS.filter(function (x) { return x.id === id; })[0];
      let message;
      if (!r) {
        message = 'Unable to deactivate terminal.';
      } else if (r.active === false) {
        message = terminalNameOf(r.name) + ' is already inactive.';
      } else if (r.src === null) {
        r.active = false;
        message = terminalNameOf(r.name) + ' deactivated for this session.';
      } else {
        try {
          const raw = localStorage.getItem(ADDED_KEY);
          const rows = JSON.parse(raw);
          if (!Array.isArray(rows) || !rows[r.src] || rows[r.src].name !== r.name) {
            message = 'Unable to deactivate terminal.';
          } else {
            rows[r.src] = Object.assign({}, rows[r.src], { active: false });
            localStorage.setItem(ADDED_KEY, JSON.stringify(rows));
            r.active = false;
            message = terminalNameOf(r.name) + ' deactivated.';
          }
        } catch (e) {
          message = 'This device would not save the change. Check available storage and try again.';
        }
      }
      state.ui.message = message;
      closeOverlay();
      render();
    }, 650);
  }

  /* ── prototype states, outside the phone ─────────────────────────────── */
  function syncProto() {
    Array.prototype.forEach.call($('protoSeg').querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.state === state.preview ? 'true' : 'false');
    });
  }
  function setPreview(v) {
    state.preview = v;
    state.ui = defaults(v);
    state.sheet = null;
    state.busy = false;
    $('overlayRoot').innerHTML = '';
    syncProto();
    render();
  }

  /* ── one render ──────────────────────────────────────────────────────── */
  function render(keepControls) {
    const v = derive();
    renderChrome(v);
    renderState();
    renderMsg();
    renderHead(v);
    renderStatusLine();
    /* Typing re-renders the list only: rebuilding the field would drop the
       caret on every keystroke. */
    if (!keepControls) renderControls();
    renderList(v);
    renderOverlay();
  }

  /* ── wiring ──────────────────────────────────────────────────────────── */
  document.addEventListener('input', function (e) {
    const t = e.target;
    if (t && t.id === 'q') {
      state.ui.bq = t.value;
      render(true);
    }
  });

  document.addEventListener('click', function (e) {
    const t = e.target;
    if (t.hasAttribute && t.hasAttribute('data-scrim')) { closeOverlay(); return; }

    const proto = t.closest && t.closest('#protoSeg button');
    if (proto) { setPreview(proto.dataset.state); return; }

    const act = t.closest && t.closest('[data-act]');
    if (!act) return;
    const a = act.dataset.act;
    const id = act.dataset.id === undefined ? null : parseInt(act.dataset.id, 10);

    if (a === 'status') { openStatusMenu(); return; }
    if (a === 'pickstatus') { state.ui.status = act.dataset.value; closeOverlay(); render(); return; }
    if (a === 'open') { openRecord(id); return; }
    /* aria-disabled, not disabled: an already-inactive record must still be
       reachable by keyboard, or the reason it cannot change is invisible to
       anyone not using a mouse. */
    if (a === 'deact') {
      if (act.getAttribute('aria-disabled') === 'true') return;
      openDeactivate(id);
      return;
    }
    if (a === 'confirm') { runDeactivate(id); return; }
    /* The pill is the only way into the add screen, so it navigates rather than
       opening a sheet: the form is a route in the app, and the record it writes
       has to be visible in this list when the driver comes back. */
    if (a === 'add') { window.location.href = 'add-terminal.html'; return; }
    if (a === 'clear') { state.ui.bq = ''; state.ui.status = 'ALL'; render(); return; }
    if (a === 'clearquery') { state.ui.bq = ''; render(); return; }
    if (a === 'dismissmsg') { state.ui.message = null; render(); return; }
    closeOverlay();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeOverlay();
  });

  loadAddedMunicipalities();
  loadAdded();
  takeFlash();
  syncProto();
  render();
  })();

  </script>
</body>
</html>

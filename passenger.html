    const label = 'Group ' + r.rank + '. ' + pairLabel(g) + '. ' + plural(g.qty, 'passenger', 'passengers') +
      ', ' + pct + ' percent of the ' + denom + ' in scope. ' + cap(mix) + '. ' +
      plural(g.fares, 'fare', 'fares') + ', first boarded ' + clock(g.first) + ', last ' + clock(g.last) + '. Opens the group.';
    return '<button type="button" class="glass row-card row-btn pair-row" data-pair="' + esc(g.key) + '" data-od-id="ps-row" aria-label="' + esc(label) + '">' +
      '<span class="pr-head">' +
        '<span class="pr-rank label-s tabular">' + (r.rank < 10 ? '0' + r.rank : r.rank) + '</span>' +
        '<span class="pr-body"><b class="pr-pair title-m">' + pairLabel(g) + '</b>' +
        '<span class="pr-sub body-s od-truncate">' + mix + '</span></span>' +
      '</span>' +
      /* count and share are one figure, so they share a line: the number reads
         against the bar that measures it, and the pair keeps the full width it
         needs — the widest pair in the seed is 215px in Poppins 600 16. */
      '<span class="pr-foot">' +
        '<span class="pr-track"><span class="pr-fill" style="width:' + pct + '%"></span></span>' +
        '<span class="pr-count"><b class="title-m tabular">' + g.qty + '</b><span class="body-s">passengers</span></span>' +
      '</span>' +
    '</button>';
  }

  function renderLedger(c) {
    const sec = $('ledgerSection'), list = $('ledgerList'), capEl = $('ledgerCap'), foot = $('ledgerFoot'), all = $('viewAllBtn');
    const on = !!c.t && state.preview !== 'loading' && state.preview !== 'error';
    sec.hidden = !on;
    all.hidden = true;
    capEl.hidden = true;
    foot.hidden = !on;
    if (!on) { list.innerHTML = ''; return; }

    /* The vocabulary split, stated. The card above quotes the trip's
       terminals; these groups come from the location snapshot on each fare, so
       a pair can name any two places on the route. Shipped said nothing, and
       the driver had to assume the two disagreed. */
    foot.textContent = 'The card above shows this trip\'s terminals. These groups come from the boarding and drop-off points stored on each fare, so a pair can name any two places along the way.';

    if (c.party.length === 0) {
      /* Shipped's ListEmptyComponent: the trip exists and nothing was recorded
         against it. That is not the same as having no trip, and it does not
         get a solid primary — the trip is still the way out of here. */
      list.innerHTML = '<div class="inline-empty" data-od-id="ps-ledger-nofares">' +
        '<p class="label-s" style="color:var(--glass-on)">NO FARES ON THIS TRIP</p>' +
        '<p class="body-s" style="margin-top:6px">' + (c.t.status === 'ACTIVE'
          ? 'This trip is running and nothing has been recorded against it yet. The first fare you record appears here, grouped by where its passengers got on.'
          : 'This trip closed with nothing recorded against it.') + '</p></div>';
      return;
    }

    if (c.filtered === 0) {
      list.innerHTML = '<div class="inline-empty" data-od-id="ps-ledger-nomatch">' +
        '<p class="label-s" style="color:var(--glass-on)">NO GROUP MATCHES</p>' +
        '<p class="body-s" style="margin-top:6px">Nothing here matches &ldquo;' + esc(state.query.trim()) + '&rdquo;. The ' +
        plural(c.denom, 'passenger', 'passengers') + ' in scope are still on this trip.</p>' +
        '<div class="card-actions"><button type="button" class="ghost-btn" data-act="search-clear" data-od-id="ps-nomatch-clear">' +
        '<span class="label-l">Clear the search</span></button></div></div>';
      return;
    }

    list.innerHTML = c.shown.map(function (r) { return pairRow(r, c.denom); }).join('');
    capEl.hidden = !c.capped;
    if (c.capped) capEl.textContent = 'Showing the ' + PAIR_LIMIT + ' largest of ' + c.filtered + ' groups — ' + (c.filtered - PAIR_LIMIT) + ' more.';
    /* ALL GROUPS is a reading action, so it is never gated on anything. */
    all.hidden = false;
  }

  function renderNote(c) {
    $('storageNote').innerHTML = state.preview === 'loading'
      ? 'Reading the local store…'
      : state.preview === 'error'
        ? 'The local store did not answer. No figure on this screen is computed.'
        : !c.t
          ? 'Nothing is stored on this device yet. No network is used at any point.'
          : '<b class="strong">No names.</b> A passenger is a quantity, and the finest thing this app stores about one is the pair of places they travelled between. ' +
            (c.fares ? 'This trip&rsquo;s ' + c.total + ' were counted from ' + plural(c.fares, 'fare', 'fares') + ', ' : 'Everything here is ') +
            'all kept on this device — no network is used.';
  }

  const FIG_STACK = 300;
  function measure() {
    const scroll = $('scroll');
    const w = scroll ? Math.min(scroll.clientWidth, 720) : 390;
    const figs = document.querySelector('[data-figures]');
    if (figs) figs.classList.toggle('stacked', w < FIG_STACK);
  }

  function render() {
    const c = compute();
    renderChrome(c);
    renderCard(c);
    renderControls(c);
    renderLedger(c);
    renderNote(c);
    measure();
    renderOverlay();
  }

  /* ── overlays ──────────────────────────────────────────────────────── */
  function closeOverlay() {
    state.sheet = null;
    state.pairKey = null;
    renderOverlay();
    if (state.lastFocus && document.contains(state.lastFocus)) state.lastFocus.focus();
    state.lastFocus = null;
  }
  function openSheet(kind, arg) {
    state.lastFocus = document.activeElement;
    state.sheet = kind;
    state.pairKey = arg === undefined ? null : arg;
    renderOverlay();
    const f = $('overlayRoot').querySelector('[data-autofocus]');
    if (f) f.focus();
  }

  const detailRow = (k, v) => '<div class="detail-row"><span class="k body-m">' + k + '</span><span class="v body-m tabular">' + v + '</span></div>';

  function sheet(id, title, subtitle, body, foot) {
    return '<div class="scrim bottom" data-scrim="1"><div class="sheet bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="' + id + '" data-od-id="' + id + '-sheet">' +
      '<div class="sheet-head"><div class="sheet-titles"><h2 class="title-m" id="' + id + '">' + title + '</h2>' +
      (subtitle ? '<p class="body-s muted">' + subtitle + '</p>' : '') + '</div>' +
      '<button type="button" class="icon-btn" data-act="close" data-od-id="' + id + '-close" aria-label="Close" data-autofocus>' +
      icon('close', 18, 'currentColor', 2) + '</button></div>' +
      '<div class="sheet-body">' + body + (foot || '') + '</div></div></div>';
  }

  const handoff = (where, extra) =>
    '<div class="handoff"><p class="nb-title label-s">WHERE THIS GOES</p>' +
    '<p class="body-s">In the app this opens <b class="strong">' + where + '</b>. In this prototype it opens this preview, so the handoff and the figures it would carry are both visible without leaving the screen.' +
    (extra || '') + '</p></div>';

  function pickerSheetHTML(c) {
    const list = c.available.slice(0, PICKER_LIMIT);
    const more = c.available.length - list.length;
    return sheet('picker', 'Switch trip', plural(c.available.length, 'trip', 'trips') + ' on this device',
      list.map(function (t) {
        const live = t.status === 'ACTIVE';
        return '<button type="button" class="pick-row" data-pick="' + t.id + '" data-od-id="ps-pick-' + t.id + '" aria-current="' + (t.id === c.t.id ? 'true' : 'false') + '">' +
          '<span class="pk-body"><span class="pk-name title-m">' + t.origin + ' → ' + t.destination + '</span>' +
          '<span class="pk-sub body-s">#' + t.number + ' · ' + mediumDate(t.startedAt) + ' · ' +
          (live ? 'running now' : 'ended ' + clock(t.endedAt)) + '</span></span>' +
          (live ? '<span class="st-pill"><span class="st-pill-text label-s">RUNNING</span></span>' : '') + '</button>';
      }).join('') +
      (more > 0 ? '<p class="pick-more body-s">' + more + ' more ' + (more === 1 ? 'trip is' : 'trips are') +
        ' not listed here. A 45-day store runs to over a hundred, and scrolling them inside a trip screen is the wrong place for them — the full list opens Trip management, which is where they can be searched and filtered.' +
        '</p>' : ''),
      handoff('Trip management, the full trip list with its search and its filters'));
  }

  /* The parser conflict, made visible. Both the raw stored string and the
     municipality this screen derived from it are printed, because they are two
     different facts and only one of them is what the row above said. */
  function pairSheetHTML(c) {
    const hit = c.groups.filter(function (g) { return g.key === state.pairKey; })[0];
    if (!hit) return '';
    const rank = c.groups.indexOf(hit) + 1;
    const pct = Math.round(hit.qty / c.denom * 100);
    const mix = PT_ORDER.filter(function (k) { return hit.byType[k]; })
      .map(function (k) { return detailRow(PT_LABEL[k], hit.byType[k] + ' · ' + Math.round(hit.byType[k] / hit.qty * 100) + '%'); });
    return sheet('pair', pairLabel(hit), 'Group ' + rank + ' of ' + c.groups.length + ' on trip #' + c.t.number,
      detailRow('Passengers', hit.qty) +
      detailRow('Share in scope', pct + '% of ' + c.denom) +
      detailRow('Fares in this group', hit.fares) +
      detailRow('First boarded', clock(hit.first) + ' · ' + mediumDate(hit.first)) +
      detailRow('Last boarded', clock(hit.last) + ' · ' + mediumDate(hit.last)) +
      '<div class="detail-card" style="margin-top:12px">' + mix.join('') + '</div>' +
      detailRow('Boarding point, as stored', hit.from) +
      detailRow('Boarding municipality used', municipalityOf(hit.from)) +
      detailRow('Drop-off point, as stored', hit.to) +
      detailRow('Drop-off municipality used', municipalityOf(hit.to)) +
      detailRow('Trip terminals', c.t.origin + ' → ' + c.t.destination),
      handoff('nothing — reading a group does not navigate anywhere'));
  }

  function allPairsSheetHTML(c) {
    return sheet('allPairs', 'All boarding groups', 'Trip #' + c.t.number + ' · ' + plural(c.tripGroups, 'group', 'groups') + ' on this trip',
      '<div class="detail-card">' + c.groups.map(function (g, i) {
        return '<div class="detail-row"><span class="k body-m">' + (i + 1) + '. ' + pairLabel(g) + '</span>' +
          '<span class="v body-m tabular">' + g.qty + ' · ' + Math.round(g.qty / c.denom * 100) + '%</span></div>';
      }).join('') + '</div>' +
      detailRow('Distinct boarding municipalities', c.places) +
      detailRow('Fares on this trip', c.fares) +
      detailRow('Passengers on this trip', c.total),
      handoff('nothing on this screen — the cap is a reading limit, not a place'));
  }

  function goTripsSheetHTML(c) {
    return sheet('goTrips', 'Go to trips', 'Trip management',
      detailRow('Trips on this device', c.available.length) +
      detailRow('Running now', c.t && c.t.status === 'ACTIVE' ? 'Trip #' + c.t.number : 'None') +
      detailRow('Passengers on the running trip', c.t ? c.total : 0),
      handoff('Trip management, where trips are started, searched and cleared'));
  }

  function backSheetHTML(c) {
    return sheet('backHome', 'Back to Home', 'The root screen',
      detailRow('Trips on file', c.available.length) +
      detailRow('Running now', c.t && c.t.status === 'ACTIVE' ? 'Trip #' + c.t.number : 'None') +
      detailRow('Passengers on this trip', c.t ? c.total : 0),
      handoff('Home, the brand header and the quick actions'));
  }

  function renderOverlay() {
    const root = $('overlayRoot');
    if (!state.sheet) { root.innerHTML = ''; return; }
    const c = compute();
    root.innerHTML = state.sheet === 'picker' ? pickerSheetHTML(c)
      : state.sheet === 'pair' ? pairSheetHTML(c)
      : state.sheet === 'allPairs' ? allPairsSheetHTML(c)
      : state.sheet === 'goTrips' ? goTripsSheetHTML(c)
      : backSheetHTML(c);
  }

  function syncProto() {
    Array.prototype.forEach.call($('protoSeg').querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.state === state.preview ? 'true' : 'false');
    });
  }

  function setPreview(name) {
    state.preview = name;
    state.sheet = null;
    state.pairKey = null;
    state.query = '';
    state.filter = 'ALL';
    state.data = buildData();
    const available = orderAvailableTrips(state.data.trips);
    if (name === 'completed') {
      const done = available.filter(function (t) { return t.status === 'COMPLETED'; });
      state.tripId = done.length ? done[0].id : null;
    } else if (name === 'nofares') {
      /* A trip that exists and has nothing recorded against it — the branch
         shipped reached through ListEmptyComponent. */
      state.tripId = ACTIVE_ID;
      state.data.riders = state.data.riders.filter(function (r) { return r.tripId !== ACTIVE_ID; });
    } else if (name === 'notrips') {
      state.tripId = null;
      state.data = { trips: [], riders: [] };
    } else {
      state.tripId = ACTIVE_ID;
    }
    syncProto();
    render();
  }

  /* ── events ────────────────────────────────────────────────────────── */
  /* Only the backdrop itself closes. closest('[data-scrim]') would also match
     every control inside the sheet, so the sheet's own buttons would dismiss it
     instead of acting. */
  document.addEventListener('click', function (e) {
    const proto = e.target.closest('#protoSeg button');
    if (proto) { setPreview(proto.dataset.state); return; }
    if (e.target.hasAttribute && e.target.hasAttribute('data-scrim')) { closeOverlay(); return; }

    const act = e.target.closest('[data-act]');
    if (act) {
      const a = act.dataset.act;
      if (a === 'close') { closeOverlay(); return; }
      if (a === 'back') { openSheet('back'); return; }
      if (a === 'go-trips') { openSheet('goTrips'); return; }
      if (a === 'pick') { openSheet('picker'); return; }
      if (a === 'view-all') { openSheet('allPairs'); return; }
      if (a === 'retry') { setPreview('active'); return; }
      if (a === 'search-clear') { state.query = ''; $('pairSearch').value = ''; render(); return; }
      return;
    }

    const chip = e.target.closest('[data-filter]');
    if (chip) { state.filter = chip.dataset.filter; render(); return; }

    const pick = e.target.closest('[data-pick]');
    if (pick) {
      state.sheet = null;
      state.pairKey = null;
      state.lastFocus = null;
      state.tripId = Number(pick.dataset.pick);
      render();
      return;
    }

    const row = e.target.closest('[data-pair]');
    if (row) openSheet('pair', row.dataset.pair);
  });

  /* A search repaints the sentence and the rows, never the field, so the caret
     and the IME composition survive. */
  document.addEventListener('input', function (e) {
    if (!e.target || e.target.id !== 'pairSearch') return;
    state.query = e.target.value;
    const c = compute();
    $('searchClear').hidden = !state.query;
    renderSummary(c);
    renderLedger(c);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.sheet) closeOverlay();
  });

  /* ── boot ──────────────────────────────────────────────────────────── */
  state.data = buildData();
  state.tripId = ACTIVE_ID;
  syncProto();
  render();
  /* One paint a minute. Shipped ran TripClock's 1-second interval to keep a
     clock face honest; the only figure on this screen that moves by itself is
     the elapsed time on the card, and it is read at minute resolution. The
     tick stands down while a sheet is open or the search field has focus, so
     it can never yank a half-typed search out from under a thumb. */
  setInterval(function () {
    if (state.sheet) return;
    const el = document.activeElement;
    if (el && (el.id === 'pairSearch' || el.hasAttribute('data-autofocus'))) return;
    render();
  }, 60000);
  })();
  </script>
</body>
</html>

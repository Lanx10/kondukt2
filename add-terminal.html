<!doctype html>
<!--
  Kondukt - Add Terminal screen - Open Design prototype.
  Spliced from add-municipality.html: the handset shell, the tokens, the glass
  layer, .field, .km-line, the bottom sheet, .pick-row and the .note-lock are
  that screen's own bytes, so the three editors read as one form in three.

  WHAT THIS FILE IS FOR
  Settings ships a Terminal Configuration module (settings.html:968) and the app
  has TerminalEditorScreen behind it, but this prototype set has no terminal
  REGISTRY to sit above the form - there is no terminal list screen to go back
  to. So the back target is Settings, which is the only place the module is
  reachable from, and this file is the form half of a pair.

  THE THREE FIELDS ARE THE THREE COLUMNS
  `terminals` is id, name, km_marker, is_active, municipality_id (schema.ts,
  tripTicketsStore.ts:508-512). name and km_marker are the two the shipped
  TerminalEditorScreen already types. municipality_id is the third column, and
  the shipped form has no control for it - which is why one seed row already
  reads 'Subic, Subic' with municipality_id null.

  THE NAME STILL REFUSES A COMMA
  A stored terminal name is "place, municipality": 'Santa Cruz, Olongapo',
  'Iba, Zambales'. barangayNameOf() takes the FIRST comma and
  passengerState.municipalityOf() takes the LAST, so one comma is all it takes
  for the two readers to disagree. This screen types the place and the
  municipality as two separate values and composes the stored string itself, so
  the split is decided once - here - instead of by two readers that cannot both
  be right. The name field refuses a comma, as add-barangay.html and
  add-municipality.html both already do.

  THE KM IS THOUSANDTHS
  km_marker is an INTEGER NOT NULL in thousandths: 228_000 prints as 228.0 KM,
  and the trip reader sorts on it. This field takes a decimal, multiplies by
  1000 and rounds, exactly as add-barangay.html's marker does. The caption
  quotes the markers already registered in the chosen municipality, so a new
  number is typed next to the truth instead of beside nothing.

  THE WRITE TARGET
  The app has no saveTerminal(). The seed's INSERT (tripTicketsStore.ts:762) is
  the only terminal write and it runs once, at first open. This screen defines
  the next one on the contract the other two editors already use:
  kondukt.terminals.added, appended by the registry on load.

  THE SEED TABLE CANNOT CARRY ITS LINKS
  The five terminals below are the app's own rows, verbatim, and every one of
  them reads mid: null. Their municipality_id values point at the app's three
  seeded municipalities, whose ids collide with this suite's shared 19-row
  registry table (barangay-config.html, add-municipality.html, add-barangay.html
  all read that same list) - and the app's own municipality seed is the comma
  bug: name 'Olongapo, Zambales' in a row whose province column is 'Zambales'.
  So the linkage is proved on the rows this screen writes itself, and the KM
  context honestly reads "no marker registered here yet" until one is added.

  ponytail: the style block is add-municipality.html's bytes, all 60KB of them,
  so rules only the other editors use (.ab-save, #addBtn, .tk, .run-card, .leg,
  .action-bar) are dead weight here. Kept on purpose - a second authored
  stylesheet would be 60KB of hand-copied tokens that drift from the registry
  on the first change. Drop the unused rules when a shared form stylesheet earns
  its own file.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kondukt · Add Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>



    @layer od-layout {
      .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
      .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
      .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
      .od-fill    { flex: 1 1 0; min-width: 0; }
      .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
      :where(.od-stack,.od-row,.od-cluster,.od-grid,.od-stat) > :where(*) { min-width: 0; }
      .od-stat { display: grid; gap: var(--od-gap, 2px); }
      .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .od-clamp-2 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; -webkit-line-clamp: 2; overflow-wrap: anywhere; }
    }

    :root {
      /* ── kondukt M3 warm palette (src/theme.ts) ───────────────────────── */
      --primary:#E65100; --on-primary:#FFFFFF; --primary-container:#FFE6D2; --on-primary-container:#4E2200;
      --primary-solid:#C2410C; --primary-solid-hover:#A93A09;
      --secondary:#FFB300; --on-secondary:#3D2E00; --secondary-container:#FFEFC7; --on-secondary-container:#4A3600;
      --secondary-fg:#8A6100;
      /* Foregrounds for the solid-amber card, measured against #FFB300:
         7.4:1 / 5.8:1 / 4.9:1. These were raw hex before; tokens keep the two
         amber cards (Home hero, Dashboard status) provably identical. */
      --on-secondary-detail:#4F3D2B; --on-secondary-muted:#5B4720; --on-secondary-faint:#6B5518;
      --tertiary:#546E7A; --on-tertiary:#FFFFFF; --tertiary-container:#DDE6EA; --on-tertiary-container:#162B33;
      --error:#BA1A1A; --on-error:#FFFFFF; --error-container:#FFDAD6; --on-error-container:#410002;
      --background:#FDF7F3; --surface:#FDF7F3; --surface-lowest:#FFFFFF; --surface-low:#F7EFE9;
      --surface-container:#F2E9E2; --surface-high:#ECE3DC;
      --on-surface:#221A15; --on-surface-variant:#53433B; --outline:#85736B; --outline-variant:#D7C2B7;
      --scrim:rgba(34,26,21,.32);

      /* glass layer */
      --glass-tint:rgba(255,255,255,.58);
      --glass-rim:rgba(255,255,255,.85);
      --glass-on:#1A2029; --glass-on-variant:#4A5568;
      --glass-accent-primary:#8F3A00; --glass-accent-secondary:#6B4B00; --glass-accent-tertiary:#334A56;
      --glass-shadow:rgba(90,106,130,.16);

      --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px; --radius-glass:28px; --radius-full:999px;
      --font: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      /* shell vars (from the neutral OD handset) */
      --phone-screen-width:390px; --phone-screen-height:844px; --phone-bezel:10px;
      --phone-outer-radius:52px; --phone-screen-radius:42px;
      --phone-safe-top:50px; --phone-safe-bottom:29px;
      --phone-system-fg:#17181a; --phone-screen-bg:#f8f8f9; --phone-stage-bg:#eaebee;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh; display: grid; place-items: center; padding: 32px;
      background: radial-gradient(circle at 50% 15%, rgba(255,255,255,.94), transparent 35%), var(--phone-stage-bg);
      color: #191a1d; font-family: var(--font);
    }

    /* ── handset shell ─────────────────────────────────────────────────── */
    .phone-frame {
      position: relative;
      width: calc(var(--phone-screen-width) + var(--phone-bezel) * 2);
      height: calc(var(--phone-screen-height) + var(--phone-bezel) * 2);
      padding: var(--phone-bezel); border-radius: var(--phone-outer-radius);
      background: linear-gradient(145deg, rgba(255,255,255,.2), transparent 17%), linear-gradient(160deg, #3f4146 0%, #202227 48%, #0b0c0f 100%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.13), inset 0 0 0 2px rgba(0,0,0,.85), 0 32px 68px -20px rgba(10,12,16,.52), 0 10px 24px -10px rgba(10,12,16,.32);
      isolation: isolate;
    }
    .phone-frame::before, .phone-frame::after {
      content: ""; position: absolute; z-index: -1; top: 96px; bottom: 96px; width: 2px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,.13) 16%, transparent 30%, transparent 72%, rgba(255,255,255,.07) 88%, transparent);
    }
    .phone-frame::before { left: 0; } .phone-frame::after { right: 0; }
    .hardware-button { position: absolute; width: 4px; border-radius: 3px; background: linear-gradient(90deg,#08090b,#2a2d33 60%,#08090b); box-shadow: inset 0 1px rgba(255,255,255,.08); }
    .hardware-button.volume { left: -3px; top: 222px; height: 86px; }
    .hardware-button.power { right: -3px; top: 270px; height: 82px; }

    .phone-screen {
      position: relative; width: var(--phone-screen-width); height: var(--phone-screen-height);
      overflow: hidden; border-radius: var(--phone-screen-radius); background: var(--phone-screen-bg);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
    }
    .phone-content { position: absolute; inset: 0; overflow: hidden; padding: 0; background: transparent; }

    .status-bar { position: absolute; z-index: 40; inset: 0 0 auto; height: var(--phone-safe-top); display: grid; grid-template-columns: minmax(0,1fr) 56px minmax(0,1fr); align-items: start; padding: 14px 20px 0; color: var(--phone-system-fg); opacity: .8; pointer-events: none; }
    .status-time { justify-self: start; display: flex; align-items: center; height: 15px; font-size: 14px; font-weight: 560; line-height: 1; letter-spacing: .01em; font-family: system-ui, sans-serif; }
    .status-cutout-zone { width: 56px; }
    .status-icons { justify-self: end; display: inline-flex; align-items: center; height: 15px; gap: 6px; }
    .status-icons svg { display: block; flex: none; fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
    .status-icons .connectivity { width: 15px; height: 12px; } .status-icons .wifi { width: 15px; height: 12px; } .status-icons .battery { width: 19px; height: 11px; }
    .camera-dot { position: absolute; z-index: 45; top: 13px; left: 50%; width: 10px; height: 10px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle at 38% 35%, #344154 0 12%, #0a0c10 34%, #000 76%); box-shadow: 0 0 0 1px rgba(255,255,255,.06); pointer-events: none; }
    .gesture-indicator { position: absolute; z-index: 45; left: 50%; bottom: 8px; width: 96px; height: 4px; transform: translateX(-50%); border-radius: 99px; background: var(--phone-system-fg); opacity: .86; pointer-events: none; }

    /* ── app root ──────────────────────────────────────────────────────── */
    #app {
      position: relative; height: 100%; display: flex; flex-direction: column;
      color: var(--glass-on);
      background:
        radial-gradient(125% 82% at 6% -4%, #FBC9A8 0%, rgba(246,227,212,.78) 32%, rgba(244,247,251,0) 63%),
        radial-gradient(130% 88% at 104% 104%, #C6D9E8 0%, rgba(228,233,242,.72) 34%, rgba(244,247,251,0) 66%),
        #F4F7FB;
    }
    .app-scroll {
      flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
      padding-bottom: var(--phone-safe-bottom);
    }
    .app-scroll::-webkit-scrollbar { display: none; }

    .readable { width: 100%; max-width: 720px; margin-inline: auto; padding-inline: 20px; }
    .pad-x { padding-inline: 20px; }

    /* ── typography roles ──────────────────────────────────────────────── */
    .display-s { font-weight: 700; font-size: 28px; line-height: 36px; letter-spacing: -.3px; }
    .headline-s { font-weight: 600; font-size: 20px; line-height: 27px; letter-spacing: -.3px; }
    .title-m { font-weight: 600; font-size: 16px; line-height: 23px; }
    .body-m { font-weight: 400; font-size: 14px; line-height: 21px; }
    .body-s { font-weight: 400; font-size: 12px; line-height: 18px; }
    .label-l { font-weight: 600; font-size: 15px; line-height: 20px; }
    .label-s { font-weight: 600; font-size: 11px; line-height: 16px; letter-spacing: .6px; }
    .tabular { font-variant-numeric: tabular-nums; }
    .muted { color: var(--glass-on-variant); }
    .strong { color: var(--glass-on); }
    p { margin: 0; }

    /* ── glass surface ─────────────────────────────────────────────────── */
    .glass {
      position: relative; border-radius: var(--radius-glass);
      background: var(--glass-tint);
      box-shadow: 0 8px 15px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.55);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      backdrop-filter: blur(18px) saturate(180%);
    }
    .glass > * { position: relative; z-index: 1; }
    .glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: rgba(120,130,150,.5); opacity: .035; pointer-events: none; }
    .glass::after  { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 1px solid var(--glass-rim); pointer-events: none; z-index: 2; }

    /* ── chrome (SectionChrome) ────────────────────────────────────────── */
    .chrome { display: flex; align-items: center; gap: 12px; flex: none; padding: calc(var(--phone-safe-top) + 12px) 20px 12px; }
    .back {
      width: 44px; height: 44px; border-radius: var(--radius-full); border: 0; background: var(--primary-solid);
      display: grid; place-items: center; cursor: pointer; flex: none;
      box-shadow: 0 8px 15px var(--glass-shadow);
    }
    .title-card {
      flex: 1 1 auto; min-width: 0; min-height: 44px; padding: 5px 16px; border-radius: var(--radius-full);
      background: var(--primary-solid); display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
      box-shadow: 0 8px 15px var(--glass-shadow);
    }
    .chrome-title { color: var(--on-primary); margin: 0; }
    .chrome-sub { color: var(--on-primary); margin: 1px 0 0; }

    /* ── section header (SectionHeader) ────────────────────────────────── */
    .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 20px; margin-bottom: 12px; }
    .sec-title { color: var(--glass-on-variant); margin: 0; }
    .text-action { border: 0; background: none; padding: 0 4px; min-height: 48px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; color: var(--glass-accent-primary); font-family: inherit; flex: none; }
    .text-action .label-s { color: inherit; }
    /* Hover must not lighten the label — the only change is a rule under it,
       so the 6.9:1 default is also the hover contrast. */
    .text-action:hover { text-decoration: underline; text-underline-offset: 3px; }
    /* Add is the one commit on this screen, so it is the one solid pill.
       The ID beats .text-action/:focus-visible so the pill keeps its radius. */
    #addBtn { padding: 0 20px; min-height: 48px; border-radius: var(--radius-full); background: var(--primary-solid); color: var(--on-primary); font-weight: 600; }
    #addBtn:hover, #addBtn:active { text-decoration: none; background: var(--primary-solid-hover); }

    /* ── status card: the four-way state machine ───────────────────────── */
    .status-card { padding: 20px; }
    .status-card .st-eyebrow { color: var(--glass-on-variant); }
    .status-card .st-title { color: var(--glass-on); margin: 8px 0 0; }
    .status-card .st-detail { color: var(--glass-on-variant); margin: 4px 0 0; }
    .status-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 12px; }
    /* Amber is reserved for the one thing a conductor registers without
       reading: a trip that is running right now. Dark-on-amber measures
       7.4:1 for the title and 5.8:1 for the detail line, where the pale
       containers would sit at ~1.5:1. */
    .amber-btn {
      min-height: 48px; padding: 0 20px; border: 0; border-radius: var(--radius-full);
      background: var(--secondary); color: var(--on-secondary); cursor: pointer; font-family: inherit;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .glass.status-solid { background: var(--secondary); }
    .glass.status-solid::before, .glass.status-solid::after { display: none; }
    .status-solid .st-eyebrow, .status-solid .st-title { color: var(--on-secondary); }
    .status-solid .st-detail { color: var(--on-secondary-detail); }
    .status-solid .st-pill { background: var(--on-secondary); }
    .status-solid .st-pill-text { color: var(--secondary); }
    .status-solid .st-dot { background: var(--secondary); }
    .st-head { display: flex; align-items: center; gap: 12px; }
    .st-icon { width: 48px; height: 48px; border-radius: var(--radius-md); display: grid; place-items: center; flex: none; }
    .status-solid .st-icon { background: var(--on-secondary); }
    .st-head-text { flex: 1 1 auto; min-width: 0; }
    /* The pill is a container, so the label is its on-color. Pairing it with
       --on-secondary-container on a --on-secondary-container fill made the
       text the same brown as its own background: 1.0:1, invisible. */
    .st-pill { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 10px; border-radius: var(--radius-full); background: var(--secondary-container); }
    .st-pill-text { color: var(--on-secondary-container); }
    .status-solid .st-pill-text { color: var(--secondary); }
    .st-dot { width: 6px; height: 6px; border-radius: 3px; background: var(--on-secondary-container); flex: none; }
    .st-route { margin: 8px 0 0; color: var(--glass-on); }
    .st-meta { margin: 12px 0 0; color: var(--glass-on-variant); font-variant-numeric: tabular-nums; }
    .data-chip { display: inline-flex; align-items: center; margin-top: 10px; padding: 3px 10px; border-radius: var(--radius-full); background: var(--tertiary-container); color: var(--on-tertiary-container); }

    /* ── period control (shared with History) ──────────────────────────── */
    .range-card { padding: 14px 14px 16px; }
    .range-top { display: flex; align-items: center; gap: 10px; }
    .segment { flex: 1 1 auto; min-width: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: var(--radius-full); background: rgba(255,255,255,.55); border: 1px solid var(--outline-variant); }
    .seg-btn { min-height: 44px; border: 0; border-radius: var(--radius-full); background: transparent; color: var(--glass-on-variant); cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; }
    .seg-btn[aria-checked="true"] { background: var(--primary-solid); color: var(--on-primary); }
    .seg-btn[aria-checked="true"] .label-l { font-weight: 700; }
    .cal-btn { width: 48px; min-height: 48px; border-radius: var(--radius-full); border: 1px solid var(--outline-variant); background: rgba(255,255,255,.55); color: var(--glass-accent-primary); cursor: pointer; flex: none; display: grid; place-items: center; }
    .cal-btn.on { background: var(--primary-container); border: 2px solid var(--primary); color: var(--on-primary-container); }
    .range-nav { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .nav-btn { width: 48px; height: 48px; border-radius: var(--radius-full); border: 1px solid var(--outline-variant); background: rgba(255,255,255,.55); color: var(--glass-on); cursor: pointer; flex: none; display: grid; place-items: center; }
    .nav-btn:disabled { opacity: .4; cursor: default; }
    .range-now { flex: 1 1 auto; min-width: 0; text-align: center; }
    .range-now-main { display: block; color: var(--glass-on); }
    .range-now-sub { display: block; color: var(--glass-on-variant); margin-top: 2px; }
    .range-caption { margin: 10px 0 0; display: flex; align-items: flex-start; gap: 8px; color: var(--glass-on-variant); }
    .range-caption .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); flex: none; margin-top: 7px; }

    /* ── summary disclosure ────────────────────────────────────────────── */
    .summary { padding: 18px 20px; }
    .summary-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .summary-eyebrow { color: var(--glass-on-variant); }
    .detail-btn { border: 0; background: none; cursor: pointer; min-height: 44px; padding: 0 2px; display: inline-flex; align-items: center; gap: 4px; color: var(--glass-accent-primary); font-family: inherit; flex: none; }
    .detail-btn svg { transition: transform .2s ease; }
    .summary.open .detail-btn svg { transform: rotate(180deg); }
    .hero { margin-top: 12px; }
    .hero-label { color: var(--glass-on-variant); }
    .hero-value { margin: 4px 0 0; color: var(--glass-on); }
    .hero-meta { margin: 8px 0 0; color: var(--glass-on-variant); display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .hero-meta b { color: var(--glass-on); font-weight: 600; }
    .summary-details { display: none; margin-top: 20px; }
    .summary.open .summary-details { display: block; }
    .summary-details .rule { height: 1px; background: var(--outline-variant); opacity: .7; margin: 18px 0; }
    .stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
    .stat-grid.stacked { grid-template-columns: minmax(0,1fr); }
    .stat-tile { padding: 16px; }
    .stat-icon { width: 40px; height: 40px; border-radius: var(--radius-md); display: grid; place-items: center; }
    .stat-label { margin: 12px 0 0; color: var(--glass-on-variant); }
    .stat-value { margin: 4px 0 0; color: var(--glass-on); }
    .breakdown { margin-top: 14px; display: grid; gap: 12px; }
    .bd-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; align-items: baseline; }
    .bd-name { color: var(--glass-on); }
    .bd-count { color: var(--glass-on); font-weight: 600; }
    .bd-track { grid-column: 1 / -1; height: 8px; border-radius: var(--radius-full); background: var(--surface-container); overflow: hidden; }
    .bd-fill { height: 100%; border-radius: inherit; background: var(--primary-solid); }

    /* ── rows ──────────────────────────────────────────────────────────── */
    .list { display: grid; gap: 12px; }
    /* font-size: inherit is load-bearing here, and the four sibling screens are
       all missing it. A button inherits the UA's 13.333px control size, so a
       ledger row that is a <button> painted its bare .cat at 13.33px while the
       very same row as a locked <div> painted it at 16px — one ledger, two
       sizes, switching with the recording gate. */
    .row-btn { border: 0; margin: 0; width: 100%; text-align: left; font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; border-radius: var(--radius-glass); display: block; }
    .row-btn:active { transform: scale(.995); }
    /* flex-start, not center: the route column is 199px and the longest pair
       ("Baclaran \u2192 Monumento") is 197px in Poppins 600/16, so a wider build
       of Poppins still adds a line. Centring would then float the 40px icon and
       the money block in the middle of a 106px card. Top-aligned, the icon and
       the peso sit on the route's cap line whether the row is one line or two.
       Gap is 8, not 12: measured, the 12px gap left the route 6px short of its
       longest pair. ponytail: 2px of slack - shorten station names (or drop the
       spaces around the arrow) if the font is ever swapped. */
    .trip-head { display: flex; align-items: flex-start; gap: 8px; }
    .trip-icon { width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--tertiary-container); display: grid; place-items: center; flex: none; }
    .trip-body { flex: 1 1 auto; min-width: 0; }
    .trip-route { display: block; color: var(--glass-on); }
    .trip-sub { display: block; margin: 4px 0 0; color: var(--glass-on-variant); }
    .status { padding: 3px 10px; border-radius: var(--radius-full); flex: none; }
    .status.active { background: var(--secondary-container); color: var(--on-secondary-container); }
    .status.done { background: var(--tertiary-container); color: var(--on-tertiary-container); }
    /* Structural dividers use --outline, not --outline-variant: the variant
       sits at 1.7:1 on this field and the 6-row list loses its structure. */
    .meta-line { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--outline); display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--glass-on-variant); }
    .fare { display: inline-flex; align-items: baseline; gap: 6px; color: var(--glass-on); white-space: nowrap; }
    .meta-line .fare { margin-left: auto; }
    .fare b { font-weight: 700; }
    .ticket-row { display: flex; align-items: flex-start; gap: 12px; }
    .ticket-id { min-width: 62px; flex: none; }
    .ticket-id .when { display: block; color: var(--glass-on-variant); }
    .ticket-mid { flex: 1 1 auto; min-width: 0; }
    .ticket-route { color: var(--glass-on); }
    .ticket-meta { margin: 4px 0 0; color: var(--glass-on-variant); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
    .cat { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: var(--radius-full); }
    .cat.regular { background: var(--primary-container); color: var(--on-primary-container); }
    .cat.student, .cat.senior, .cat.pwd { background: var(--tertiary-container); color: var(--on-tertiary-container); }
    .ticket-fare { text-align: right; color: var(--glass-on); flex: none; }
    .ticket-fare .each { display: block; color: var(--glass-on-variant); }
    .ticket-fare b { font-weight: 700; }
    .rows-stacked .ticket-row { flex-wrap: wrap; }
    .rows-stacked .ticket-fare { text-align: left; width: 100%; }
    .rows-stacked .ticket-fare .each { display: inline; margin-left: 6px; }
    .rows-stacked .meta-line { flex-direction: column; align-items: flex-start; }
    .rows-stacked .meta-line .fare { margin-left: 0; }

    /* ── inline empty + storage ────────────────────────────────────────── */
    .inline-empty { padding: 16px 18px; border: 1px solid var(--outline-variant); border-radius: var(--radius-xl); background: rgba(255,255,255,.5); }
    .inline-empty p { color: var(--glass-on-variant); }
    .storage { margin-top: 20px; padding: 12px 20px; display: flex; align-items: center; gap: 8px; }
    .storage p { color: var(--glass-on-variant); }

    /* ── states ────────────────────────────────────────────────────────── */
    .state { padding: 20px; border-radius: var(--radius-xl); border: 1px solid var(--outline-variant); background: rgba(255,255,255,.55); }
    .state.error { border-color: var(--error); background: var(--error-container); }
    .state h3 { margin: 0; color: var(--glass-on); }
    .state p { margin: 8px 0 0; color: var(--glass-on-variant); }
    .state.error p { color: var(--on-error-container); }
    .primary-btn { margin-top: 14px; min-height: 48px; padding: 0 20px; border-radius: var(--radius-lg); border: 0; background: var(--primary-solid); color: var(--on-primary); cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 8px; }
    .primary-btn:hover { background: var(--primary-solid-hover); }
    .skeleton { padding: 16px; }
    .sk { border-radius: 8px; background: linear-gradient(90deg, rgba(0,0,0,.05) 25%, rgba(0,0,0,.09) 37%, rgba(0,0,0,.05) 63%); background-size: 400% 100%; animation: shim 1.4s ease infinite; }
    @keyframes shim { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
    @media (prefers-reduced-motion: reduce) { .sk { animation: none; } .detail-btn svg { transition: none; } }

    /* ── overlays (calendar modal / detail sheet) ──────────────────────── */
    .overlay-root { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
    /* grid-template-rows: minmax(0, 1fr) is load-bearing, not tidiness. With an
       auto row the grid area is indefinite in the block axis, so the sheet's
       max-height: 100% resolved against nothing and computed to none: the trip
       picker measured 924px and the all-groups sheet 1223px inside an 844px
       phone, hanging 80px and 379px past the bottom edge with their last rows
       unreachable — .sheet-body never scrolled because it was never given a
       height to scroll inside. A definite 1fr row fixes the percentage, and the
       two rules below fix the flex side of the same bug. */
    .scrim { position: absolute; inset: 0; background: var(--scrim); display: grid; grid-template-rows: minmax(0, 1fr); pointer-events: auto; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
    .scrim.center { place-items: center; padding: 16px; }
    /* The 17-row stop list is tall enough to hit max-height: 100%, so its sheet
       fills the phone top to bottom and .sheet-head landed at y=0 — the sheet
       title painted underneath the fake clock and the notch. The scrim's
       background still covers the padding (background-clip defaults to
       border-box), only the sheet is pushed below the status bar. */
    .scrim.bottom { align-items: end; padding-top: var(--phone-safe-top); }
    .sheet { width: 100%; max-width: 360px; margin: 0 auto; background: var(--surface-lowest); border-radius: var(--radius-xl); pointer-events: auto; max-height: 100%; display: flex; flex-direction: column; }
    .sheet.bottom-sheet { border-radius: var(--radius-xl) var(--radius-xl) 0 0; max-width: 720px; animation: slideUp .22s ease; }
    @keyframes slideUp { from { transform: translateY(14px); opacity: .6; } to { transform: none; opacity: 1; } }
    /* flex: none so the title can never be squeezed, and min-height: 0 on the
       body so it can — a flex item defaults to min-height: auto, which pins it
       to its content height and makes the sheet overflow instead of scrolling. */
    .sheet-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px 8px; flex: none; }
    .sheet-titles { flex: 1 1 auto; min-width: 0; }
    .sheet-head h2 { margin: 0; color: var(--on-surface); }
    .sheet-titles p { margin: 2px 0 0; }
    .sheet-body { padding: 0 20px var(--phone-safe-bottom); overflow-y: auto; min-height: 0; }
    .icon-btn { width: 44px; height: 44px; border-radius: var(--radius-full); border: 1px solid var(--outline-variant); background: transparent; color: var(--on-surface-variant); display: grid; place-items: center; cursor: pointer; flex: none; }
    .icon-btn:hover { background: var(--surface-container); }
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
    .cal-month { color: var(--on-surface); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 8px; }
    .cal-dow { text-align: center; color: var(--on-surface-variant); padding: 6px 0; }
    .cal-cell { position: relative; height: 44px; border: 0; background: none; cursor: pointer; border-radius: var(--radius-md); color: var(--on-surface); font-family: inherit; }
    .cal-cell.out { color: var(--outline); }
    .cal-cell.inrange { background: var(--primary-container); border-radius: 0; }
    .cal-cell.edge { background: var(--primary-solid); color: var(--on-primary); border-radius: var(--radius-md); font-weight: 600; }
    .cal-cell.today::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 4px; height: 4px; transform: translateX(-50%); border-radius: 50%; background: var(--primary); }
    .cal-cell.edge.today::after { background: var(--on-primary); }
    .cal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 16px; }
    .cal-actions .ghost { min-height: 48px; padding: 0 12px; border: 0; background: none; color: var(--on-surface-variant); cursor: pointer; font-family: inherit; }
    .cal-actions .apply { min-height: 48px; padding: 0 20px; border-radius: var(--radius-lg); border: 0; background: var(--primary-solid); color: var(--on-primary); cursor: pointer; font-family: inherit; }
    .cal-error { margin: 10px 0 0; color: var(--error); }
    .range-preview { margin: 12px 0 0; color: var(--on-surface-variant); }
    .detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--outline); }
    .detail-row:last-child { border-bottom: 0; }
    .detail-row .k { color: var(--on-surface-variant); flex: none; }
    .detail-row .v { color: var(--on-surface); font-weight: 600; text-align: right; }
    /* The card insets its own rows so every key in the sheet starts at the
       same 20px column as the title, instead of drifting in by 14px. */
    .detail-card { border: 1px solid var(--outline-variant); border-radius: var(--radius-lg); margin-top: 12px; }
    .detail-card .detail-row { padding-inline: 12px; }

    /* ── add trip: two terminals, one road, and what that road will bill ── */
    /* Author display rules beat the UA [hidden] rule on cascade origin, so a
       hidden attribute on any of the flex/grid elements this screen toggles
       would not hide it. One guard covers all of them. */
    [hidden] { display: none !important; }
    /* The chrome carries the trip number and the road, and the road string
       changes length with the choice. Never let it wrap to a second line inside
       the pill and push the title card taller than its neighbours. */
    .chrome-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .card { margin-top: 20px; padding: 20px; border: 1px solid var(--outline-variant); border-radius: var(--radius-xl); background: rgba(255,255,255,.55); }
    /* A .sec-head is a sibling margin, but the card already has 20px of padding,
       so margin collapse cannot reach it: left alone it lands its title 40px
       down. Every card on this screen has a header, so the rule is
       unconditional here. */
    .card > .sec-head:first-child { margin-top: 0; }
    /* font-size: inherit is load-bearing on a <button> for the reason it is on
       .row-btn: a button inherits the UA's 13.333px control size, and neither
       .f-label nor .f-value sets a size, so the label and the value inside one
       field would paint two steps apart from the sizes they declare. */
    .field { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 8px 14px; border: 1px solid var(--outline); border-radius: var(--radius-lg); background: var(--surface); color: var(--on-surface); font-family: inherit; font-size: inherit; text-align: left; cursor: pointer; }
    .field:hover { background: var(--surface-container); }
    .f-icon { width: 36px; height: 36px; border-radius: var(--radius-sm); display: grid; place-items: center; flex: none; background: var(--tertiary-container); color: var(--on-tertiary-container); }
    .f-body { flex: 1 1 auto; min-width: 0; }
    .f-label { display: block; color: var(--on-surface-variant); }
    .f-value { display: block; color: var(--on-surface); font-weight: 600; }
    /* --outline is a 1px border token, specified for the 3:1 non-text floor. On
       16px text it measured 4.24:1 against the field's own surface, under AA, on
       the one line that tells a first-time driver what this control wants. The
       placeholder still reads as a placeholder on weight alone (500 vs 600). */
    .f-value.empty { color: var(--on-surface-variant); font-weight: 500; }
    .f-chev { flex: none; color: var(--on-surface-variant); display: inline-flex; }
    /* No .field + .field rule here, and there must not be one: the leg sits
       between the two fields and owns the space. A sibling margin would put 8px
       of daylight above the destination and 8px below the origin, so the swap
       control would be the only thing in the card that is off-axis. */

    /* The leg between the two ends carries the swap, not a legend. A trip runs
       one way and the direction is the thing being corrected, so the control
       sits ON the axis joining the two ends, where it reads as the reverse of
       the leg rather than as a third input. Note what it does NOT change: the
       quoted distance is Math.abs(km difference), so it reads the same in
       both directions. Only the direction of travel differs, and only the
       direction is stored. */
    /* 12 top AND bottom, not 12 0 0: with the bottom at 0 the swap circle's
       edge landed on the destination's border, and two 1px borders meeting
       read as one broken rule with the control welded to the field. */
    /* 1fr auto 1fr, not flex with the distance as a fourth sibling: the quoted
       distance is a CAPTION on the leg, not a rung of it. As a flex sibling it
       took 49px off the right-hand line and pushed the swap circle 27px left of
       the card's axis, so the control that reverses the trip was off the line
       joining the two ends it reverses. The two 1fr columns are equal by
       construction, so the circle is on the axis to the subpixel and the lines
       stay mirror images. */
    .leg { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; column-gap: 8px; row-gap: 8px; margin: 12px 0; color: var(--on-surface-variant); }
    .leg .leg-line { height: 1px; background: var(--outline); }
    .leg .leg-dist { grid-column: 1 / -1; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
    /* padding: 0 for the same reason .row-btn carries it: a 44x44 border-box
       button survives the UA's 1px/6px padding in size, but the 1px top and
       bottom push the glyph off centre in a grid-placed control. */
    .swap-btn { width: 44px; height: 44px; flex: none; padding: 0; border-radius: var(--radius-full); border: 1px solid var(--outline); background: var(--surface); color: var(--on-surface); font-family: inherit; display: grid; place-items: center; cursor: pointer; }
    .swap-btn:hover { background: var(--surface-container); }
    /* .45 put the glyph at 2.82:1, under the 3:1 this screen holds everything
       else to. .55 lands at 3.77:1 and still reads unmistakably disabled. */
    .swap-btn:disabled { opacity: .55; cursor: default; }
    .swap-btn:disabled:hover { background: var(--surface); }
    .leg-hint { margin: 8px 0 0; color: var(--error); }

    /* Two roads, so a two-way switch and not a chip row: a chip implies
       filtering a set, and this is one choice between two exclusive options
       where the second bills materially more per kilometre. */
    .seg-route { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
    .seg-route button { min-height: 44px; padding: 8px 10px; border: 1px solid var(--outline); border-radius: var(--radius-lg); background: var(--surface); color: var(--on-surface); font-family: inherit; font-size: inherit; text-align: left; cursor: pointer; }
    .seg-route button:hover { background: var(--surface-container); }
    .seg-route button[aria-pressed="true"] { border: 2px solid var(--primary-solid); background: var(--primary-container); color: var(--on-primary-container); padding: 7px 9px; }
    .seg-route .sr-name { display: block; font-weight: 600; }
    .seg-route .sr-note { display: block; margin-top: 2px; color: var(--on-surface-variant); }
    .seg-route button[aria-pressed="true"] .sr-note { color: var(--on-primary-container); }
    /* The consequence of picking the express way, stated rather than implied. The
       adjustment is real configuration (sctex_km_adjustment_milli) and it adds
       distance the driver is not driving but is billed for, on every boarding on
       the trip, and it also swaps the rate. */
    .road-note { margin: 12px 0 0; padding: 12px; border-radius: var(--radius-md); background: var(--secondary-container); color: var(--on-secondary-container); }

    /* A trip has no fare, so this card has no total. It is the four inputs every
       boarding on the trip will be priced from, and the rows reuse .detail-row —
       the same key/value recipe the sheets use — so a figure here and a figure in
       a ticket sheet are the same object. The wrapper exists for one reason:
       :last-child cannot see past the footnote that follows the last row, so
       without it the final row keeps a rule that means nothing. */
    .est-rows > .detail-row:last-child { border-bottom: 0; }

    /* ── shared with add-ticket.html and passenger.html ────────────────── */
    /* Copied rather than renamed, so a picker row and a handoff are the same
       56px object on all eight screens. */
    .pick-row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 12px; border: 1px solid var(--outline); border-radius: var(--radius-lg); background: var(--surface); color: var(--on-surface); font-family: inherit; font-size: inherit; text-align: left; cursor: pointer; margin-top: 8px; width: 100%; }
    .pick-row:hover { background: var(--surface-container); }
    /* 2px border on the current terminal and 1px less padding, so choosing a row
       does not resize the list under the finger. */
    .pick-row[aria-current="true"] { border: 2px solid var(--primary-solid); background: var(--primary-container); color: var(--on-primary-container); padding: 7px 11px; }
    .pick-row .pk-body { flex: 1 1 auto; min-width: 0; }
    .pick-row .pk-name { display: block; }
    .pick-row .pk-sub { display: block; margin-top: 2px; color: var(--on-surface-variant); }
    .pick-row[aria-current="true"] .pk-sub { color: var(--on-primary-container); opacity: .85; }
    .pick-more { margin: 12px 0 0; padding: 12px 16px; border: 1px dashed var(--outline); border-radius: var(--radius-lg); color: var(--on-surface-variant); }
    .handoff { margin: 16px 0 0; padding: 12px 20px; border: 1px dashed var(--outline); border-radius: var(--radius-lg); background: rgba(255,255,255,.42); }
    .handoff p { color: var(--on-surface-variant); }
    .handoff .nb-title { color: var(--on-surface); margin: 0 0 4px; }
    :focus-visible { outline: 2px solid var(--primary-solid); outline-offset: 2px; border-radius: 6px; }

    /* ── the one committing action ────────────────────────────────────── */
    /* Solid, and the only solid primary in the viewport. It is also the only
       thing on this screen that leaves it, so it gets the only amber... which
       it does not: amber on these screens means a trip is already RUNNING, and
       this is the screen that makes one. The commit stays --primary-solid. */
    /* The 20px section margin belongs to the SECTION here, and .primary-btn's own
       14px is zeroed inside it. Left alone, the button was the only thing on the
       screen with a margin, so the estimate card and the CTA sat 14px apart while
       every other pair of sections sat 20 — a 6px break in the rhythm at the
       place the eye lands last. Adjacent margins collapse, so the two cannot be
       added to reach 20; one of them has to go. This is the local version, and
       the other seven screens keep the shell's 14px. The blocked branch states a
       reason above the button, so it hands the gap back to .block-reason. */
    [data-od-id="at-commit"] { margin-top: 20px; }
    [data-od-id="at-commit"] > .primary-btn { margin-top: 0; }
    [data-od-id="at-commit"] > .block-reason { margin-bottom: 12px; }

    /* The shared shell styles .primary-btn and never once styles it disabled, so
       on this screen a dead CTA painted as a live solid-orange button with a
       pointer cursor — in four validation states, on the no-fare-rules state, and
       behind the scrim after the press. Two solid primaries in one viewport is
       the thing the one-CTA rule exists to prevent, and a conductor aiming at a
       button that cannot fire is a tap that does nothing and looks like a bug.
       opacity would be the wrong repair here: it blends the fill toward the page
       and takes the white label under AA with it. Dropping the fill is the M3
       treatment and it also settles the count, because a grey button is not a
       primary. Local to this screen; the other seven prototypes still need it. */
    .primary-btn:disabled { background: var(--surface-container); color: var(--on-surface-variant); cursor: default; }
    .primary-btn:disabled:hover { background: var(--surface-container); }
    /* "Clear" is 41px wide and "Rules" is 41px, and a 41px tap target is a
       miss rather than a press. min-width only, and centred so the word does not
       sit off-axis in the wider box. */
    .card .text-action { min-width: 44px; justify-content: center; }

    /* The loading branch is a card of grey bars, and a screen of grey bars read
       out loud as nothing at all. One visually-hidden line gives it a name. */
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    .primary-btn.wide { width: 100%; justify-content: center; }
    .block-reason { margin-top: 20px; color: var(--on-surface-variant); }

    /* prototype state control (outside the phone) */
    .proto-states { position: fixed; left: 18px; bottom: 18px; z-index: 50; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 16px; background: rgba(255,255,255,.9); border: 1px solid #dcdde1; box-shadow: 0 10px 24px rgba(20,22,28,.12); font-family: var(--font); }
    .proto-states span { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #6b6e75; font-weight: 600; }
    .proto-states .seg { display: flex; flex-wrap: wrap; gap: 6px; max-width: 232px; }
    .proto-states button { font: inherit; font-size: 12px; padding: 7px 10px; border-radius: 999px; border: 1px solid #d4d5d9; background: #fff; color: #33363c; cursor: pointer; }
    .proto-states button:hover { background: #F1F2F4; }
    .proto-states button[aria-pressed="true"]:hover { background: #A93A09; border-color: #A93A09; }
    .proto-states button[aria-pressed="true"] { background: #C2410C; border-color: #C2410C; color: #fff; }

    @media (max-width: 480px) {
      body { padding: 0; display: block; }
      .phone-frame { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; }
      .phone-frame::before, .phone-frame::after, .hardware-button { display: none; }
      .phone-screen { width: 100%; height: 100%; border-radius: 0; }
      .proto-states { display: none; }
    }
    @media (max-height: 927px) { .phone-frame { zoom: .9; } }
    @media (max-height: 840px) { .phone-frame { zoom: .82; } }
    @media (max-height: 771px) { .phone-frame { zoom: .74; } }
    @media (max-height: 702px) { .phone-frame { zoom: .66; } }
  

    /* ── current trip: one running run, and the control that closes it ─── */
    /* The RUNNING card is an amber CONTAINER, not a solid amber panel. Amber is
       the app's one signal for a trip that is running, and this card is 180px of
       content — solid amber that size would fight the one solid CTA in the
       action bar for the same attention. A 4px amber rail plus the amber
       container says "running" at the card's edge and leaves the fill alone for
       the figures. Dark-on-amber measures 7.4:1 for a figure and 5.8:1 for a
       detail row, where the pale containers would sit near 1.5:1. */
    .run-card { position: relative; overflow: hidden; margin-top: 20px; padding: 20px; border: 1px solid #E8C97A; border-radius: var(--radius-xl); background: var(--secondary-container); }
    .run-card::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 4px; background: var(--secondary); }
    .run-card > * { position: relative; z-index: 1; }
    .run-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    /* The road flag is the honest answer to a value the app cannot supply. It is
       a flag and not a value because there is no column to read: this pill is the
       first thing a port deletes, and it should be impossible to mistake for one
       that stays. */
    .flag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: var(--radius-full); background: #F3DCAA; color: #4A3600; }
    .flag b { font-weight: 700; }
    .run-figs { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 16px; align-items: end; margin-top: 16px; }
    .run-fig-l { grid-column: 1; color: #4A3600; }
    .run-fig { display: block; margin-top: 2px; color: var(--on-secondary); font-variant-numeric: tabular-nums; }
    .run-fig-l2 { grid-column: 2; text-align: right; }
    /* One track, three fills. History already owns this shape as .bd-track with a
       single .bd-fill, and a three-colour chart would be a new visual language in
       the ninth screen. Three fills in one track is the same object, and it is
       the only place on this screen where three things are compared at once. */
    .mixbar { display: flex; height: 8px; margin-top: 16px; border-radius: var(--radius-full); background: rgba(74,54,0,.16); overflow: hidden; }
    .mixbar i { display: block; height: 100%; }
    .mixbar i.regular { background: #9A3D00; }
    .mixbar i.student { background: #44636F; }
    .mixbar i.disc { background: #6B4B00; }
    .mix-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 12px; color: #4A3600; }
    .mix-legend b { color: var(--on-secondary); font-weight: 700; }
    .run-rows { margin-top: 16px; }
    .run-rows > .detail-row:last-child { border-bottom: 0; }
    .run-rows .detail-row { border-bottom-color: #E0C489; }
    .run-note { margin: 12px 0 0; color: #4A3600; }

    /* ── the ledger ───────────────────────────────────────────────────── */
    /* A row is a <div>, not a <button>: it opens nothing, edits nothing and
       deletes nothing (CurrentTripScreen.tsx:356-384 says so in its own
       docblock), so a button would advertise an affordance that is not there.
       That also keeps .row-btn's load-bearing resets out of the picture.
       The store's order is created_at DESC, id DESC and is set in SQL; nothing
       here re-sorts. */
    /* Two lines of scalars on one baseline, then the journey, then the who.
       The three-column flex this replaced spent its middle column on 68px and
       wrapped "Subic Bay Freeport → Norzagaray" onto ten lines, because the
       fare sub-line held the column open at 150px and the clock held 62px more.
       Grid inverts the priority: the only prose in a boarding gets the whole
       width, and the two figures a conductor adds up land on a strict pitch. */
    .tk { display: grid; grid-template-columns: 1fr auto; align-items: baseline; column-gap: 12px; row-gap: 4px; padding: 12px 16px; border: 1px solid var(--outline-variant); border-radius: var(--radius-xl); background: rgba(255,255,255,.55); }
    /* Baseline, not flex-start plus a nudge: a 12px clock on a 16px fare that
       shares the fare's baseline reads as the sub-figure it is. Centring it
       against a 23px line instead would need a half-pixel nudge per size. */
    .tk-time { grid-area: 1 / 1; color: var(--glass-on-variant); font-variant-numeric: tabular-nums; }
    .tk-fare { grid-area: 1 / 2; text-align: right; color: var(--glass-on); font-variant-numeric: tabular-nums; }
    .tk-route { grid-area: 2 / 1 / 2 / -1; color: var(--glass-on); overflow-wrap: anywhere; }
    .tk-meta { grid-area: 3 / 1 / 3 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; color: var(--glass-on-variant); }

    /* ── the action bar: the one control that closes the run ───────────── */
    /* A sibling of .app-scroll, not a footer inside it, so it never scrolls away.
       A 15-row ledger puts a ListFooterComponent's button below the fold, and
       this is the one irreversible action on the screen. It is the only solid
       control in the viewport and it is --error rather than --primary-solid,
       because ending a trip cannot be undone and starting one can. */
    .action-bar { flex: none; padding: 12px 20px calc(var(--phone-safe-bottom) + 8px); }
    .end-btn { width: 100%; min-height: 48px; padding: 0; border: 0; border-radius: var(--radius-lg); background: var(--error); color: #fff; font-family: inherit; font-size: inherit; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .end-btn:hover { background: #8F1515; }
    /* The shared shell never styles a disabled button, and opacity would drag the
       white label under AA on a fill that is already the darkest thing here. The
       fill drops instead, which is the M3 treatment and the only repair that
       keeps the label readable. */
    .end-btn:disabled { background: #E7C7C4; color: #6E2B28; cursor: default; }
    .end-btn:disabled:hover { background: #E7C7C4; }
    .end-count { margin: 8px 0 0; text-align: center; color: var(--glass-on-variant); }

    .caution { margin: 16px 0 0; padding: 12px 16px; border-radius: var(--radius-lg); background: rgba(255,255,255,.5); border: 1px solid var(--outline-variant); color: var(--glass-on-variant); }

    /* The sheet's two actions. .cal-actions already styles the calendar's pair
       with the same recipe, but it is scoped to that class and named for that
       sheet, so this screen names its own rather than borrowing by accident. The
       confirm is --error filled and the cancel is nothing: the one irreversible
       write on the screen is the one that gets the fill. */
    .sheet-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 16px; }
    .sheet-actions .ghost { min-height: 48px; padding: 0 12px; border: 0; background: none; color: var(--on-surface-variant); font-family: inherit; font-size: inherit; cursor: pointer; }
    .sheet-actions .ghost:hover { color: var(--on-surface); }
    .sheet-actions .destructive { min-height: 48px; padding: 0 20px; border: 0; border-radius: var(--radius-lg); background: var(--error); color: #fff; font-family: inherit; font-size: inherit; font-weight: 600; cursor: pointer; }
    .sheet-actions .destructive:hover { background: #8F1515; }
    /* An already-inactive record has nothing to deactivate. The button stays
       in place so the sheet does not reflow between records, and says so. */
    .sheet-actions .destructive[aria-disabled="true"] { background: var(--surface-container); color: var(--outline); cursor: not-allowed; }
    .sheet-actions .destructive[aria-disabled="true"]:hover { background: var(--surface-container); }


    /* ── settings: four modules, and what each one currently holds ────── */
    /* One shape, four times, at one height. The cards were ragged because a
       description that runs to three lines cannot fit beside a 48px chip in a
       104px min-height, so the box was a guess and four cards came out four
       heights. A value is short by construction: title 23 + 2 + value 21 = 46px
       of text against a 48px chip, so the card is 20 + 48 + 20 plus its two 1px
       borders = 90px and nothing in the list can push past it. The value is
       14px, not 12: it is the answer to the question the row raises, and at 12px
       it was quieter than the chrome subtitle three hundred pixels up.

       font-family/font-size/color: inherit for the reason .row-btn carries it.
       A <button> does not inherit the family, so without this the four cards
       render in Arial while the chrome above them renders in Poppins. */
    .mod {
      display: flex; align-items: center; gap: 12px; width: 100%; min-height: 90px;
      padding: 20px; border: 1px solid var(--outline-variant);
      border-radius: var(--radius-xl); background: rgba(255,255,255,.55);
      text-align: left; cursor: pointer;
      font-family: inherit; font-size: inherit; color: inherit;
    }
    .mod:hover { background: rgba(255,255,255,.74); }
    .mod:active { transform: scale(.995); }
    /* tertiary, four times. The chip is a CATEGORY — where you go — and no
       category here outranks another, so there is no accent to differ. The
       advanced card wore error here; the error token moves to the one card that
       is genuinely an error, which is the fare card when nothing is saved. */
    .mod-body { flex: 1 1 auto; min-width: 0; }
    .mod-title { display: block; color: var(--on-surface); }
    .mod-value { display: block; margin-top: 2px; color: var(--on-surface-variant); }
    .mod-chev { flex: none; color: var(--on-surface-variant); display: inline-flex; }
    /* The one error on the screen, and the one place error belongs. theme.ts
       reserves it for real errors and validation, and "no fare rules" is both:
       it is the state addTicketFare.ts:334 refuses to price through. The border
       and the value carry it; the chip stays tertiary, because the chip is
       still a category. */
    .mod.alert { border-color: var(--error); background: var(--error-container); }
    .mod.alert .mod-value { color: var(--on-error-container); font-weight: 600; }
    .sec-block { margin-top: 20px; }
    /* 12, the card gap: the note is the last line of this section, not a new
       section, so it sits one card-gap below the list. */
    .sec-note { margin-top: 12px; color: var(--glass-on-variant); }
    /* The offline statement is metadata about all four modules, not a fifth
       module. At LocalStorageCard's radius and padding in this same column it
       read as one more row to push into, with the one thing on the screen that
       opens nothing. It loses the card and keeps the lock and the copy. */
    .note-lock { margin-top: 20px; display: flex; align-items: flex-start; gap: 8px; }
    .note-lock > svg { flex: none; margin-top: 2px; }
    .note-lock p { color: var(--glass-on-variant); }
    .note-lock .nl-label { margin-bottom: 2px; }
    a.back { text-decoration: none; }
    /* ── barangay configuration: settings' rows, dashboard's controls ──── */
    /* Two records, one line each. `.mod` is a flex row with a 48px chip and a
       status pill, so a long location name wraps and that one row grows past
       90px while the other nineteen stay put — which reads as a rendering
       fault, not as information. Clamp both lines instead: the row's
       aria-label and the record sheet both carry the untruncated text, so
       nothing is lost, and every row lands on the same height.

       min-width: 0 is load-bearing with those two clamps. nowrap removes every
       soft break opportunity, so the row's min-content is the full text, and
       as a grid item with the default min-width: auto that minimum wins over
       the track — the row came out 374px wide inside a 350px column and
       pushed the list 4px past the gutter. Zeroing the minimum hands the size
       back to the track, and the ellipsis does the rest. */
    .mod { min-width: 0; }
    .mod-title, .mod-value { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* The two .field pickers stack 12px apart, the card gap, so the search
       and the scope cannot end up at different gaps. The boxes themselves are
       `.field`'s own height, which grows when a value wraps — add-trip ships
       an 80px destination field for the same reason. */
    .bc-fields { display: grid; gap: 12px; margin-top: 12px; }
    /* .field is authored for a <button>, so it ships pointer. On the search
       row the cursor is a lie: what is under it is a caret. */
    .field.as-input { cursor: text; }
    .field.as-input:focus-within { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
    .field .f-value input { width: 100%; min-width: 0; border: 0; padding: 0; background: none; font-family: inherit; font-size: inherit; color: var(--on-surface); outline: none; }
    .field .f-value input::placeholder { color: var(--outline); font-weight: 500; }
    .field .f-value input::-webkit-search-cancel-button { -webkit-appearance: none; }

    /* .sec-head is space-between, so a count and an add button would fly to
       opposite ends. They are one cluster: "20" and "ADD" describe the same
       list. */
    .sec-end { display: flex; align-items: center; gap: 8px; flex: none; }

    /* Settings' .mod carries one trailing node. A status pill beside the
       chevron needs a group, or the two would claim the row's end separately. */
    .mod-end { display: flex; align-items: center; gap: 8px; flex: none; }
    .bc-state { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: var(--radius-full); }
    .bc-state.on { background: var(--tertiary-container); color: var(--on-tertiary-container); }
    .bc-state.off { background: var(--surface-container); color: var(--glass-on-variant); }
    /* An unlinked row is a real data fault, and .mod.alert is the recipe
       Settings already uses for the one real fault it can have. */
    .mod.unlinked { border-color: var(--error); background: var(--error-container); }
    .mod.unlinked .mod-value { color: var(--on-error-container); font-weight: 600; }

    /* "3 of 20" is the whole job: rows on screen, out of rows that exist. */
    .bc-count { color: var(--glass-on-variant); text-align: right; font-variant-numeric: tabular-nums; }
    .bc-count b { color: var(--glass-on); font-weight: 700; }

    /* .caution is the shell's inline notice (current-trip). The confirmation
       after a write is exactly that, so it borrows it instead of a banner. */
    .bc-msg { display: flex; align-items: center; gap: 8px; }
    .bc-msg p { flex: 1 1 auto; min-width: 0; }
    .bc-msg button { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: var(--radius-full); background: transparent; color: inherit; cursor: pointer; }
    .bc-msg button:hover { background: var(--surface-container); }

    /* A 24px "Change" under a 16px sentence is not a target, it is a
       suggestion. The action is 44 and the caption centres on it, which costs
       20px of scroll once and buys a finger-sized hit. */
    #statusCaption { align-items: center; }
    #statusCaption .text-action { padding-inline: 4px; }


    /* The empty state's one action, from passenger's .inline-empty. */
    .card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .card-actions .ghost-btn { min-height: 48px; padding: 0 16px; border-radius: var(--radius-lg); border: 1px solid var(--outline); background: transparent; color: var(--glass-on-variant); cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 8px; }
    .card-actions .ghost-btn:hover { background: rgba(120,130,150,.12); }

    /* The loading branch is the list about to arrive, in the shape it arrives
       in. Grey bars in the row geometry, not a spinner over an empty screen. */
    .sk-row { display: flex; align-items: center; gap: 12px; min-height: 90px; padding: 20px; border: 1px solid var(--outline-variant); border-radius: var(--radius-xl); background: rgba(255,255,255,.55); }
    .sk-lines { flex: 1 1 auto; min-width: 0; }
  

    /* ── add-barangay.html's own three rules, dead here, kept on purpose ── */
    /* See the ponytail note at the top of this file. Nothing in this document
       carries these classes; they ride along because the style block is
       add-barangay.html's bytes copied whole. The live stack below is
       `.tc-fields`. */
    .ab-fields { display: grid; gap: 12px; }

    /* The unit rides inside the value line, so a marker is never read without
       it, and the label above can stay "Registered KM". */
    .km-line { display: flex; align-items: baseline; gap: 6px; }
    .km-line input { width: auto; flex: 1 1 auto; }
    .km-unit { flex: none; color: var(--on-surface-variant); font-weight: 600; }

    /* 20px, not the 14px .primary-btn ships: 14 is off the 4px grid, and this
       is the screen's one irreversible write and its only solid control. */
    .ab-save { margin-top: 20px; }


    /* ── this screen's own two rules ─────────────────────────────────── */
    /* Same stack as add-barangay.html's `.ab-fields`: same 12px gap, same
       grid, same `.field`. Three rows, and the card owns its own padding. */
    .tc-fields { display: grid; gap: 12px; }

    /* 20px, not the 14px .primary-btn ships: 14 is off the 4px grid, and this
       is the screen's one irreversible write and its only solid control. */
    .tc-save { margin-top: 20px; }


</style>
</head>
<body>
  <div class="phone-frame" data-phone-shell data-platform="neutral">
    <span class="hardware-button volume" aria-hidden="true"></span>
    <span class="hardware-button power" aria-hidden="true"></span>

    <section class="phone-screen" data-od-id="phone-screen" data-phone-screen>
      <main class="phone-content" data-phone-content>
        <!-- APP CONTENT START -->
        <div id="app">
          <header class="chrome readable" data-od-id="tc-chrome">
            <a class="back" href="settings.html" data-od-id="tc-back" aria-label="Back to settings">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
            </a>
            <div class="title-card">
              <h1 class="chrome-title title-m">Add Terminal</h1>
              <p class="chrome-sub body-s" data-od-id="tc-sub">Registers a terminal and its KM marker</p>
            </div>
          </header>

          <div class="app-scroll" id="scroll">
            <div class="readable">
              <!-- One notice at a time, and on a form the notice is the error.
                   role="alert" because it answers a tap on SAVE, and it has no
                   dismiss button: a validation error is not transient, and
                   closing it would hide the reason the write was refused. -->
              <div id="msgSlot" data-od-id="tc-msg"></div>

              <section data-od-id="tc-form" style="margin-top:20px">
                <form class="glass range-card" id="addForm" novalidate>
                  <div class="tc-fields">
                    <label class="field as-input" data-od-id="tc-name-wrap">
                      <span class="f-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s6.5-6.1 6.5-10.6a6.5 6.5 0 0 0-13 0C5.5 14.9 12 21 12 21Z"/><circle cx="12" cy="10.3" r="2.4"/></svg>
                      </span>
                      <span class="f-body">
                        <span class="f-label">Terminal</span>
                        <span class="f-value"><input type="text" id="tName" name="name" autocomplete="off" spellcheck="false" maxlength="60" placeholder="e.g. Dau" aria-label="Terminal name" data-od-id="tc-name" /></span>
                      </span>
                    </label>

                    <button type="button" class="field" id="muniBtn" data-act="pickmuni" data-od-id="tc-muni-btn" aria-haspopup="dialog" aria-expanded="false" aria-label="Municipality. Choose a municipality.">
                      <span class="f-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5V5a1 1 0 0 1 1-1h6.5L20 12.5 12.5 20 4 11.5Z"/><circle cx="8" cy="8" r="1.4"/></svg>
                      </span>
                      <span class="f-body">
                        <span class="f-label">Municipality</span>
                        <span class="f-value empty" id="muniValue">Choose a municipality</span>
                      </span>
                      <span class="f-chev" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 6 6-6"/></svg>
                      </span>
                    </button>

                    <label class="field as-input" data-od-id="tc-km-wrap">
                      <span class="f-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8.5" width="17" height="7" rx="1.5"/><path d="M8 8.5v3M12 8.5v4M16 8.5v3"/></svg>
                      </span>
                      <span class="f-body">
                        <span class="f-label">Registered KM</span>
                        <span class="f-value km-line">
                          <input type="text" id="tKm" name="km" inputmode="decimal" autocomplete="off" spellcheck="false" maxlength="6" placeholder="0.0" aria-label="Registered KM marker" aria-describedby="kmHint" data-od-id="tc-km" />
                          <span class="km-unit" aria-hidden="true">KM</span>
                        </span>
                      </span>
                    </label>
                  </div>

                  <button type="submit" class="primary-btn wide tc-save" id="saveBtn" data-od-id="tc-save">SAVE TERMINAL</button>
                </form>
                <p class="range-caption body-s" id="kmHint" data-od-id="tc-kmhint"></p>
              </section>

              <div class="note-lock" data-od-id="tc-storage">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--glass-on-variant)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
                <div>
                  <p class="label-s nl-label">OFFLINE STORAGE</p>
                  <p class="body-s">The record is saved on this device and works offline.</p>
                </div>
              </div>
            </div>
          </div>

          <div class="overlay-root" id="overlayRoot"></div>
        </div>

        <!-- APP CONTENT END -->
      </main>

      <div class="status-bar" aria-hidden="true">
        <span class="status-time">9:41</span>
        <span class="status-cutout-zone"></span>
        <span class="status-icons">
          <svg class="connectivity" viewBox="0 0 15 12"><path d="M1.5 10.5v-2m4 2v-4.5m4 4.5v-7m4 7v-9"/></svg>
          <svg class="wifi" viewBox="0 0 16 12"><path d="M1.5 4.7a9.2 9.2 0 0 1 13 0M4.2 7.3a5.4 5.4 0 0 1 7.6 0M6.9 10a1.55 1.55 0 0 1 2.2 0"/></svg>
          <svg class="battery" viewBox="0 0 20 11"><rect x=".75" y="1.25" width="16.5" height="8.5" rx="2"/><path d="M18.5 4v3M3.2 3.4h10.4v4.2H3.2z" fill="currentColor" stroke="none"/></svg>
        </span>
      </div>
      <div class="camera-dot" aria-hidden="true"></div>
      <div class="gesture-indicator" aria-hidden="true"></div>
    </section>
  </div>

  <div class="proto-states" role="group" aria-label="Prototype state preview">
    <span>Prototype states</span>
    <div class="seg" id="protoSeg">
      <button type="button" data-state="default" aria-pressed="true">Default</button>
      <button type="button" data-state="filled" aria-pressed="false">Filled</button>
      <button type="button" data-state="error" aria-pressed="false">Error</button>
    </div>
  </div>

  <script>

  (function () {
  'use strict';

  const $ = function (id) { return document.getElementById(id); };
  const plural = function (n, one, many) { return n === 1 ? one : many; };
  const esc = function (s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };

  /* ── icons (add-barangay.html's set) ───────────────────────────────── */
  const ICONS = {
    pin: '<path d="M12 21s6.5-6.2 6.5-11a6.5 6.5 0 1 0-13 0C5.5 14.8 12 21 12 21Z"/><circle cx="12" cy="10" r="2.4"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>'
  };
  const icon = function (name, size, color, sw) {
    return '<svg viewBox="0 0 24 24" width="' + (size || 20) + '" height="' + (size || 20) +
      '" fill="none" stroke="' + (color || 'currentColor') + '" stroke-width="' + (sw || 1.7) +
      '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>';
  };

  /* ── the municipality table, restated from add-municipality.html ───── */
  /* The app reads `municipalities` (id, name, province, is_active). A
     standalone prototype has no database, so the same 19 rows appear in
     barangay-config.html, add-municipality.html, add-barangay.html and this
     file. That duplication is the real cost of self-contained screens, and it
     buys a picker that still opens on its own. */
  const MUNICIPALITIES = [
    { id: 1, name: 'Masinloc', province: 'Zambales', active: true },
    { id: 2, name: 'Iba', province: 'Zambales', active: true },
    { id: 3, name: 'Santa Cruz', province: 'Zambales', active: true },
    { id: 4, name: 'Olongapo City', province: 'Zambales', active: true },
    { id: 5, name: 'Hagonoy', province: 'Bulacan', active: true },
    { id: 6, name: 'Minalin', province: 'Bulacan', active: true },
    { id: 7, name: 'San Simon', province: 'Bulacan', active: true },
    { id: 8, name: 'Candaba', province: 'Pampanga', active: true },
    { id: 9, name: 'Malolos', province: 'Bulacan', active: true },
    { id: 10, name: 'Plaridel', province: 'Bulacan', active: true },
    { id: 11, name: 'Baliwag', province: 'Bulacan', active: true },
    { id: 12, name: 'Bustos', province: 'Bulacan', active: true },
    { id: 13, name: 'San Rafael', province: 'Bulacan', active: true },
    { id: 14, name: 'Santa Maria', province: 'Bulacan', active: true },
    { id: 15, name: 'Meycauyan', province: 'Bulacan', active: true },
    { id: 16, name: 'Gapan', province: 'Nueva Ecija', active: true },
    { id: 17, name: 'Cabanatuan', province: 'Nueva Ecija', active: true },
    { id: 18, name: 'Balanga', province: 'Bataan', active: true },
    /* Inactive. A terminal cannot be linked to it, so it is not offered in the
       picker - the same rule add-barangay.html applies. */
    { id: 19, name: 'Subic', province: 'Zambales', active: false }
  ];

  /* ── the terminal seed, the app's own five rows ────────────────────── */
  /* tripTicketsStore.ts:508-512, verbatim: the same names, the same
     km_marker in thousandths, the same is_active. Every row reads mid: null
     and the header says why - the app's municipality_id values point at the
     app's three seeded municipalities, whose ids collide with the 19-row table
     above. The linkage is proved on the rows this screen writes itself, so the
     seed is the shipped data and the links are the prototype's. */
  const TERMINALS = [
    { name: 'Santa Cruz, Olongapo', km: 228000, mid: null, active: true },
    { name: 'Caloocan, Kalakhang Maynila', km: 314200, mid: null, active: true },
    { name: 'Olongapo, Olongapo', km: 232400, mid: null, active: true },
    { name: 'Subic, Subic', km: 249600, mid: null, active: true },
    { name: 'Iba, Zambales', km: 96800, mid: null, active: true }
  ];

  /* ── the write target ──────────────────────────────────────────────── */
  /* The app has no saveTerminal(): the seed's INSERT (tripTicketsStore.ts:762)
     is the only terminal write and it runs once, at first open. A prototype
     has no table, so the registry and this screen agree on one key in
     localStorage instead, and the registry appends whatever it finds on load -
     the contract add-barangay.html and add-municipality.html already use. */
  const ADDED_KEY = 'kondukt.terminals.added';
  const FLASH_KEY = 'kondukt.terminals.flash';

  /* Writable storage is a trust boundary like any other: a row that is not the
     shape above is dropped, never rendered. */
  function added() {
    let parsed = null;
    try {
      const raw = localStorage.getItem(ADDED_KEY);
      if (raw) parsed = JSON.parse(raw);
    } catch (e) { parsed = null; }
    if (!Array.isArray(parsed)) return [];
    return parsed.filter(function (r) {
      return r && typeof r.name === 'string' && r.name !== '' &&
        typeof r.km === 'number' && isFinite(r.km) && r.km > 0;
    });
  }
  /* What the registry will show after this write, and what the caption counts.
     Seeded rows first, then everything this device added. */
  const allTerminals = function () { return TERMINALS.concat(added()); };

  function muniOf(mid) {
    const pool = MUNICIPALITIES.concat(muniAdded());
    for (let i = 0; i < pool.length; i += 1) if (pool[i].id === mid) return pool[i];
    return null;
  }
  /* The other editor's rows, so a terminal can hang off a municipality added
     on this device without the picker losing it. The id is minted past the
     seeded range because both tables are 1-indexed and hand-authored. */
  function muniAdded() {
    let parsed = null;
    try {
      const raw = localStorage.getItem('kondukt.municipalities.added');
      if (raw) parsed = JSON.parse(raw);
    } catch (e) { parsed = null; }
    if (!Array.isArray(parsed)) return [];
    return parsed
      .filter(function (r) { return r && typeof r.name === 'string' && r.name !== '' && typeof r.province === 'string' && r.province !== ''; })
      .map(function (r, i) { return { id: MUNICIPALITIES.length + 1 + i, name: r.name, province: r.province, active: r.active !== false }; });
  }

  /* ── the marker ────────────────────────────────────────────────────── */
  /* Thousandths in, thousandths out. Three digits before the point caps a
     marker at 999.9 KM - a provincial route, not a rounding artefact - and it
     has the useful side effect of rejecting the raw stored value (231000),
     which is the mistake this field is most likely to invite. Two decimals are
     accepted and then rounded away, because fmtKm() only ever prints one. */
  const fmtKm = function (milli) { return (milli / 1000).toFixed(1) + ' KM'; };
  const KM_RE = /^\d{1,3}(?:\.\d{1,2})?$/;
  function parseKm(s) {
    const t = String(s).trim().replace(/,/g, '');
    if (!KM_RE.test(t)) return null;
    const v = parseFloat(t);
    if (!isFinite(v) || v <= 0) return null;
    return Math.round(v * 1000);
  }

  /* The markers already registered in this municipality, so the new number is
     typed next to the truth. Every figure below is a stored row - including a
     deactivated one, which is why this counts exactly as the registry does. */
  function kmContext(mid, typed) {
    const rows = allTerminals().filter(function (r) { return r.mid === mid; })
      .sort(function (a, b) { return a.km - b.km; });
    if (rows.length === 0) return 'no marker registered here yet';
    if (typed === null) return 'highest marker here ' + fmtKm(rows[rows.length - 1].km);
    let best = rows[0];
    rows.forEach(function (r) { if (Math.abs(r.km - typed) < Math.abs(best.km - typed)) best = r; });
    return 'nearest ' + fmtKm(best.km) + ' · ' + best.name;
  }

  /* How many terminals a municipality owns, including a deactivated one: a
     card sub-line in the registry, and a deactivated terminal still belongs to
     its municipality. */
  function terminalCount(mid) {
    let n = 0;
    allTerminals().forEach(function (r) { if (r.mid === mid) n += 1; });
    return n;
  }

  /* A duplicate is a duplicate against the seed AND everything this device has
     added, or the same terminal registers twice in one session. Keyed on the
     composed stored name, because that string is the identity every reader
     downstream splits on - and the split is decided here, once, instead of by
     barangayNameOf() and passengerState.municipalityOf() disagreeing. */
  function findDupe(name, muniName) {
    const composed = (name + ', ' + muniName).toLowerCase();
    return allTerminals().filter(function (r) {
      return r.name.toLowerCase() === composed;
    })[0] || null;
  }

  /* ── state ─────────────────────────────────────────────────────────── */

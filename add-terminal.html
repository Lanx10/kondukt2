  /* Local to the screen, like the registry's. Nothing here is a global store,
     and re-entering shows an empty form. */
  function defaults(preview) {
    const s = { name: '', km: '', mid: null, message: null, sheet: null, lastFocus: null };
    if (preview === 'filled') { s.name = 'Dau'; s.km = '232.4'; s.mid = 4; }
    /* The error state is the raw stored value, not a dupe: 231000 is the exact
       mistake this field invites, and the three-digit cap is the rule that
       catches it. A dupe needs two typed rows to be reachable in a preview
       that has to work with a cold localStorage. */
    if (preview === 'error') { s.name = 'Dau'; s.km = '231000'; s.mid = 4; s.message = 'Enter the registered KM as a number, up to 999.9.'; }
    return s;
  }
  const state = defaults('default');
  state.preview = 'default';

  /* What the caption says. The first clause is the row this screen writes,
     read back the way the registry will read it; the second is what the chosen
     municipality already holds. */
  function hintText() {
    if (state.mid === null) return 'Choose a municipality to see the KM markers registered in it.';
    const m = muniOf(state.mid);
    if (!m) return '';
    const name = state.name.trim();
    const head = name === ''
      ? m.name + ', ' + m.province
      : 'Stores "' + name + ', ' + m.name + '" · ' + m.province;
    return head + ' · ' + kmContext(state.mid, parseKm(state.km));
  }

  function fieldEl(f) { return f === 'muni' ? $('muniBtn') : $(f === 'km' ? 'tKm' : 'tName'); }

  /* ── validation ────────────────────────────────────────────────────── */
  /* Returns the field at fault with it, so the mark lands on the control the
     driver has to touch rather than on the screen as a whole. */
  function validate() {
    const name = state.name.trim();
    if (name === '') return { field: 'name', message: 'Enter the terminal name.' };
    /* A comma here IS the place/municipality split for every reader downstream
       - barangayNameOf() takes the first, passengerState the last - so it is
       refused at the boundary instead of being repaired somewhere later. */
    if (name.indexOf(',') !== -1) return { field: 'name', message: 'Remove the comma from the terminal name.' };
    if (state.mid === null) return { field: 'muni', message: 'Choose the municipality this terminal belongs to.' };
    const km = parseKm(state.km);
    if (km === null) return { field: 'km', message: 'Enter the registered KM as a number, up to 999.9.' };
    const m = muniOf(state.mid);
    if (!m || !m.active) return { field: 'muni', message: 'That municipality is no longer available.' };
    if (findDupe(name, m.name)) return { field: 'name', message: name + ' is already registered in ' + m.name + '.' };
    return null;
  }

  /* ── overlays (add-barangay.html's, unchanged) ─────────────────────── */
  function closeOverlay() {
    const root = $('overlayRoot');
    if (!root.firstChild) return;
    if (state.lastFocus && state.lastFocus.isConnected) state.lastFocus.focus();
    root.innerHTML = '';
    state.sheet = null;
    /* Neither open nor close re-renders - re-rendering would drop the focused
       node out from under the sheet - so the trigger's expanded state is owned
       here, beside the state it describes, and not left to render(). */
    $('muniBtn').setAttribute('aria-expanded', 'false');
  }
  function openOverlay(html) {
    state.lastFocus = document.activeElement;
    state.sheet = html;
    $('muniBtn').setAttribute('aria-expanded', 'true');
    $('overlayRoot').innerHTML = html;
    const af = $('overlayRoot').querySelector('[data-autofocus]');
    if (af) af.focus();
  }
  function renderOverlay() {
    if (state.sheet !== null) $('overlayRoot').innerHTML = state.sheet;
  }
  function sheet(title, sub, body) {
    return '<div class="scrim bottom" data-scrim="1">' +
      '<div class="sheet bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">' +
      '<div class="sheet-head"><div class="sheet-titles">' +
      '<h2 class="headline-s" id="sheetTitle">' + esc(title) + '</h2>' +
      (sub ? '<p class="body-s muted">' + esc(sub) + '</p>' : '') +
      '</div><button type="button" class="icon-btn" data-act="close" data-od-id="tc-sheet-close" ' +
      'data-autofocus aria-label="Close">' + icon('close', 20) + '</button></div>' +
      '<div class="sheet-body">' + body + '</div></div></div>';
  }

  /* The municipality list is `.pick-row`, the same row add-ticket, passenger
     and add-barangay use to hand a boarding to a terminal, and its second line
     is fetched: the province, and how many terminals already hang off that
     municipality - which is the thing being decided between. The count is
     every row, the registry's own rule, not the active-only count: a
     deactivated terminal still belongs to its municipality. */
  function openMuniMenu() {
    let o = '';
    MUNICIPALITIES.concat(muniAdded()).filter(function (m) { return m.active; })
      .sort(function (a, b) {
        if (a.province !== b.province) return a.province < b.province ? -1 : 1;
        return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
      })
      .forEach(function (m) {
        const n = terminalCount(m.id);
        o += '<button type="button" class="pick-row" data-act="choosemuni" data-value="' + m.id + '" ' +
          'data-od-id="tc-muni-' + m.id + '" aria-current="' + (state.mid === m.id ? 'true' : 'false') + '">' +
          '<span class="pk-body"><span class="pk-name">' + esc(m.name) + '</span>' +
          '<span class="pk-sub body-s">' + esc(m.province) + ' · ' + n + ' ' + plural(n, 'terminal', 'terminals') +
          '</span></span>' +
          '<span class="mod-chev" aria-hidden="true">' + icon('check', 18, 'currentColor', 2.4) + '</span></button>';
      });
    openOverlay(sheet('Municipality', 'Chooses where this terminal belongs', o));
  }

  /* ── the write ─────────────────────────────────────────────────────── */
  function save() {
    const bad = validate();
    if (bad) {
      state.message = bad.message;
      render();
      const el = fieldEl(bad.field);
      el.setAttribute('aria-invalid', 'true');
      el.focus();
      return;
    }
    const m = muniOf(state.mid);
    const name = state.name.trim();
    const rows = added();
    rows.push({ name: name + ', ' + m.name, km: parseKm(state.km), mid: state.mid, active: true });
    try {
      localStorage.setItem(ADDED_KEY, JSON.stringify(rows));
      localStorage.setItem(FLASH_KEY, name + ' added to ' + m.name + '.');
    } catch (e) {
      /* A full quota and a blocked storage both land here, and navigating on
         either would show a save that did not happen. */
      state.message = 'This device would not save the record. Check available storage and try again.';
      render();
      return;
    }
    window.location.href = 'settings.html';
  }

  /* ── one render ────────────────────────────────────────────────────── */
  function renderMsg() {
    $('msgSlot').innerHTML = state.message === null ? '' :
      '<div class="caution" role="alert" data-od-id="tc-banner" style="margin-top:16px">' +
      '<p class="body-s">' + esc(state.message) + '</p></div>';
  }

  function render() {
    /* Only write a value that differs: assigning input.value on every keystroke
       drops the caret. */
    if ($('tName').value !== state.name) $('tName').value = state.name;
    if ($('tKm').value !== state.km) $('tKm').value = state.km;

    const m = state.mid === null ? null : muniOf(state.mid);
    const v = $('muniValue');
    if (m) {
      v.textContent = m.name + ', ' + m.province;
      v.classList.remove('empty');
      $('muniBtn').setAttribute('aria-label', 'Municipality. ' + m.name + ', ' + m.province + '. Change it.');
    } else {
      v.textContent = 'Choose a municipality';
      v.classList.add('empty');
      $('muniBtn').setAttribute('aria-label', 'Municipality. Choose a municipality.');
    }
    $('muniBtn').setAttribute('aria-expanded', state.sheet === null ? 'false' : 'true');

    $('kmHint').textContent = hintText();
    renderMsg();
    renderOverlay();
    syncProto();
  }

  /* ── prototype states, outside the phone ───────────────────────────── */
  function syncProto() {
    Array.prototype.forEach.call($('protoSeg').querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.state === state.preview ? 'true' : 'false');
    });
  }
  function setPreview(v) {
    state.preview = v;
    Object.assign(state, defaults(v));
    $('overlayRoot').innerHTML = '';
    syncProto();
    render();
  }

  /* ── wiring ────────────────────────────────────────────────────────── */
  document.addEventListener('input', function (e) {
    const t = e.target;
    if (t.id === 'tName' || t.id === 'tKm') {
      if (t.id === 'tName') state.name = t.value; else state.km = t.value;
      /* The error belonged to the value that caused it, so it goes when the
         value changes - not when the notice is dismissed. */
      state.message = null;
      t.removeAttribute('aria-invalid');
      render();
    }
  });

  document.addEventListener('click', function (e) {
    const t = e.target;
    if (t.hasAttribute && t.hasAttribute('data-scrim')) { closeOverlay(); return; }

    const proto = t.closest && t.closest('#protoSeg button');
    if (proto) { setPreview(proto.dataset.state); return; }

    const act = t.closest && t.closest('[data-act]');
    if (!act) return;
    const a = act.dataset.act;
    if (a === 'pickmuni') { openMuniMenu(); return; }
    if (a === 'choosemuni') {
      state.mid = parseInt(act.dataset.value, 10);
      state.message = null;
      closeOverlay();
      render();
      return;
    }
    closeOverlay();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.sheet !== null) closeOverlay();
  });

  /* Enter submits from either field, because both are inside this form and
     SAVE is its only submit control. */
  $('addForm').addEventListener('submit', function (e) { e.preventDefault(); save(); });

  syncProto();
  render();
  })();
  </script>
</body>
</html>

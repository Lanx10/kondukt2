    chevron: '<path d="M9 5l7 7-7 7"/>',
    chevronDown: '<path d="M6 9.5l6 6 6-6"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    pencil: '<path d="M4 20h4l10-10-4-4L4 16v4Z"/><path d="M14.5 5.5l4 4"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7"/>',
    lock: '<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>'
  };
  const icon = function (name, size, color, sw) {
    return '<svg viewBox="0 0 24 24" width="' + (size || 20) + '" height="' + (size || 20) +
      '" fill="none" stroke="' + (color || 'currentColor') + '" stroke-width="' + (sw || 1.7) +
      '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>';
  };
  const esc = function (s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };
  const $ = function (id) { return document.getElementById(id); };
  const plural = function (n, one, many) { return n === 1 ? one : many; };

  /* Thousandths of a km → the one decimal the app prints on a marker. */
  const fmtKm = function (milli) { return (milli / 1000).toFixed(1) + ' KM'; };

  /* ── the registry ────────────────────────────────────────────────────── */
  /* Two tables, exactly as the app keeps them: `terminals` rows named
     "<Barangay>, <Municipality>" with km_marker in thousandths, and a
     municipalities table the links point at. Subic is linked to nothing —
     tripTicketsStore.ts:516-518 seeds it with municipality_id null — so the
     registry opens deliberately not fully linked. */
  const MUNICIPALITIES = [
    { id: 1, name: 'Masinloc', province: 'Zambales', active: true },
    { id: 2, name: 'Iba', province: 'Zambales', active: true },
    { id: 3, name: 'Santa Cruz', province: 'Zambales', active: true },
    { id: 4, name: 'Olongapo City', province: 'Zambales', active: true },
    { id: 5, name: 'Hagonoy', province: 'Bulacan', active: true },
    { id: 6, name: 'Minalin', province: 'Bulacan', active: true },
    { id: 7, name: 'San Simon', province: 'Bulacan', active: true },
    { id: 8, name: 'Candaba', province: 'Pampanga', active: true },
    { id: 9, name: 'Malolos', province: 'Bulacan', active: true },
    { id: 10, name: 'Plaridel', province: 'Bulacan', active: true },
    { id: 11, name: 'Baliwag', province: 'Bulacan', active: true },
    { id: 12, name: 'Bustos', province: 'Bulacan', active: true },
    { id: 13, name: 'San Rafael', province: 'Bulacan', active: true },
    { id: 14, name: 'Santa Maria', province: 'Bulacan', active: true },
    { id: 15, name: 'Meycauayan', province: 'Bulacan', active: true },
    { id: 16, name: 'Gapan', province: 'Nueva Ecija', active: true },
    { id: 17, name: 'Cabanatuan', province: 'Nueva Ecija', active: true },
    { id: 18, name: 'Balanga', province: 'Bataan', active: true },
    /* Owns no barangay and is not offered in the scope menu; a scope left on it
       still names itself on the trigger, which is the behavior to keep. */
    { id: 19, name: 'Subic', province: 'Zambales', active: false }
  ];

  const BARANGAYS = [
    { id: 1, name: 'Poblacion, Masinloc', km: 41200, mid: 1, active: true },
    { id: 2, name: 'Poblacion, Iba', km: 96800, mid: 2, active: true },
    { id: 3, name: 'Poblacion, Santa Cruz', km: 148600, mid: 3, active: true },
    { id: 4, name: 'Barangay 1, Olongapo', km: 231000, mid: 4, active: true },
    { id: 5, name: 'Poblacion, Olongapo City', km: 232400, mid: 4, active: true },
    { id: 6, name: 'Poblacion, Subic', km: 249600, mid: null, active: true },
    { id: 7, name: 'Poblacion, Hagonoy', km: 258400, mid: 5, active: true },
    { id: 8, name: 'Poblacion, Minalin', km: 262100, mid: 6, active: true },
    { id: 9, name: 'Poblacion, San Simon', km: 265800, mid: 7, active: true },
    { id: 10, name: 'Poblacion, Candaba', km: 268000, mid: 8, active: false },
    { id: 11, name: 'Poblacion, Malolos', km: 271500, mid: 9, active: true },
    { id: 12, name: 'Poblacion, Plaridel', km: 276900, mid: 10, active: true },
    { id: 13, name: 'Poblacion, Baliwag', km: 281300, mid: 11, active: true },
    { id: 14, name: 'Poblacion, Bustos', km: 286700, mid: 12, active: true },
    { id: 15, name: 'Poblacion, San Rafael', km: 291200, mid: 13, active: true },
    { id: 16, name: 'Poblacion, Santa Maria', km: 297500, mid: 14, active: true },
    { id: 17, name: 'Poblacion, Meycauayan', km: 305800, mid: 15, active: true },
    { id: 18, name: 'Poblacion, Gapan', km: 318000, mid: 16, active: true },
    { id: 19, name: 'Poblacion, Cabanatuan', km: 324500, mid: 17, active: true },
    { id: 20, name: 'Poblacion, Balanga', km: 331000, mid: 18, active: false }
  ];

  /* barangayPickerState.ts:28-37, verbatim — first comma splits. Used for
     search only; the caption names the LINKED municipality, because the scope
     filter above the list filters on that same link. */
  const barangayNameOf = function (s) {
    const i = s.indexOf(',');
    return i === -1 ? s : s.slice(0, i).trim();
  };
  const municipalityNameOf = function (s) {
    const i = s.indexOf(',');
    return i === -1 ? '' : s.slice(i + 1).trim();
  };
  const muniOf = function (id) {
    for (let i = 0; i < MUNICIPALITIES.length; i++) if (MUNICIPALITIES[i].id === id) return MUNICIPALITIES[i];
    return null;
  };

  /* ── records this device added ───────────────────────────────────────── */
  /* The app writes to the `terminals` table. A prototype has no table, so
     add-barangay.html writes to localStorage under these two keys and the
     registry appends whatever it finds on load. The added row carries the same
     shape as a seeded one — name, km in thousandths, mid, active — so every
     derivation above keeps working on it untouched, and the seeded 20 are not
     shadowed: an added record is appended, never sorted into the literal. */
  const ADDED_KEY = 'kondukt.barangays.added';
  const FLASH_KEY = 'kondukt.barangays.flash';
  const ADDED_MUNI_KEY = 'kondukt.municipalities.added';
  const FLASH_MUNI_KEY = 'kondukt.municipalities.flash';

  function loadAdded() {
    let parsed = null;
    try {
      const raw = localStorage.getItem(ADDED_KEY);
      if (raw) parsed = JSON.parse(raw);
    } catch (e) { parsed = null; }
    /* localStorage is writable by anything on the origin, so this is a trust
       boundary: a row that is not the shape above is dropped, never rendered.
       One bad row must not cost the driver the rows that are good. */
    if (!Array.isArray(parsed)) return;
    parsed.forEach(function (r) {
      if (!r || typeof r.name !== 'string' || r.name === '' ||
          typeof r.km !== 'number' || !isFinite(r.km) || r.km <= 0 ||
          (r.mid !== null && muniOf(r.mid) === null)) return;
      BARANGAYS.push({
        id: 1000 + BARANGAYS.length,
        name: r.name, km: r.km, mid: r.mid, active: r.active !== false
      });
    });
  }

  /* The same bridge for the other table. add-municipality.html writes here,
     and this pushes the rows into the seeded literal rather than keeping a
     second collection beside it: muniOf(), the scope menu, the counts, the
     search and the "19 of 19" total all read MUNICIPALITIES, so one push is
     the whole wiring and nothing downstream can miss a row. Ids are minted
     here, not written by the other screen, for loadAdded()'s reason — the
     autoincrement is the store's business — and 1000 + length keeps them out
     of the seeded 1..19 the same way.
   *
   * CALLED FIRST, and that order is load-bearing: loadAdded() drops a row
   * whose mid resolves to nothing, so a barangay saved against a municipality
   * added in the same session is silently lost unless the municipality is
   * already in the literal. */
  function loadAddedMunicipalities() {
    let parsed = null;
    try {
      const raw = localStorage.getItem(ADDED_MUNI_KEY);
      if (raw) parsed = JSON.parse(raw);
    } catch (e) { parsed = null; }
    if (!Array.isArray(parsed)) return;
    parsed.forEach(function (r) {
      if (!r || typeof r.name !== 'string' || r.name === '' ||
          typeof r.province !== 'string' || r.province === '') return;
      MUNICIPALITIES.push({
        id: 1000 + MUNICIPALITIES.length,
        name: r.name, province: r.province, active: r.active !== false
      });
    });
  }

  /* The add screen names what it stored; the registry says so once and then
     forgets it, so reloading does not repeat a message about a write that
     already happened. Both keys are read, because both tables have an add
     screen now; whichever is set wins, and both are cleared. */
  function takeFlash() {
    let m = null;
    try {
      m = localStorage.getItem(FLASH_MUNI_KEY) || localStorage.getItem(FLASH_KEY);
      if (m !== null) {
        localStorage.removeItem(FLASH_KEY);
        localStorage.removeItem(FLASH_MUNI_KEY);
      }
    } catch (e) { m = null; }
    if (m) state.ui.message = m;
  }


  /* The card's second line. Empty segments are dropped, so an unlinked row
     prints its municipality alone instead of "Subic, ". */
  const captionOf = function (row) {
    const linked = row.mid === null ? null : muniOf(row.mid);
    const parts = linked ? [linked.name, linked.province] : [municipalityNameOf(row.name)];
    return parts.filter(function (p) { return p !== ''; }).join(', ');
  };
  const locationLine = function (row) {
    const linked = row.mid === null ? null : muniOf(row.mid);
    const muni = linked ? linked.name : municipalityNameOf(row.name);
    return muni === '' ? barangayNameOf(row.name) : barangayNameOf(row.name) + ', ' + muni;
  };

  /* Counts read the UNFILTERED collection and include inactive rows: a
     deactivated stop still exists and still belongs to its municipality. */
  function countsByMunicipality() {
    const map = {};
    BARANGAYS.forEach(function (b) {
      if (b.mid === null) return;
      map[b.mid] = (map[b.mid] || 0) + 1;
    });
    return map;
  }
  function activeBarangayCount(mid) {
    let n = 0;
    BARANGAYS.forEach(function (b) { if (b.mid === mid && b.active) n += 1; });
    return n;
  }

  /* ── state ───────────────────────────────────────────────────────────── */
  /* Local to the screen: re-entering shows the barangays tab, empty queries,
     no scope, ALL. Nothing here is a global store. */
  function defaults(preview) {
    const u = { tab: 'BARANGAYS', bq: '', mq: '', scope: null, status: 'ALL', message: null };
    /* Filtered: a query, the shared status filter and a municipality scope all
       applied at once — the three controls that are easy to port wrong. */
    if (preview === 'filtered') { u.bq = 'olon'; u.status = 'ACTIVE'; u.scope = 4; }
    if (preview === 'empty') { u.bq = 'zzz'; }
    return u;
  }

  const state = { preview: 'default', ui: defaults('default'), sheet: null, lastFocus: null, busy: false, pending: null };

  /* ── one derivation: search → scope → status → sort ──────────────────── */
  function derive() {
    const ui = state.ui;
    const onB = ui.tab === 'BARANGAYS';
    const needle = (onB ? ui.bq : ui.mq).trim().toLowerCase();
    const passStatus = function (active) {
      return ui.status === 'ALL' || (ui.status === 'ACTIVE') === active;
    };

    let b = BARANGAYS.filter(function (row) {
      if (needle === '') return true;
      return barangayNameOf(row.name).toLowerCase().indexOf(needle) !== -1 ||
        municipalityNameOf(row.name).toLowerCase().indexOf(needle) !== -1 ||
        captionOf(row).toLowerCase().indexOf(needle) !== -1;
    }).filter(function (row) {
      return ui.scope === null || row.mid === ui.scope;
    }).filter(function (row) { return passStatus(row.active); });
    /* KM marker ascending, then the barangay name — never by id. */
    b = b.slice().sort(function (x, y) {
      return x.km - y.km || (barangayNameOf(x.name) < barangayNameOf(y.name) ? -1 : 1);
    });

    let m = MUNICIPALITIES.filter(function (row) {
      if (needle === '') return true;
      return row.name.toLowerCase().indexOf(needle) !== -1 ||
        row.province.toLowerCase().indexOf(needle) !== -1;
    }).filter(function (row) { return passStatus(row.active); });
    /* Municipalities order by name and by nothing else: the barangay scope
       never hides a municipality from its own tab. */
    m = m.slice().sort(function (x, y) { return x.name.localeCompare(y.name); });

    return {
      onB: onB,
      rows: onB ? b : m,
      barangays: b,
      municipalities: m,
      totalB: BARANGAYS.length,
      totalM: MUNICIPALITIES.length,
      filtered: needle !== '' || ui.status !== 'ALL' || ui.scope !== null,
      hasQuery: needle !== ''
    };
  }

  /* The scope menu: All, then ACTIVE municipalities only, name-ordered. */
  function scopeItems() {
    return [{ id: null, label: 'All Municipalities' }].concat(
      MUNICIPALITIES.filter(function (m) { return m.active; })
        .slice().sort(function (x, y) { return x.name.localeCompare(y.name); })
        .map(function (m) { return { id: m.id, label: m.name + ', ' + m.province }; })
    );
  }
  function scopeLabel() {
    const id = state.ui.scope;
    if (id === null) return 'All Municipalities';
    const m = muniOf(id);
    return m ? m.name + ', ' + m.province : 'All Municipalities';
  }

  /* ── chrome, state blocks ────────────────────────────────────────────── */
  function renderChrome(v) {
    let sub = v.totalB + ' ' + plural(v.totalB, 'barangay', 'barangays') + ' · ' +
      v.totalM + ' ' + plural(v.totalM, 'municipality', 'municipalities');
    if (state.preview === 'loading') sub = 'Loading locations';
    if (state.preview === 'error') sub = 'Location configuration unavailable';
    $('chromeSub').textContent = sub;
  }

  /* Four skeleton rows in the row geometry, because the list is what is
     loading. A spinner says nothing about the shape of what is coming. */
  function skRow() {
    return '<div class="sk-row" aria-hidden="true">' +
      '<span class="sk" style="width:48px;height:48px;border-radius:var(--radius-md)"></span>' +
      '<span class="sk-lines"><span class="sk" style="display:block;height:14px;width:62%"></span>' +
      '<span class="sk" style="display:block;height:12px;width:38%;margin-top:8px"></span></span>' +
      '</div>';
  }

  function renderState() {
    const slot = $('stateSlot');
    const live = $('live');
    const p = state.preview;
    if (p === 'loading') {
      slot.hidden = false;
      live.hidden = true;
      slot.innerHTML = '<p class="sr-only" role="status">Loading locations</p>' +
        '<div class="list">' + skRow() + skRow() + skRow() + skRow() + '</div>';
      return;
    }
    if (p === 'error') {
      slot.hidden = false;
      live.hidden = true;
      /* The shell's own failure block. Settings ships this card, so a driver
         who has seen it there recognises it here without reading it. */
      slot.innerHTML = '<div class="state error" role="alert">' +
        '<h3 class="title-m">Location configuration unavailable</h3>' +
        '<p class="body-m">Unable to load location configuration.</p>' +
        '<a class="primary-btn label-l" href="settings.html" data-od-id="bc-goback">GO BACK</a>' +
        '</div>';
      return;
    }
    slot.hidden = true;
    slot.innerHTML = '';
    live.hidden = false;
  }

  /* The segment, exactly as Dashboard's period control draws it: two cells, a
     count in each, aria-checked on the current one. The count lives in the tab
     because these are two collections of known size, not two filters. */
  function renderTabs(v) {
    const ui = state.ui;
    const defs = [
      { key: 'BARANGAYS', glyph: 'barangay', n: v.totalB, word: 'Barangays' },
      { key: 'MUNICIPALITIES', glyph: 'municipality', n: v.totalM, word: 'Municipalities' }
    ];
    $('tabs').innerHTML = defs.map(function (d) {
      const sel = d.key === ui.tab;
      return '<button type="button" class="seg-btn" role="radio" data-act="tab" data-tab="' + d.key +
        '" data-od-id="bc-tab-' + d.key + '" aria-checked="' + (sel ? 'true' : 'false') + '">' +
        '<span class="label-l">' + d.word + '</span>' +
        '<span class="body-s tabular" style="margin-left:8px;opacity:.72">' + d.n + '</span></button>';
    }).join('');
  }

  /* .caution, the shell's inline notice. A deactivation confirmation is one
     sentence that has to be read and then dismissed, which is what that card
     is for on Current Trip. */
  function renderMsg() {
    const ui = state.ui;
    $('msgSlot').innerHTML = ui.message === null ? '' :
      '<div class="caution bc-msg" role="status" data-od-id="bc-banner" style="margin-top:16px">' +
      '<p class="body-s">' + esc(ui.message) + '</p>' +
      '<button type="button" data-act="dismissmsg" data-od-id="bc-msg-x" aria-label="Dismiss message">' + icon('close', 18) + '</button>' +
      '</div>';
  }

  function renderHead(v) {
    const onB = v.onB;
    const total = onB ? v.totalB : v.totalM;
    const shown = v.rows.length;
    const word = onB ? 'Barangay' : 'Municipality';
    $('secLabel').textContent = onB ? 'BARANGAYS' : 'MUNICIPALITIES';
    /* "3 of 20", not "20 total · 3 shown". The eyebrow already says what these
       are; the number inside the commit pill only has to answer how many are
       on screen — and printing it there keeps count and action one control,
       so the section head never has to fit both. */
    $('secCount').innerHTML = shown === total ? '<b>' + total + '</b>' : '<b>' + shown + '</b> of ' + total;
    $('secCount').setAttribute('aria-label', shown + ' of ' + total + ' ' + word.toLowerCase() + plural(total, '', 's') + ' shown');
    $('addLabel').textContent = onB ? 'ADD BARANGAY' : 'ADD MUNICIPALITY';
    $('secNote').textContent = onB
      ? 'Used when creating passenger tickets.'
      : 'Barangays are assigned to a municipality here.';
    $('offlineBody').textContent = onB
      ? 'All barangays are saved locally and work offline.'
      : 'All location configurations are saved locally and work offline.';
  }

  /* The two pickers, in add-trip's `.field`. The search is the same box with a
     caret in it, so the column reads as one control group and not two controls
     that happen to be near each other. */
  function renderControls(v) {
    const ui = state.ui;
    const onB = v.onB;
    const q = onB ? ui.bq : ui.mq;
    let h = '<label class="field as-input" data-od-id="bc-searchwrap">' +
      '<span class="f-icon">' + icon('search', 18) + '</span>' +
      '<span class="f-body"><span class="sr-only">Search ' + (onB ? 'barangays' : 'municipalities') + '</span>' +
      '<span class="f-value"><input type="search" id="q" data-od-id="bc-q" autocomplete="off" spellcheck="false" ' +
      'aria-label="' + (onB ? 'Search barangays' : 'Search municipalities') + '" ' +
      'placeholder="' + (onB ? 'Search barangays' : 'Search municipalities') + '" value="' + esc(q) + '" /></span>' +
      '</span></label>';

    /* The scope only means anything on a barangay list, so it is the only
       control that appears and disappears with the tab. */
    if (onB) {
      const off = ui.scope !== null;
      h += '<button type="button" class="field" data-act="scope" data-od-id="bc-scope-btn" aria-haspopup="dialog" ' +
        'aria-label="Municipality scope: ' + esc(scopeLabel()) + '. Opens the municipality list.">' +
        '<span class="f-icon">' + icon('pin', 18) + '</span>' +
        '<span class="f-body"><span class="f-label">Municipality</span>' +
        '<span class="f-value' + (off ? '' : ' empty') + '">' + esc(scopeLabel()) + '</span></span>' +
        '<span class="f-chev">' + icon('chevronDown', 18) + '</span></button>';
    }
    $('controlFields').innerHTML = h;
  }

  /* Dashboard's caption: the one sentence that qualifies the control above it.
     Here it names the status filter, which is the defect the old build had —
     a control that tinted itself without ever saying which value was applied. */
  function renderStatusLine(v) {
    const ui = state.ui;
    const on = ui.status !== 'ALL';
    $('statusCaption').innerHTML = '<span class="dot" style="background:' + (on ? 'var(--primary)' : 'var(--outline)') + '"></span>' +
      '<span>Status filter: <b>' + ui.status + '</b>, applied to both lists. ' +
      '<button type="button" class="text-action label-l" data-act="status" data-od-id="bc-status" ' +
      'aria-haspopup="dialog" ' +
      'aria-label="Status filter is ' + ui.status + '. Change it.">Change</button></span>';
  }

  /* ── one record shape, for both collections ──────────────────────────── */
  /* Settings' `.mod` minus its chip: title, value, trailing status and chevron.
     Both collections render through this and nothing else, which is the whole
     point — the old build had a barangay card and a municipality card, and a
     driver could not have told which one they were looking at until they read
     the label.

     The chip is gone on purpose. Settings' chip carries a per-module glyph;
     here the list is scoped to one collection, so all twenty rows wore the same
     twenty-four-pixel glyph telling the driver something the section header
     already says. Deleting it gives the name and the location the 60px, which
     is what the two-line clamp was starving — without it, "Olongapo City ·
     231.0 KM" ellipsised. Decoration that repeats twenty times is not
     information, it is a gutter tax. */
  function recordCard(kind, id, title, value, active, unlinked, label) {
    return '<button type="button" class="mod' + (unlinked ? ' unlinked' : '') + '" data-act="open" ' +
      'data-kind="' + kind + '" data-id="' + id + '" data-od-id="bc-' + kind + '-' + id + '" ' +
      'aria-label="' + esc(label) + '">' +
      '<span class="mod-body">' +
      '<span class="mod-title">' + esc(title) + '</span>' +
      '<span class="mod-value body-m">' + esc(value) + '</span>' +
      '</span>' +
      '<span class="mod-end">' +
      '<span class="bc-state ' + (active ? 'on' : 'off') + ' label-s" aria-hidden="true">' + (active ? 'ACTIVE' : 'INACTIVE') + '</span>' +
      '<span class="mod-chev" aria-hidden="true">' + icon('chevron', 18, 'currentColor', 2) + '</span>' +
      '</span></button>';
  }
  function barangayCard(row) {
    /* One line, always. The value is the answer to the question the row
       raises, and the second line is where a third fact used to go — which is
       what pushed these cards past Settings' fixed 90px. */
    const value = row.mid === null
      ? 'Not linked · ' + fmtKm(row.km)
      : locationLine(row).split(', ').slice(1).join(', ') + ' · ' + fmtKm(row.km);
    const name = barangayNameOf(row.name);
    return recordCard('bgy', row.id, name, value, row.active, row.mid === null,
      name + ', ' + value + '. ' + (row.active ? 'Active.' : 'Inactive.') + ' Opens the record.');
  }
  function municipalityCard(row, count) {
    const value = row.province + ' · ' + count + ' ' + plural(count, 'barangay', 'barangays');
    return recordCard('mun', row.id, row.name, value, row.active, false,
      row.name + ', ' + value + '. ' + (row.active ? 'Active.' : 'Inactive.') + ' Opens the record.');
  }

  /* ── the empty state, three shapes ───────────────────────────────────── */
  /* `.inline-empty` is trip-tickets' and passenger's. Three causes still get
     three messages, and only one of them is a search miss — the other two say
     which filter emptied the list and offer to put it back, instead of
     inviting a second add for records that are still there. */
  function inlineEmpty(odId, title, body, action) {
    return '<div class="inline-empty" data-od-id="' + odId + '">' +
      '<p class="label-s" style="color:var(--glass-on)">' + title + '</p>' +
      '<p class="body-s" style="margin-top:8px">' + body + '</p>' +
      (action ? '<div class="card-actions">' + action + '</div>' : '') + '</div>';
  }
  function emptyHTML(v) {
    const ui = state.ui;
    const onB = v.onB;
    const noun = onB ? 'barangays' : 'municipalities';
    if (v.hasQuery) {
      return inlineEmpty('bc-empty', 'NO MATCH', 'No ' + noun + ' match that search.',
        '<button type="button" class="ghost-btn" data-act="clearquery" data-od-id="bc-clearq">' +
        '<span class="label-l">Clear the search</span></button>');
    }
    if (v.filtered) {
      const bits = [];
      if (ui.scope !== null) bits.push(scopeLabel());
      if (ui.status !== 'ALL') bits.push(ui.status + ' only');
      return inlineEmpty('bc-empty', 'FILTERED OUT', 'No ' + noun + ' are ' + esc(bits.join(' and ')) +
        '. They are still saved.',
        '<button type="button" class="ghost-btn" data-act="clear" data-od-id="bc-clear">' +
        '<span class="label-l">Clear the filter</span></button>');
    }
    return inlineEmpty('bc-empty', 'NOTHING HERE YET', onB
      ? 'Add a barangay to create passenger ticket locations.'
      : 'Add a municipality before assigning barangays.', '');
  }

  function renderList(v) {
    const counts = countsByMunicipality();
    const rows = v.rows;
    if (rows.length === 0) {
      $('list').innerHTML = emptyHTML(v);
      return;
    }
    $('list').innerHTML = rows.map(function (row) {
      return v.onB ? barangayCard(row) : municipalityCard(row, counts[row.id] || 0);
    }).join('');
  }

  /* ── overlays ────────────────────────────────────────────────────────── */
  function closeOverlay() {
    const root = $('overlayRoot');
    if (!root.firstChild) return;
    if (state.lastFocus && state.lastFocus.isConnected) state.lastFocus.focus();
    root.innerHTML = '';
    state.sheet = null;
    state.busy = false;
  }
  function openOverlay(html) {
    state.lastFocus = document.activeElement;
    state.sheet = html;
    $('overlayRoot').innerHTML = html;
    const af = $('overlayRoot').querySelector('[data-autofocus]');
    if (af) af.focus();
  }
  function renderOverlay() {
    if (state.sheet !== null) $('overlayRoot').innerHTML = state.sheet;
  }
  function detailRow(k, v) {
    return '<div class="detail-row"><span class="k body-m">' + esc(k) +
      '</span><span class="v body-m tabular">' + esc(v) + '</span></div>';
  }
  function sheet(title, sub, body) {
    return '<div class="scrim bottom" data-scrim="1">' +
      '<div class="sheet bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">' +
      '<div class="sheet-head"><div class="sheet-titles">' +
      '<h2 class="headline-s" id="sheetTitle">' + esc(title) + '</h2>' +
      (sub ? '<p class="body-s muted">' + esc(sub) + '</p>' : '') +
      '</div><button type="button" class="icon-btn" data-act="close" data-od-id="bc-sheet-close" ' +
      'data-autofocus aria-label="Close">' + icon('close', 20) + '</button></div>' +
      '<div class="sheet-body">' + body + '</div></div></div>';
  }
  /* The two filters open the same bottom sheet every other screen opens, and
     the list inside it is `.pick-row` — the row add-ticket and passenger use
     to hand a boarding to a terminal. A filter is a pick. `.pick-row` already
     carries its own 8px top margin, so the sheet needs no extra rhythm. */
  function pickRow(act, value, label, current, odId) {
    return '<button type="button" class="pick-row" data-act="' + act + '" data-value="' + esc(value) +
      '" data-od-id="' + odId + '" aria-current="' + (current ? 'true' : 'false') + '">' +
      '<span class="pk-body"><span class="pk-name">' + esc(label) + '</span>' +
      (current ? '<span class="pk-sub body-s">Currently applied</span>' : '') + '</span>' +
      '<span class="mod-chev" aria-hidden="true">' + icon('check', 18, 'currentColor', 2.4) + '</span></button>';
  }

  function openStatusMenu() {
    const ui = state.ui;
    let o = '';
    ['ALL', 'ACTIVE', 'INACTIVE'].forEach(function (v) {
      o += pickRow('pickstatus', v, v, ui.status === v, 'bc-status-' + v);
    });
    openOverlay(sheet('Status filter', 'Applies to both lists', o));
  }
  function openScopeMenu() {
    const ui = state.ui;
    let o = '';
    scopeItems().forEach(function (it) {
      const v = it.id === null ? '' : String(it.id);
      o += pickRow('pickscope', v, it.label, ui.scope === it.id, 'bc-scope-' + (it.id === null ? 'all' : it.id));
    });
    openOverlay(sheet('Municipality scope', 'Narrows the barangay list', o));
  }

  /* The record sheet. This is where the old card's two buttons moved: the row
     opens, the sheet shows what is stored, and the two actions sit at the
     bottom the way every other sheet in the app puts them. */
  function openRecord(kind, id) {
    let rows = '';
    let title = '';
    let sub = '';
    let active = false;
    if (kind === 'bgy') {
      const r = BARANGAYS.filter(function (x) { return x.id === id; })[0];
      title = barangayNameOf(r.name);
      sub = locationLine(r);
      active = r.active;
      rows = detailRow('Municipality', r.mid === null ? 'Not linked' : captionOf(r)) +
        detailRow('Registered KM', fmtKm(r.km)) +
        detailRow('Status', r.active ? 'ACTIVE' : 'INACTIVE') +
        detailRow('Barangay ID', String(r.id));
    } else {
      const m = muniOf(id);
      const c = countsByMunicipality()[id] || 0;
      title = m.name;
      sub = m.province;
      active = m.active;
      rows = detailRow('Province', m.province) +
        detailRow('Barangays', c + ' ' + plural(c, 'Barangay', 'Barangays')) +
        detailRow('Active barangays', String(activeBarangayCount(id))) +
        detailRow('Status', m.active ? 'ACTIVE' : 'INACTIVE') +
        detailRow('Municipality ID', String(m.id));
    }
    openOverlay(sheet(title, sub, '<div class="detail-card" data-od-id="bc-record-rows">' + rows + '</div>' +
      '<p class="body-s muted" style="margin-top:12px">The stored values this record reads. Nothing is written from this sheet.</p>' +
      '<div class="sheet-actions">' +
      '<button type="button" class="ghost label-l" data-act="edit" data-kind="' + kind + '" data-id="' + id + '" ' +
      'data-od-id="bc-edit-' + id + '">' + 'EDIT' + '</button>' +
      '<button type="button" class="destructive label-l" data-act="deact" data-kind="' + kind + '" data-id="' + id + '" ' +
      'data-od-id="bc-deact-' + id + '"' + (active ? '' : ' aria-disabled="true"') + '>DEACTIVATE</button>' +
      '</div>'));
  }

  /* The confirmation. Deliberately not error-tinted: nothing here is deleted,
     only deactivated, and a red confirm on a reversible write teaches the
     wrong reflex for the one screen where the reflex matters. */
  function openDeactivate(kind, id) {
    let title = '';
    let body = '';
    if (kind === 'bgy') {
      const r = BARANGAYS.filter(function (x) { return x.id === id; })[0];
      title = 'Deactivate Barangay?';
      body = locationLine(r) + ' will no longer appear when creating new passenger tickets. ' +
        'Existing ticket history will not be affected.';
    } else {
      const m = muniOf(id);
      title = 'Deactivate Municipality?';
      body = m.name + ' will be deactivated if it has no active barangays.';
    }
    openOverlay(sheet(title, '', '<p class="body-m muted" data-od-id="bc-confirm-body">' + esc(body) + '</p>' +
      '<div class="sheet-actions">' +
      '<button type="button" class="ghost label-l" data-act="cancel" data-od-id="bc-confirm-cancel">CANCEL</button>' +
      '<button type="button" class="primary-btn" data-act="confirm" data-kind="' + kind + '" data-id="' + id + '" ' +
      'data-od-id="bc-confirm-go" style="margin-top:0">DEACTIVATE</button>' +
      '</div>'));
  }

  const GENERIC_MUNICIPALITY_FAILURE = 'Unable to deactivate municipality.';
  const MUNICIPALITY_ACTIVE_REASON = 'This municipality still has active barangays. Deactivate them first.';

  function runDeactivate(kind, id) {
    if (state.busy) return;
    state.busy = true;
    const btn = $('overlayRoot').querySelector('[data-act="confirm"]');
    if (btn) { btn.disabled = true; btn.textContent = 'Deactivating…'; }
    /* One write, then the message. The list follows the data, never an
       optimistic flip, and a rejection never touches the load branch. */
    window.setTimeout(function () {
      state.busy = false;
      let message;
      if (kind === 'bgy') {
        const r = BARANGAYS.filter(function (x) { return x.id === id; })[0];
        if (!r) { message = 'Unable to deactivate barangay.'; }
        else { r.active = false; message = 'Barangay deactivated.'; }
      } else if (kind === 'mun') {
        const m = muniOf(id);
        if (!m) { message = GENERIC_MUNICIPALITY_FAILURE; }
        else if (activeBarangayCount(id) > 0) { message = MUNICIPALITY_ACTIVE_REASON; }
        else { m.active = false; message = 'Municipality deactivated.'; }
      } else {
        /* Fail closed. An unrecognised kind is a caller bug, and guessing
           which collection to write to is how the wrong row gets edited. */
        message = 'Unable to deactivate record.';
      }
      state.ui.message = message;
      closeOverlay();
      render();
    }, 650);
  }

  /* ── prototype states, outside the phone ─────────────────────────────── */
  function syncProto() {
    Array.prototype.forEach.call($('protoSeg').querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.state === state.preview ? 'true' : 'false');
    });
  }
  function setPreview(v) {
    state.preview = v;
    state.ui = defaults(v);
    state.sheet = null;
    state.busy = false;
    $('overlayRoot').innerHTML = '';
    syncProto();
    render();
  }

  /* ── one render ──────────────────────────────────────────────────────── */
  function render(keepControls) {
    const v = derive();
    renderChrome(v);
    renderState();
    renderTabs(v);
    renderMsg();
    renderHead(v);
    renderStatusLine(v);
    /* Typing re-renders the list only: rebuilding the field would drop the
       caret on every keystroke. */
    if (!keepControls) renderControls(v);
    renderList(v);
    renderOverlay();
  }

  /* ── wiring ──────────────────────────────────────────────────────────── */
  document.addEventListener('input', function (e) {
    const t = e.target;
    if (t && t.id === 'q') {
      if (state.ui.tab === 'BARANGAYS') state.ui.bq = t.value;
      else state.ui.mq = t.value;
      render(true);
    }
  });

  document.addEventListener('click', function (e) {
    const t = e.target;
    if (t.hasAttribute && t.hasAttribute('data-scrim')) { closeOverlay(); return; }

    const proto = t.closest && t.closest('#protoSeg button');
    if (proto) { setPreview(proto.dataset.state); return; }

    const act = t.closest && t.closest('[data-act]');
    if (!act) return;
    const a = act.dataset.act;
    const id = act.dataset.id === undefined ? null : parseInt(act.dataset.id, 10);

    if (a === 'tab') { state.ui.tab = act.dataset.tab; state.ui.message = null; render(); return; }
    if (a === 'status') { openStatusMenu(); return; }
    if (a === 'scope') { openScopeMenu(); return; }
    if (a === 'pickstatus') { state.ui.status = act.dataset.value; closeOverlay(); render(); return; }
    if (a === 'pickscope') {
      state.ui.scope = act.dataset.value === '' ? null : parseInt(act.dataset.value, 10);
      closeOverlay(); render(); return;
    }
    if (a === 'open') { openRecord(act.dataset.kind, id); return; }
    /* EDIT is a separate route in the app; from the record sheet it is the
       same sheet again, so it closes the confirm and reopens the record. */
    if (a === 'edit') { openRecord(act.dataset.kind, id); return; }
    /* aria-disabled, not disabled: an already-inactive record must still be
       reachable by keyboard, or the reason it cannot change is invisible to
       anyone not using a mouse. */
    if (a === 'deact') {
      if (act.getAttribute('aria-disabled') === 'true') return;
      openDeactivate(act.dataset.kind, id);
      return;
    }
    if (a === 'confirm') { runDeactivate(act.dataset.kind, id); return; }
    /* The pill is the only way into the add screen, so it navigates rather than
       opening a sheet: the form is a route in the app, and the record it
       writes has to be visible in this list when the driver comes back.
       Both tabs navigate — the one guard that used to sit here existed because
       there was no add-municipality screen, and there is one now
       (BarangayConfigScreen.tsx:56 already asks for the null half of the
       municipality editor). */
    if (a === 'add') {
      window.location.href = state.ui.tab === 'BARANGAYS'
        ? 'add-barangay.html' : 'add-municipality.html';
      return;
    }
    if (a === 'clear') { state.ui.bq = ''; state.ui.mq = ''; state.ui.scope = null; state.ui.status = 'ALL'; render(); return; }
    if (a === 'clearquery') { state.ui.bq = ''; state.ui.mq = ''; render(); return; }
    if (a === 'dismissmsg') { state.ui.message = null; render(); return; }
    closeOverlay();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeOverlay();
  });

  loadAddedMunicipalities();
  loadAdded();
  takeFlash();
  syncProto();
  render();
  })();

  </script>
</body>
</html>

       chrome carries the number and which trip it will be recorded against. */
    const trip = 'Trip #' + c.t.number;
    if (c.priced && c.priced.ok) {
      sub.textContent = pesos(c.priced.total) + ' · ' + trip;
    } else if (c.priced) {
      sub.textContent = 'Cannot be priced · ' + trip;
    } else {
      sub.textContent = 'No fare rules · ' + trip;
    }
  }

  /* ── controls, built once so a re-render never steals focus ────────── */
  function buildControls() {
    $('roadSeg').innerHTML = ROADS.map(function (r) {
      return '<button type="button" data-road="' + r.key + '" data-od-id="at-road-' + r.key + '" aria-pressed="false">' +
        '<span class="sr-name title-m">' + r.label + '</span>' +
        '<span class="sr-note body-s">' + r.note + '</span></button>';
    }).join('');
    $('ptSeg').innerHTML = PT_ORDER.map(function (k) {
      return '<button type="button" class="chip" data-pt="' + k + '" data-od-id="at-pt-' + k + '" aria-pressed="false" aria-label="' + PT_LABEL[k] + '">' + PT_CHIP[k] + '</button>';
    }).join('');
  }

  const calcRow = (k, v, cls) =>
    '<div class="calc-row' + (cls ? ' ' + cls : '') + '"><span class="k body-s">' + k + '</span><span class="v body-s">' + v + '</span></div>';

  function fareCardHTML(c) {
    const p = c.priced;
    if (!c.cfg) {
      return '<div class="glass fare-card" data-od-id="at-fare-card">' +
        '<p class="fc-eyebrow label-s">FARE</p>' +
        '<p class="fc-sub body-s">No fare rules on this device, so there is nothing to calculate a fare from.</p></div>';
    }
    if (!p.ok) {
      return '<div class="glass fare-card" data-od-id="at-fare-card">' +
        '<p class="fc-eyebrow label-s">FARE</p>' +
        '<p class="fc-sub body-s">' + esc(p.reason) + '</p></div>';
    }
    const cfg = c.cfg;
    const rateLabel = c.road === 'sctex' ? 'Expressway rate' : 'Ordinary rate';
    const rateK = p.isSpecial ? 'Special rate' : rateLabel;
    const notes = [];
    if (p.minDistBinds) {
      notes.push('This route is shorter than the ' + fmtKm(cfg.minimumDistanceMilli) +
        ' minimum distance, so ' + fmtKm(cfg.minimumDistanceMilli) + ' is billed.');
    }
    if (p.minFareBinds) {
      notes.push('That works out under the ' + pesos(cfg.minimumFareCentavos) +
        ' minimum fare, so ' + pesos(cfg.minimumFareCentavos) + ' is charged.');
    }
    if (p.isSpecial) {
      notes.push('Student, senior citizen and PWD fares use the special rate, not the per-kilometre rate for the road.');
    }
    if (c.road === 'sctex') {
      notes.push('The road is a setting on trip #' + c.t.number + ', so it prices every ticket on this trip.');
    }
    return '<div class="glass fare-card fare-solid" data-od-id="at-fare-card">' +
      '<p class="fc-eyebrow label-s">FARE</p>' +
      '<p class="fc-sub body-s">' + esc(PT_LABEL[c.pt]) + ' · ' + plural(c.qty, 'passenger', 'passengers') + '</p>' +
      '<p class="fc-route headline-s">' + esc(p.from.name) + '<span class="arrow" aria-hidden="true">' + icon('arrow', 18, 'currentColor', 2) + '</span>' + esc(p.to.name) + '</p>' +
      '<div class="calc">' +
      calcRow('Distance', fmtKm(p.distMilli)) +
      /* The toll-road adjustment is deliberately not a row on the amber card.
         The full formula, adjustment included, still lives one tap away in the
         rules sheet, which is where a conductor disputing a peso goes anyway.
         ponytail: re-add calcRow('Toll road adjustment', '+' + fmtKm(p.adjMilli))
         here if the card ever has to reconcile Distance against Billable
         distance on its own face. */
      calcRow('Billable distance', fmtKm(p.billableMilli)) +
      calcRow(rateK + ' per km', rateText(p.rate)) +
      calcRow('Fare per passenger', pesos(p.each)) +
      '<div class="calc-row sum"><span class="k body-s">Total · ' + plural(c.qty, 'passenger', 'passengers') +
      '</span><span class="v" aria-live="polite" data-od-id="at-total">' + pesos(p.total) + '</span></div>' +
      '</div>' +
      (notes.length ? notes.map(function (n) { return '<p class="fc-note body-s">' + esc(n) + '</p>'; }).join('') : '') +
      '<button type="button" class="text-action" data-act="rules" data-od-id="at-rules-open">' +
      '<span class="label-s">HOW THIS IS CALCULATED</span>' + icon('chevron', 14, 'currentColor', 2) + '</button>' +
      '</div>';
  }

  /* ── states ────────────────────────────────────────────────────────── */
  const stateCard = (od, title, detail, foot) =>
    '<div class="state' + (od === 'at-error' ? ' error' : '') + '" data-od-id="' + od + '">' +
    '<h3 class="title-m">' + title + '</h3><p class="body-s">' + detail + '</p>' + (foot || '') + '</div>';

  function rulesHTML(c) {
    return stateCard('at-nofares', 'No fare rules are set on this device',
      'A ticket records a fare, so the fare has to come from somewhere. This device has no fare rules yet, so nothing can be priced or recorded until they are set.',
      handoff('Fare settings, where the minimum fare, the per-kilometre rates and the toll-road adjustment are configured'));
  }

  const handoff = (where, extra) =>
    '<div class="handoff"><p class="nb-title label-s">WHERE THIS GOES</p>' +
    '<p class="body-s">In the app this opens <b class="strong">' + where + '</b>. In this prototype it opens this preview, so the handoff and the figures it would carry are both visible without leaving the screen.' +
    (extra || '') + '</p></div>';

  /* ── render ────────────────────────────────────────────────────────── */
  /* Two shapes, and the split is on whether there is anything to fill in. The
     three whole-screen states own the phone outright; the two working states put
     the form in .app-scroll so the fare card can be scrolled to. */
  function render() {
    const c = compute();
    renderChrome(c);
    const working = c.view === 'ready' || c.view === 'nofares';
    $('formSection').hidden = !working;
    $('fareSection').hidden = !working;
    $('commitSection').hidden = !working;
    $('scroll').hidden = !working;
    $('rulesSection').hidden = working;
    if (working) {
      if (c.view === 'nofares') $('rulesSlot').innerHTML = rulesHTML(c);
      renderForm(c);
      $('fareSlot').innerHTML = fareCardHTML(c);
      renderCommit(c);
      renderRecent(c);
    } else {
      $('rulesSlot').innerHTML = wholeScreenHTML(c);
    }

    renderNote(c);
    renderOverlay();
  }

  function wholeScreenHTML(c) {
    if (c.view === 'loading') {
      return '<div class="state" data-od-id="at-loading"><div class="skeleton">' +
        '<div class="sk" style="height:16px;width:60%"></div>' +
        '<div class="sk" style="height:56px;margin-top:14px"></div>' +
        '<div class="sk" style="height:56px;margin-top:8px"></div>' +
        '<div class="sk" style="height:96px;margin-top:20px"></div></div></div>';
    }
    if (c.view === 'error') {
      return stateCard('at-error', 'Local records could not be read',
        'The trip this ticket belongs to is stored on this device, and the device did not answer. Nothing has been recorded.',
        '<button type="button" class="primary-btn" data-act="retry" data-od-id="at-retry">Try again</button>');
    }
    return stateCard('at-notrips', 'No trip is running',
      'A ticket is recorded against a trip, so there is nothing to add one to. Start a trip and this screen will price the next boarding.',
      handoff('Trip management, where a trip is started'));
  }

  function renderForm(c) {
    const p = c.priced;
    const ok = !!(p && p.ok);
    $('boardValue').textContent = c.board ? c.board.name : 'Choose where they get on';
    $('boardValue').className = 'f-value title-m' + (c.board ? '' : ' empty');
    $('dropValue').textContent = c.drop ? c.drop.name : 'Choose where they get off';
    $('dropValue').className = 'f-value title-m' + (c.drop ? '' : ' empty');
    $('legDist').textContent = ok ? fmtKm(p.distMilli) + ' between terminals' : 'Distance is not set until both ends are chosen';
    $('legWarn').hidden = ok;
    if (!ok) $('legWarn').textContent = p ? p.reason : 'No fare rules on this device, so the distance is not priced.';

    Array.prototype.forEach.call($('roadSeg').querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.road === c.road ? 'true' : 'false');
    });

    Array.prototype.forEach.call($('ptSeg').querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.pt === c.pt ? 'true' : 'false');
    });
    $('qtyValue').textContent = plural(c.qty, 'passenger', 'passengers');
    $('qtyDown').disabled = c.qty <= QTY_MIN;
    $('qtyUp').disabled = c.qty >= QTY_MAX;
  }

  /* A disabled button that says nothing is a dead end, so the reason is on the
     screen in words as soon as there is one to give. */
  function renderCommit(c) {
    const btn = $('recordBtn');
    const reason = $('blockReason');
    const hint = $('commitHint');
    let why = '';
    if (!c.cfg) why = 'No fare rules on this device, so there is no price to record.';
    else if (!c.priced.ok) why = c.priced.reason;
    btn.disabled = !!why;
    reason.hidden = !why;
    if (why) reason.textContent = why;
    $('recordLabel').textContent = (!why && c.priced.ok) ? 'Record ' + pesos(c.priced.total) + ' ticket' : 'Record ticket';
    hint.hidden = false;
    hint.textContent = 'Records against trip #' + c.t.number +
      ', is counted on the trip and on Home, and cannot be edited afterwards. It appears in the list below, and the next boarding starts from here.';
  }

  /* The press. Nothing navigates away, because the trip has not ended and the
     next rider is at the door: the ticket is stamped, pushed onto the top of the
     ledger, and the quantity drops back to 1. The route, road and fare type stay
     filled in — the next group usually boards at the same stop on the same bus —
     while the quantity does not, because twenty people standing there is a
     second boarding, not a correction to the first. */
  function recordTicket(c) {
    const t = makeTicket(c.priced, c.road, c.pt, new Date(), nextTicketId++);
    state.log.unshift(t);
    state.qty = QTY_MIN;
    return t;
  }


  function renderNote(c) {
    $('storageNote').textContent = c.view === 'ready'
      ? 'Stored on this device only. The fare is calculated from the trip and the fare rules, and the number is saved with the ticket.'
      : 'Stored on this device only.';
  }

  /* ── the ledger, under the commit ──────────────────────────────────── */
  /* Newest first, so the row directly beneath the fare card is the fare that was
     just recorded. The total in the head is the SAVED side of the trip, and it
     is the reason this section exists rather than a Trip tickets shortcut: the
     record that just happened has to be verifiable without leaving a screen
     whose whole premise is that it does not leave. */
  function renderRecent(c) {
    const sec = $('recentSection');
    const head = $('recentTotal');
    const cap = $('recentCap');
    const list = $('recentList');
    /* No trip means no ledger to show; no fare rules means nothing on this
       device could ever have been priced, so an empty list would be the honest
       one and the rules screen already owns the viewport. */
    if (!c.onTrip || !c.cfg) { sec.hidden = true; return; }
    sec.hidden = false;
    if (!c.log.length) {
      head.textContent = '';
      cap.hidden = true;
      list.innerHTML = '<div class="inline-empty" data-od-id="at-recent-empty"><p class="body-s">Nothing recorded on trip #' +
        c.t.number + ' yet. Every fare recorded here lands at the top of this list, which is how a boarding gets checked without leaving the screen.</p></div>';
      return;
    }
    head.textContent = pesos(c.logTotal);
    cap.hidden = !c.capped;
    cap.textContent = (c.capped
      ? 'Showing the ' + RECENT_LIMIT + ' most recent of ' + c.log.length + ' recorded on this trip'
      : plural(c.log.length, 'ticket', 'tickets') + ' recorded on this trip') +
      ' · ' + plural(c.logPax, 'passenger', 'passengers') + ' carried';
    list.innerHTML = c.recent.map(function (t) {
      return '<button type="button" class="glass row-card row-btn" data-ticket="' + t.id + '" data-od-id="at-recent-' + t.id + '">' +
        '<span class="ticket-row">' +
        '<span class="ticket-mid">' +
        '<span class="ticket-route title-m"><span class="nm">' + esc(t.from.name) + ' <span aria-hidden="true">→</span></span> <span class="nm">' + esc(t.to.name) + '</span></span>' +
        '<span class="ticket-meta body-s"><span class="cat ' + catClass(t.pt) + '">' + esc(PT_CHIP[t.pt]) + '</span>' +
        '<span>' + plural(t.qty, 'passenger', 'passengers') + ' · ' + clock(t.issuedAt) + '</span></span>' +
        '</span>' +
        '<span class="ticket-fare"><b class="body-m tabular">' + pesos(t.total) + '</b>' +
        '<span class="each body-s tabular">#' + t.id + '</span></span>' +
        '</span></button>';
    }).join('');
  }


  /* ── overlays ──────────────────────────────────────────────────────── */
  function closeOverlay() {
    state.sheet = null;
    renderOverlay();
    if (state.lastFocus && document.contains(state.lastFocus)) state.lastFocus.focus();
    state.lastFocus = null;
  }
  function openSheet(kind) {
    state.lastFocus = document.activeElement;
    state.sheet = kind;
    renderOverlay();
    const f = $('overlayRoot').querySelector('[data-autofocus]');
    if (f) f.focus();
  }

  const detailRow = (k, v) => '<div class="detail-row"><span class="k body-m">' + k + '</span><span class="v body-m tabular">' + v + '</span></div>';

  function sheet(id, title, subtitle, body) {
    return '<div class="scrim bottom" data-scrim="1"><div class="sheet bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="' + id + '" data-od-id="' + id + '-sheet">' +
      '<div class="sheet-head"><div class="sheet-titles"><h2 class="title-m" id="' + id + '">' + title + '</h2>' +
      (subtitle ? '<p class="body-s muted">' + subtitle + '</p>' : '') + '</div>' +
      '<button type="button" class="icon-btn" data-act="close" data-od-id="' + id + '-close" aria-label="Close" data-autofocus>' +
      icon('close', 18, 'currentColor', 2) + '</button></div>' +
      '<div class="sheet-body">' + body + '</div></div></div>';
  }

  /* Two terminals, one list. The other end is MARKED, not blocked: the app's own
     addTripState lets the same terminal be chosen on both ends and returns
     'Origin and destination are the same terminal.' (:35), so disabling the row
     would hide a refusal the driver will meet in the app and would leave the
     rest of price()'s validation unreachable. The row says which end it already
     is, the tap lands, and the fare card refuses in the app's words. */
  function stopSheetHTML(c, which) {
    const mine = which === 'board' ? c.board : c.drop;
    const other = which === 'board' ? c.drop : c.board;
    const otherWord = which === 'board' ? 'destination' : 'boarding point';
    const rows = STOPS.map(function (s) {
      const isOther = other && s.id === other.id;
      return '<button type="button" class="pick-row" data-stop="' + s.id + '" data-od-id="at-stop-' + s.id + '"' +
        ' aria-current="' + (mine && mine.id === s.id ? 'true' : 'false') + '">' +
        '<span class="pk-body"><span class="pk-name title-m">' + esc(s.name) + '</span>' +
        '<span class="pk-sub body-s">' + esc(s.muni) + ' · km ' + fmtKm(s.km) +
        (s.seeded ? '' : ' · placed') + (isOther ? ' · already the ' + otherWord : '') + '</span></span>' +
        (isOther ? '<span class="st-pill"><span class="st-pill-text label-s">IN USE</span></span>' : '') + '</button>';
    }).join('');
    return sheet(which === 'board' ? 'board' : 'drop',
      which === 'board' ? 'Boarding point' : 'Destination',
      plural(STOPS.length, 'terminal', 'terminals') + ' on this device',
      rows + '<p class="pick-more body-s">Five of these are the terminals the app seeds. The other twelve are placed on the same Olongapo → Caloocan scale so the distance between any two of them is real arithmetic — a device only carries the terminals its operator configured.</p>');
  }

  /* The rules, and the two places this screen had to decide something the app
     left undecided. Stating them is the honest move: this is the only place the
     fare is computed, and a conductor disputing a peso needs to know which rule
     produced it. */
  function rulesSheetHTML(c) {
    const cfg = c.cfg;
    return sheet('rules', 'Fare rules', 'As this device has them',
      detailRow('Minimum fare', pesos(cfg.minimumFareCentavos)) +
      detailRow('Minimum distance', fmtKm(cfg.minimumDistanceMilli)) +
      detailRow('Ordinary rate', rateText(cfg.ratePerKmCentavos) + ' per km') +
      detailRow('SCTEX rate', rateText(cfg.sctexRatePerKmCentavos) + ' per km') +
      detailRow('Special rate', rateText(cfg.specialRatePerKmCentavos) + ' per km') +
      detailRow('SCTEX adjustment', '+' + fmtKm(cfg.sctexKmAdjustmentMilli)) +
      '<div class="detail-card" style="margin-top:12px">' +
      '<p class="body-s" style="padding:12px"><b class="strong">How the fare is worked out</b></p>' +
      '<p class="body-s" style="padding:0 12px 12px">The billable distance is the route distance, or the minimum distance if the route is shorter, and then the toll-road adjustment is added on top of that. The rate for the chosen road is multiplied by it, rounded to the nearest centavo, and the minimum fare applies if the result is lower.</p>' +
      '<p class="body-s" style="padding:0 12px 12px">The order of those two steps is this screen\'s decision, not the app\'s: the app stores a minimum distance and a toll-road adjustment and computes neither, so nothing states which one the floor is measured against. Treating the adjustment as billed-for distance rather than driven distance is the reading taken here.</p>' +
      '<p class="body-s" style="padding:0 12px 12px">Deluxe and the two discounts are not used on this screen. Deluxe is a service level chosen in Fare settings, and both discount percentages are already folded into the special rate as it is stored.</p>' +
      '</div>' +
      handoff('Fare settings, where all ten of these are edited'));
  }

  /* One sheet, two openings: the confirmation for the ticket that was just
     recorded, and the detail for one already in the ledger. They are the same
     ticket with the same numbers, so they are one function — the only difference
     is that a fresh record also states where the trip now stands and hands the
     conductor back to the form. */
  function ticketSheetHTML(c, t, justRecorded) {
    /* Which of the two minimums bound this fare, said from the numbers ON THE
       TICKET rather than from the current rules: a peso read back months later
       has to be explicable by the fare that was stored with it, not by whatever
       the rate table says today. The billable distance and the rate are on every
       ticket, so the peso can be re-derived by hand from this sheet alone. */
    const floors = [];
    if (t.minDistBinds) floors.push('The terminals are ' + fmtKm(t.distMilli) + ' apart, so ' + fmtKm(t.billableMilli) + ' is billed against the minimum distance');
    if (t.minFareBinds) floors.push('That works out under the minimum fare, so ' + pesos(t.each) + ' per passenger is charged');
    return sheet(justRecorded ? 'recorded' : 'ticket',
      justRecorded ? 'Ticket recorded' : 'Ticket #' + t.id,
      'Trip #' + c.t.number + ' · ' + clock(t.issuedAt),
      detailRow('Boarding point', esc(t.from.name) + ' · ' + esc(t.from.muni)) +
      detailRow('Destination', esc(t.to.name) + ' · ' + esc(t.to.muni)) +
      detailRow('Distance', fmtKm(t.distMilli)) +
      detailRow('Billable distance', fmtKm(t.billableMilli) + ' at ' + rateText(t.rate) + ' per km') +
      detailRow('Road', t.road === 'sctex' ? 'SCTEX · +' + fmtKm(t.adjMilli) : 'Ordinary') +
      detailRow('Fare type', PT_LABEL[t.pt]) +
      detailRow('Passengers', plural(t.qty, 'passenger', 'passengers')) +
      detailRow('Fare per passenger', pesos(t.each)) +
      detailRow(justRecorded ? 'Recorded now' : 'Recorded', pesos(t.total)) +
      (justRecorded ? detailRow('Trip #' + c.t.number + ' so far', pesos(c.logTotal) + ' · ' + plural(c.log.length, 'ticket', 'tickets')) : '') +
      (floors.length ? '<p class="body-s commit-hint">' + floors.join('. ') + '.</p>' : '') +
      (justRecorded
        ? '<button type="button" class="primary-btn wide" data-act="again" data-od-id="at-record-another">Record another</button>' +
          '<p class="body-s commit-hint">The quantity is back to 1 and the route is still filled in, because the next group boards at the same stop.</p>'
        : '') +
      handoff('Trip tickets, where it sits in the ledger, and the trip total on Trip and Home'));
  }


  function backSheetHTML(c) {
    return sheet('back', 'Back to Trip tickets', 'The ledger for trip #' + c.t.number,
      detailRow('Trip', c.t.origin + ' → ' + c.t.destination) +
      detailRow('Tickets on this trip', plural(c.log.length, 'ticket', 'tickets') + ' · ' + pesos(c.logTotal)) +
      detailRow('Road', c.road === 'sctex' ? 'SCTEX' : 'Ordinary') +
      handoff('Trip tickets, the ledger this screen writes into'));
  }

  function renderOverlay() {
    const root = $('overlayRoot');
    if (!state.sheet) { root.innerHTML = ''; return; }
    const c = compute();
    root.innerHTML = state.sheet === 'board' ? stopSheetHTML(c, 'board')
      : state.sheet === 'drop' ? stopSheetHTML(c, 'drop')
      : state.sheet === 'rules' ? rulesSheetHTML(c)
      : (state.sheet === 'recorded' || state.sheet === 'ticket') && state.ticket
        ? ticketSheetHTML(c, state.ticket, state.sheet === 'recorded')
      : backSheetHTML(c);
  }


  function syncProto() {
    Array.prototype.forEach.call($('protoSeg').querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.state === state.preview ? 'true' : 'false');
    });
  }

  function setPreview(name) {
    state.preview = name;
    state.sheet = null;
    state.ticket = null;
    state.lastFocus = null;
    /* Every state starts from the same filled-in route, so the five previews
       differ in what they are about rather than in how much has been typed. The
       ledger is reseeded with them: switching to Error and back must not look
       like the conductor recorded a ticket while the screen was broken. */
    state.board = 'santa-cruz';
    state.drop = 'caloocan';
    state.road = 'sctex';
    state.pt = 'REGULAR';
    state.qty = 1;
    state.log = seedLog();
    state.fares = name === 'nofares' ? null : FARE_CONFIG;
    syncProto();
    render();
  }


  /* ── events ────────────────────────────────────────────────────────── */
  document.addEventListener('click', function (e) {
    const proto = e.target.closest('#protoSeg button');
    if (proto) { setPreview(proto.dataset.state); return; }
    if (e.target.hasAttribute && e.target.hasAttribute('data-scrim')) { closeOverlay(); return; }

    const act = e.target.closest('[data-act]');
    if (act) {
      const a = act.dataset.act;
      if (a === 'close') { closeOverlay(); return; }
      if (a === 'back') { openSheet('back'); return; }
      if (a === 'pick-board') { openSheet('board'); return; }
      if (a === 'pick-drop') { openSheet('drop'); return; }
      if (a === 'rules') { openSheet('rules'); return; }
      if (a === 'retry') { setPreview('ready'); return; }
      if (a === 'qty-up') { if (state.qty < QTY_MAX) { state.qty += 1; render(); } return; }
      if (a === 'qty-down') { if (state.qty > QTY_MIN) { state.qty -= 1; render(); } return; }
      if (a === 'record') { state.ticket = recordTicket(compute()); render(); openSheet('recorded'); return; }
      if (a === 'again') { closeOverlay(); return; }
      return;
    }

    /* A ledger row opens the same detail the confirmation used, so a fare can be
       read back the same way whether it was recorded a second ago or an hour
       ago. */
    const row = e.target.closest('[data-ticket]');
    if (row) { state.ticket = findTicket(Number(row.dataset.ticket)); if (state.ticket) openSheet('ticket'); return; }


    const road = e.target.closest('[data-road]');
    if (road) { state.road = road.dataset.road; render(); return; }

    const pt = e.target.closest('[data-pt]');
    if (pt) { state.pt = pt.dataset.pt; render(); return; }

    const stop = e.target.closest('[data-stop]');
    if (stop && !stop.disabled) {
      if (state.sheet === 'board') state.board = stop.dataset.stop;
      else state.drop = stop.dataset.stop;
      state.sheet = null;
      state.lastFocus = null;
      render();
      return;
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.sheet) closeOverlay();
  });

  /* ── boot ──────────────────────────────────────────────────────────── */
  buildControls();
  syncProto();
  render();
  })();
  </script>
</body>
</html>

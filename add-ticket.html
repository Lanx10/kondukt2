<!doctype html>
<!--
  Kondukt · Add Ticket screen — Open Design prototype.
  Same shell, tokens and glass layer as index.html (History), dashboard.html,
  home.html, trip.html, trip-tickets.html and passenger.html, so all seven
  screens read as one product. The app lives in the APP CONTENT slot; content
  honours the top and bottom safe areas.

  The screen src/screens/AddTicketScreen.tsx does not have yet. What it has to
  solve, and what it does about each:
    1. There is no fare calculator anywhere in the app. fareStore.ts creates the
       table and reads it back; insertTicket is HANDED farePerPassenger as an
       input (tripTicketsStore.ts:753-759) and never derives it. A conductor
       therefore cannot price a boarding at all. The fare card is the centre of
       this screen because it IS the calculator, written to the four column
       names in the table.
    2. A fresh install has no fares. fareStore.ts writes no defaults and
       FareSettingsScreen’s EMPTY_VALUES leaves all ten fields blank, so the
       common case is an unpriceable ticket. "No fare rules" is one of the five
       states and it refuses to commit rather than storing a wrong number.
    3. insertTicket validates the route and refuses four specific cases. A
       prototype that skipped them would let the driver compose a ticket the
       store then throws away, so the same four sentences are used verbatim
       (:798-815) and the commit button states its reason while disabled.
    4. usesSctex is a column on the TRIP row and it prices every ticket on the
       trip. The road is shown as the trip’s setting, not as a per-ticket field
       the ticket table has nowhere to store.
    5. The fare was going to be a fifth input. It is not: it is a derived
       answer, and making it editable would invite a driver to type a price
        the rules then contradict. Every step is printed — distance,
        billable distance, rate, per passenger, total — and the toll-road
        adjustment that sits between the first two is stated in the rules
        sheet rather than on the card, so a peso in dispute can still be
        traced to the rule that produced it.
     6. THE SCREEN DOES NOT EXIT after a fare. The trip is still running and the
       next rider is at the door, so recording commits the ticket, confirms it in
       a sheet, and hands the conductor straight back to the same filled form.
       That makes the log of what has ALREADY been saved part of this screen
       instead of something only Trip tickets holds: RECENT TICKETS sits at the
       bottom, newest first, capped at RECENT_LIMIT = 6, with the trip's saved
       total in the section head. It is the receipt for the press that just
       happened — without it a conductor cannot see a fare land short of leaving
       the screen, which is the one thing a screen that never exits must answer.
       What carries over and what resets is a decision, not an omission: the
       boarding point, destination, road and fare type are KEPT, because the
       next rider usually boards at the same stop on the same bus, and the
       quantity resets to 1, because a group of twenty is one boarding and
       leaving that number standing would charge it a second time.

  Section order is decision order: boarding point, destination, road, passenger
  and count, then the money, then the one commit, then what has already been
  saved. The fare card above carries the ticket being composed; the list below
  carries the tickets already committed, and the two are never the same number.

  Prototype states: Ready · No active trip · Loading · No fare rules · Error.
  All five start from the same filled route, so they differ in what they are
  about rather than in how much has been typed.
-->

  <style>
    @layer od-layout {

      :where(.od-stack,.od-row,.od-cluster,.od-grid,.od-stat) > :where(*) { min-width: 0; }

    :root {
      /* ── kondukt M3 warm palette (src/theme.ts) ───────────────────────── */
      --primary:#E65100; --on-primary:#FFFFFF; --primary-container:#FFE6D2; --on-primary-container:#4E2200;
      --primary-solid:#C2410C; --primary-solid-hover:#A93A09;
      --secondary:#FFB300; --on-secondary:#3D2E00; --secondary-container:#FFEFC7; --on-secondary-container:#4A3600;
      --secondary-fg:#8A6100;
      /* Foregrounds for the solid-amber card, measured against #FFB300:
         7.4:1 / 5.8:1 / 4.9:1. These were raw hex before; tokens keep the two

      --on-secondary-detail:#4F3D2B; --on-secondary-muted:#5B4720; --on-secondary-faint:#6B5518;
      --tertiary:#546E7A; --on-tertiary:#FFFFFF; --tertiary-container:#DDE6EA; --on-tertiary-container:#162B33;
      --error:#BA1A1A; --on-error:#FFFFFF; --error-container:#FFDAD6; --on-error-container:#410002;
      --background:#FDF7F3; --surface:#FDF7F3; --surface-lowest:#FFFFFF; --surface-low:#F7EFE9;
      --surface-container:#F2E9E2; --surface-high:#ECE3DC;
      --on-surface:#221A15; --on-surface-variant:#53433B; --outline:#85736B; --outline-variant:#D7C2B7;
      --scrim:rgba(34,26,21,.32);

      /* glass layer */
      --glass-tint:rgba(255,255,255,.58);
      --glass-rim:rgba(255,255,255,.85);
      --glass-on:#1A2029; --glass-on-variant:#4A5568;
      --glass-accent-primary:#8F3A00; --glass-accent-secondary:#6B4B00; --glass-accent-tertiary:#334A56;
      --glass-shadow:rgba(90,106,130,.16);

      --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px; --radius-glass:28px; --radius-full:999px;
      --font: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      /* shell vars (from the neutral OD handset) */
      --phone-screen-width:390px; --phone-screen-height:844px; --phone-bezel:10px;
      --phone-outer-radius:52px; --phone-screen-radius:42px;
      --phone-safe-top:50px; --phone-safe-bottom:29px;
      --phone-system-fg:#17181a; --phone-screen-bg:#f8f8f9; --phone-stage-bg:#eaebee;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh; display: grid; place-items: center; padding: 32px;
      background: radial-gradient(circle at 50% 15%, rgba(255,255,255,.94), transparent 35%), var(--phone-stage-bg);
      color: #191a1d; font-family: var(--font);
    }

    /* ── handset shell ─────────────────────────────────────────────────── */
    .phone-frame {
      position: relative;
      width: calc(var(--phone-screen-width) + var(--phone-bezel) * 2);
      height: calc(var(--phone-screen-height) + var(--phone-bezel) * 2);
      padding: var(--phone-bezel); border-radius: var(--phone-outer-radius);
      background: linear-gradient(145deg, rgba(255,255,255,.2), transparent 17%), linear-gradient(160deg, #3f4146 0%, #202227 48%, #0b0c0f 100%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.13), inset 0 0 0 2px rgba(0,0,0,.85), 0 32px 68px -20px rgba(10,12,16,.52), 0 10px 24px -10px rgba(10,12,16,.32);
      isolation: isolate;
    }
    .phone-frame::before, .phone-frame::after {
      content: ""; position: absolute; z-index: -1; top: 96px; bottom: 96px; width: 2px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,.13) 16%, transparent 30%, transparent 72%, rgba(255,255,255,.07) 88%, transparent);
    }
    .phone-frame::before { left: 0; } .phone-frame::after { right: 0; }
    .hardware-button { position: absolute; width: 4px; border-radius: 3px; background: linear-gradient(90deg,#08090b,#2a2d33 60%,#08090b); box-shadow: inset 0 1px rgba(255,255,255,.08); }
    .hardware-button.volume { left: -3px; top: 222px; height: 86px; }
    .hardware-button.power { right: -3px; top: 270px; height: 82px; }

    .phone-screen {
      position: relative; width: var(--phone-screen-width); height: var(--phone-screen-height);
      overflow: hidden; border-radius: var(--phone-screen-radius); background: var(--phone-screen-bg);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
    }
    .phone-content { position: absolute; inset: 0; overflow: hidden; padding: 0; background: transparent; }

    .status-bar { position: absolute; z-index: 40; inset: 0 0 auto; height: var(--phone-safe-top); display: grid; grid-template-columns: minmax(0,1fr) 56px minmax(0,1fr); align-items: start; padding: 14px 20px 0; color: var(--phone-system-fg); opacity: .8; pointer-events: none; }
    .status-time { justify-self: start; display: flex; align-items: center; height: 15px; font-size: 14px; font-weight: 560; line-height: 1; letter-spacing: .01em; font-family: system-ui, sans-serif; }
    .status-cutout-zone { width: 56px; }
    .status-icons { justify-self: end; display: inline-flex; align-items: center; height: 15px; gap: 6px; }
    .status-icons svg { display: block; flex: none; fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
    .status-icons .connectivity { width: 15px; height: 12px; } .status-icons .wifi { width: 15px; height: 12px; } .status-icons .battery { width: 19px; height: 11px; }
    .camera-dot { position: absolute; z-index: 45; top: 13px; left: 50%; width: 10px; height: 10px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle at 38% 35%, #344154 0 12%, #0a0c10 34%, #000 76%); box-shadow: 0 0 0 1px rgba(255,255,255,.06); pointer-events: none; }
    .gesture-indicator { position: absolute; z-index: 45; left: 50%; bottom: 8px; width: 96px; height: 4px; transform: translateX(-50%); border-radius: 99px; background: var(--phone-system-fg); opacity: .86; pointer-events: none; }

    /* ── app root ──────────────────────────────────────────────────────── */
    #app {
      position: relative; height: 100%; display: flex; flex-direction: column;
      color: var(--glass-on);
      background:
        radial-gradient(125% 82% at 6% -4%, #FBC9A8 0%, rgba(246,227,212,.78) 32%, rgba(244,247,251,0) 63%),
        radial-gradient(130% 88% at 104% 104%, #C6D9E8 0%, rgba(228,233,242,.72) 34%, rgba(244,247,251,0) 66%),
        #F4F7FB;
    }
    .app-scroll {
      flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
      padding-bottom: var(--phone-safe-bottom);
    }
    .app-scroll::-webkit-scrollbar { display: none; }

    .readable { width: 100%; max-width: 720px; margin-inline: auto; padding-inline: 20px; }
    .pad-x { padding-inline: 20px; }

    /* ── typography roles ──────────────────────────────────────────────── */
    .display-s { font-weight: 700; font-size: 28px; line-height: 36px; letter-spacing: -.3px; }
    .headline-s { font-weight: 600; font-size: 20px; line-height: 27px; letter-spacing: -.3px; }
    .title-m { font-weight: 600; font-size: 16px; line-height: 23px; }
    .body-m { font-weight: 400; font-size: 14px; line-height: 21px; }
    .body-s { font-weight: 400; font-size: 12px; line-height: 18px; }
    .label-l { font-weight: 600; font-size: 15px; line-height: 20px; }
    .label-s { font-weight: 600; font-size: 11px; line-height: 16px; letter-spacing: .6px; }
    .tabular { font-variant-numeric: tabular-nums; }
    .muted { color: var(--glass-on-variant); }
    .strong { color: var(--glass-on); }
    p { margin: 0; }

    /* ── glass surface ─────────────────────────────────────────────────── */
    .glass {
      position: relative; border-radius: var(--radius-glass);
      background: var(--glass-tint);
      box-shadow: 0 8px 15px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.55);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      backdrop-filter: blur(18px) saturate(180%);
    }
    .glass > * { position: relative; z-index: 1; }
    .glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: rgba(120,130,150,.5); opacity: .035; pointer-events: none; }
    .glass::after  { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 1px solid var(--glass-rim); pointer-events: none; z-index: 2; }

    /* ── chrome (SectionChrome) ────────────────────────────────────────── */
    .chrome { display: flex; align-items: center; gap: 12px; flex: none; padding: calc(var(--phone-safe-top) + 12px) 20px 12px; }
    .back {
      width: 44px; height: 44px; border-radius: var(--radius-full); border: 0; background: var(--primary-solid);
      display: grid; place-items: center; cursor: pointer; flex: none;
      box-shadow: 0 8px 15px var(--glass-shadow);
    }
    .title-card {
      flex: 1 1 auto; min-width: 0; min-height: 44px; padding: 5px 16px; border-radius: var(--radius-full);
      background: var(--primary-solid); display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
      box-shadow: 0 8px 15px var(--glass-shadow);
    }
    .chrome-title { color: var(--on-primary); margin: 0; }
    .chrome-sub { color: var(--on-primary); margin: 1px 0 0; }

    /* ── section header (SectionHeader) ────────────────────────────────── */
    .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 20px; margin-bottom: 12px; }
    .sec-title { color: var(--glass-on-variant); margin: 0; }
    .text-action { border: 0; background: none; padding: 0 4px; min-height: 48px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; color: var(--glass-accent-primary); font-family: inherit; flex: none; }
    .text-action .label-s { color: inherit; }
    /* Hover must not lighten the label — the only change is a rule under it,
       so the 6.9:1 default is also the hover contrast. */
    .text-action:hover { text-decoration: underline; text-underline-offset: 3px; }

    /* ── status card: the four-way state machine ───────────────────────── */
    .status-card { padding: 20px; }
    .status-card .st-eyebrow { color: var(--glass-on-variant); }
    .status-card .st-title { color: var(--glass-on); margin: 8px 0 0; }
    .status-card .st-detail { color: var(--glass-on-variant); margin: 4px 0 0; }
    .status-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 12px; }
    /* Amber is reserved for the one thing a conductor registers without
       reading: a trip that is running right now. Dark-on-amber measures
       7.4:1 for the title and 5.8:1 for the detail line, where the pale
       containers would sit at ~1.5:1. */
    .amber-btn {
      min-height: 48px; padding: 0 20px; border: 0; border-radius: var(--radius-full);
      background: var(--secondary); color: var(--on-secondary); cursor: pointer; font-family: inherit;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .glass.status-solid { background: var(--secondary); }
    .glass.status-solid::before, .glass.status-solid::after { display: none; }
    .status-solid .st-eyebrow, .status-solid .st-title { color: var(--on-secondary); }
    .status-solid .st-detail { color: var(--on-secondary-detail); }
    .status-solid .st-pill { background: var(--on-secondary); }
    .status-solid .st-pill-text { color: var(--secondary); }
    .status-solid .st-dot { background: var(--secondary); }
    .st-head { display: flex; align-items: center; gap: 12px; }
    .st-icon { width: 48px; height: 48px; border-radius: var(--radius-md); display: grid; place-items: center; flex: none; }
    .status-solid .st-icon { background: var(--on-secondary); }
    .st-head-text { flex: 1 1 auto; min-width: 0; }
    /* The pill is a container, so the label is its on-color. Pairing it with
       --on-secondary-container on a --on-secondary-container fill made the
       text the same brown as its own background: 1.0:1, invisible. */
    .st-pill { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 10px; border-radius: var(--radius-full); background: var(--secondary-container); }
    .st-pill-text { color: var(--on-secondary-container); }
    .status-solid .st-pill-text { color: var(--secondary); }
    .st-dot { width: 6px; height: 6px; border-radius: 3px; background: var(--on-secondary-container); flex: none; }
    .st-route { margin: 8px 0 0; color: var(--glass-on); }
    .st-meta { margin: 12px 0 0; color: var(--glass-on-variant); font-variant-numeric: tabular-nums; }
    .data-chip { display: inline-flex; align-items: center; margin-top: 10px; padding: 3px 10px; border-radius: var(--radius-full); background: var(--tertiary-container); color: var(--on-tertiary-container); }

    /* ── period control (shared with History) ──────────────────────────── */
    .range-card { padding: 14px 14px 16px; }
    .range-top { display: flex; align-items: center; gap: 10px; }
    .segment { flex: 1 1 auto; min-width: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: var(--radius-full); background: rgba(255,255,255,.55); border: 1px solid var(--outline-variant); }
    .seg-btn { min-height: 44px; border: 0; border-radius: var(--radius-full); background: transparent; color: var(--glass-on-variant); cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; }
    .seg-btn[aria-checked="true"] { background: var(--primary-solid); color: var(--on-primary); }
    .seg-btn[aria-checked="true"] .label-l { font-weight: 700; }
    .cal-btn { width: 48px; min-height: 48px; border-radius: var(--radius-full); border: 1px solid var(--outline-variant); background: rgba(255,255,255,.55); color: var(--glass-accent-primary); cursor: pointer; flex: none; display: grid; place-items: center; }
    .cal-btn.on { background: var(--primary-solid); border: 2px solid var(--primary-solid); color: var(--on-primary); }
    .range-nav { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .nav-btn { width: 48px; height: 48px; border-radius: var(--radius-full); border: 1px solid var(--outline-variant); background: rgba(255,255,255,.55); color: var(--glass-on); cursor: pointer; flex: none; display: grid; place-items: center; }
    .nav-btn:disabled { opacity: .4; cursor: default; }
    .range-now { flex: 1 1 auto; min-width: 0; text-align: center; }
    .range-now-main { display: block; color: var(--glass-on); }
    .range-now-sub { display: block; color: var(--glass-on-variant); margin-top: 2px; }
    .range-caption { margin: 10px 0 0; display: flex; align-items: flex-start; gap: 8px; color: var(--glass-on-variant); }
    .range-caption .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); flex: none; margin-top: 7px; }

    /* ── summary disclosure ────────────────────────────────────────────── */
    .summary { padding: 18px 20px; }
    .summary-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .summary-eyebrow { color: var(--glass-on-variant); }
    .detail-btn { border: 0; background: none; cursor: pointer; min-height: 44px; padding: 0 2px; display: inline-flex; align-items: center; gap: 4px; color: var(--glass-accent-primary); font-family: inherit; flex: none; }
    .detail-btn svg { transition: transform .2s ease; }
    .summary.open .detail-btn svg { transform: rotate(180deg); }
    .hero { margin-top: 12px; }
    .hero-label { color: var(--glass-on-variant); }
    .hero-value { margin: 4px 0 0; color: var(--glass-on); }
    .hero-meta { margin: 8px 0 0; color: var(--glass-on-variant); display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .hero-meta b { color: var(--glass-on); font-weight: 600; }
    .summary-details { display: none; margin-top: 20px; }
    .summary.open .summary-details { display: block; }
    .summary-details .rule { height: 1px; background: var(--outline-variant); opacity: .7; margin: 18px 0; }
    .stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
    .stat-grid.stacked { grid-template-columns: minmax(0,1fr); }
    .stat-tile { padding: 16px; }
    .stat-icon { width: 40px; height: 40px; border-radius: var(--radius-md); display: grid; place-items: center; }
    .stat-label { margin: 12px 0 0; color: var(--glass-on-variant); }
    .stat-value { margin: 4px 0 0; color: var(--glass-on); }
    .breakdown { margin-top: 14px; display: grid; gap: 12px; }
    .bd-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; align-items: baseline; }
    .bd-name { color: var(--glass-on); }
    .bd-count { color: var(--glass-on); font-weight: 600; }
    .bd-track { grid-column: 1 / -1; height: 8px; border-radius: var(--radius-full); background: var(--surface-container); overflow: hidden; }
    .bd-fill { height: 100%; border-radius: inherit; background: var(--primary-solid); }

    /* ── rows ──────────────────────────────────────────────────────────── */
    .list { display: grid; gap: 12px; }
    .row-card { padding: 20px; }
    /* font-size: inherit is load-bearing here, and the four sibling screens are
       all missing it. A button inherits the UA's 13.333px control size, so a
       ledger row that is a <button> painted its bare .cat at 13.33px while the
       very same row as a locked <div> painted it at 16px — one ledger, two
       sizes, switching with the recording gate. */
    .row-btn { border: 0; margin: 0; width: 100%; text-align: left; font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; border-radius: var(--radius-glass); display: block; }
    .row-btn:active { transform: scale(.995); }
    /* flex-start, not center: the route column is 199px and the longest pair
       ("Baclaran \u2192 Monumento") is 197px in Poppins 600/16, so a wider build
       of Poppins still adds a line. Centring would then float the 40px icon and
       the money block in the middle of a 106px card. Top-aligned, the icon and
       the peso sit on the route's cap line whether the row is one line or two.
       Gap is 8, not 12: measured, the 12px gap left the route 6px short of its
       longest pair. ponytail: 2px of slack - shorten station names (or drop the
       spaces around the arrow) if the font is ever swapped. */
    .trip-head { display: flex; align-items: flex-start; gap: 8px; }
    .trip-icon { width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--tertiary-container); display: grid; place-items: center; flex: none; }
    .trip-body { flex: 1 1 auto; min-width: 0; }
    .trip-route { display: block; color: var(--glass-on); }
    .trip-sub { display: block; margin: 4px 0 0; color: var(--glass-on-variant); }
    .status { padding: 3px 10px; border-radius: var(--radius-full); flex: none; }
    .status.active { background: var(--secondary-container); color: var(--on-secondary-container); }
    .status.done { background: var(--tertiary-container); color: var(--on-tertiary-container); }
    /* Structural dividers use --outline, not --outline-variant: the variant
       sits at 1.7:1 on this field and the 6-row list loses its structure. */
    .meta-line { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--outline); display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--glass-on-variant); }
    .fare { display: inline-flex; align-items: baseline; gap: 6px; color: var(--glass-on); white-space: nowrap; }
    .meta-line .fare { margin-left: auto; }
    .fare b { font-weight: 700; }
    .ticket-row { display: flex; align-items: flex-start; gap: 12px; }
    .ticket-id { min-width: 62px; flex: none; }
    .ticket-id .when { display: block; color: var(--glass-on-variant); }
    .ticket-mid { flex: 1 1 auto; min-width: 0; }
    .ticket-route { color: var(--glass-on); }
    .ticket-meta { margin: 4px 0 0; color: var(--glass-on-variant); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
    .cat { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: var(--radius-full); }
    .cat.regular { background: var(--primary-container); color: var(--on-primary-container); }
    .cat.student, .cat.senior, .cat.pwd { background: var(--tertiary-container); color: var(--on-tertiary-container); }
    .ticket-fare { text-align: right; color: var(--glass-on); flex: none; }
    .ticket-fare .each { display: block; color: var(--glass-on-variant); }
    .ticket-fare b { font-weight: 700; }
    .rows-stacked .ticket-row { flex-wrap: wrap; }
    .rows-stacked .ticket-fare { text-align: left; width: 100%; }
    .rows-stacked .ticket-fare .each { display: inline; margin-left: 6px; }
    .rows-stacked .meta-line { flex-direction: column; align-items: flex-start; }
    .rows-stacked .meta-line .fare { margin-left: 0; }

    /* ── inline empty + storage ────────────────────────────────────────── */
    .inline-empty { padding: 16px 18px; border-radius: var(--radius-xl); }
    .inline-empty p { color: var(--glass-on-variant); }
    .storage { margin-top: 20px; padding: 12px 20px; display: flex; align-items: center; gap: 8px; }
    .storage p { color: var(--glass-on-variant); }

    /* ── states ────────────────────────────────────────────────────────── */
    .state { padding: 20px; border-radius: var(--radius-xl); }
    .state.error { border-color: var(--error); background: var(--error-container); }
    .state h3 { margin: 0; color: var(--glass-on); }
    .state p { margin: 8px 0 0; color: var(--glass-on-variant); }
    .state.error p { color: var(--on-error-container); }
    .primary-btn { margin-top: 14px; min-height: 48px; padding: 0 20px; border-radius: var(--radius-lg); border: 0; background: var(--primary-solid); color: var(--on-primary); cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 8px; }
    .primary-btn:hover { background: var(--primary-solid-hover); }
    .skeleton { padding: 16px; }
    .sk { border-radius: 8px; background: linear-gradient(90deg, rgba(0,0,0,.05) 25%, rgba(0,0,0,.09) 37%, rgba(0,0,0,.05) 63%); background-size: 400% 100%; animation: shim 1.4s ease infinite; }
    @keyframes shim { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
    @media (prefers-reduced-motion: reduce) { .sk { animation: none; } .detail-btn svg { transition: none; } }

    /* ── overlays (calendar modal / detail sheet) ──────────────────────── */
    .overlay-root { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
    /* grid-template-rows: minmax(0, 1fr) is load-bearing, not tidiness. With an
       auto row the grid area is indefinite in the block axis, so the sheet's
       max-height: 100% resolved against nothing and computed to none: the trip
       picker measured 924px and the all-groups sheet 1223px inside an 844px
       phone, hanging 80px and 379px past the bottom edge with their last rows
       unreachable — .sheet-body never scrolled because it was never given a
       height to scroll inside. A definite 1fr row fixes the percentage, and the
       two rules below fix the flex side of the same bug. */
    .scrim { position: absolute; inset: 0; background: var(--scrim); display: grid; grid-template-rows: minmax(0, 1fr); pointer-events: auto; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
    .scrim.center { place-items: center; padding: 16px; }
    /* A tall bottom sheet aligns to the grid's 1fr row, whose top is the screen
       top, so the sheet head would land under the clock and notch. The safe
       inset is honoured by .chrome, not here, so re-apply it as padding. */
    .scrim.bottom { align-items: end; padding-top: var(--phone-safe-top); }
    /* Every popup on this screen is opaque white. A sheet always sits on the
       scrim, so a translucent tint over a dark backdrop only muddies it, and
       the board picker, the destination picker, the fare rules, the ticket
       receipt and the back confirmation all read as one raised white panel.
       The white fill is also the surface these sheets had before the form cards
       went glass, so every ink measured against it is unchanged. */
    .sheet { width: 100%; max-width: 360px; margin: 0 auto; background: var(--surface-lowest); border-radius: var(--radius-xl); pointer-events: auto; max-height: 100%; display: flex; flex-direction: column; }
    .sheet.bottom-sheet { border-radius: var(--radius-xl) var(--radius-xl) 0 0; max-width: 720px; animation: slideUp .22s ease; }
    @keyframes slideUp { from { transform: translateY(14px); opacity: .6; } to { transform: none; opacity: 1; } }
    /* flex: none so the title can never be squeezed, and min-height: 0 on the
       body so it can — a flex item defaults to min-height: auto, which pins it
       to its content height and makes the sheet overflow instead of scrolling. */
    .sheet-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px 8px; flex: none; }
    .sheet-titles { flex: 1 1 auto; min-width: 0; }
    .sheet-head h2 { margin: 0; color: var(--on-surface); }
    .sheet-titles p { margin: 2px 0 0; }
    .sheet-body { padding: 0 20px var(--phone-safe-bottom); overflow-y: auto; min-height: 0; }
    .icon-btn { width: 44px; height: 44px; border-radius: var(--radius-full); border: 1px solid var(--outline-variant); background: transparent; color: var(--on-surface-variant); display: grid; place-items: center; cursor: pointer; flex: none; }
    .icon-btn:hover { background: var(--surface-container); }
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
    .cal-month { color: var(--on-surface); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 8px; }
    .cal-dow { text-align: center; color: var(--on-surface-variant); padding: 6px 0; }
    .cal-cell { position: relative; height: 44px; border: 0; background: none; cursor: pointer; border-radius: var(--radius-md); color: var(--on-surface); font-family: inherit; }
    .cal-cell.out { color: var(--outline); }
    .cal-cell.inrange { background: var(--primary-container); border-radius: 0; }
    .cal-cell.edge { background: var(--primary-solid); color: var(--on-primary); border-radius: var(--radius-md); font-weight: 600; }
    .cal-cell.today::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 4px; height: 4px; transform: translateX(-50%); border-radius: 50%; background: var(--primary); }
    .cal-cell.edge.today::after { background: var(--on-primary); }
    .cal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 16px; }
    .cal-actions .ghost { min-height: 48px; padding: 0 12px; border: 0; background: none; color: var(--on-surface-variant); cursor: pointer; font-family: inherit; }
    .cal-actions .apply { min-height: 48px; padding: 0 20px; border-radius: var(--radius-lg); border: 0; background: var(--primary-solid); color: var(--on-primary); cursor: pointer; font-family: inherit; }
    .cal-error { margin: 10px 0 0; color: var(--error); }
    .range-preview { margin: 12px 0 0; color: var(--on-surface-variant); }
    .detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--outline); }
    .detail-row:last-child { border-bottom: 0; }
    .detail-row .k { color: var(--on-surface-variant); flex: none; }
    .detail-row .v { color: var(--on-surface); font-weight: 600; text-align: right; }
    /* The card insets its own rows so every key in the sheet starts at the
       same 20px column as the title, instead of drifting in by 14px. */
    .detail-card { border: 1px solid var(--outline-variant); border-radius: var(--radius-lg); margin-top: 12px; }
    .detail-card .detail-row { padding-inline: 12px; }

    /* ── add ticket: one boarding, priced ──────────────────────────────── */
    /* Author display rules beat the UA [hidden] rule on cascade origin, so a
       hidden attribute on any of the flex/grid elements here would not hide it.
       One guard covers the five sections this screen toggles. */
    [hidden] { display: none !important; }
    /* The chrome carries the live total, and that string grows with the peso
       amount (₱195.08 -> ₱3,901.60). Never let it wrap to a second line inside
       the pill and push the title card taller than its neighbours. */
    .chrome-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Four inputs in the order the conductor actually decides them — where the
       passenger gets on, where they get off, which road, who is riding — and
       then the money, as the answer rather than as a fourth input. The fare is
       a filled card at the bottom because it is derived from all four: showing
       it as a field would invite the driver to type a price the system then
       contradicts. */
    .card { margin-top: 20px; padding: 20px; border: 1px solid var(--outline-variant); border-radius: var(--radius-xl); }
    /* Every white card on this screen takes the glass layer instead of a flat
       white fill — the same tint, rim, blur and shadow .glass carries, so the
       form cards, the state cards and the empty state read as one surface
       family over the peach gradient. The fill moves .55 → .58, so no text pair
       changes enough to re-measure. .state.error keeps its own fill and border
       colour on top of this. The sheets are deliberately NOT in this group:
       they are opaque white, on their own rule at .sheet. */
    .card, .state, .inline-empty {
      background: var(--glass-tint); border: 1px solid var(--glass-rim);
      box-shadow: 0 8px 15px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.55);
      -webkit-backdrop-filter: blur(18px) saturate(180%); backdrop-filter: blur(18px) saturate(180%);
    }
    /* A .sec-head is a sibling margin, but the card already has 20px of padding,
       so margin collapse cannot reach it: left alone it lands its title 40px
       down and the three groups' first lines stop sharing a column. The route
       group has no header, so the fields at 20px are the reference. */
    .card > .sec-head:first-child { margin-top: 0; }
    .field { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 8px 14px; border: 1px solid var(--outline); border-radius: var(--radius-lg); background: var(--surface); color: var(--on-surface); font-family: inherit; font-size: inherit; text-align: left; cursor: pointer; }
    .field:hover { background: var(--surface-container); }
    .field + .field { margin-top: 8px; }
    .f-icon { width: 36px; height: 36px; border-radius: var(--radius-sm); display: grid; place-items: center; flex: none; background: var(--tertiary-container); color: var(--on-tertiary-container); }
    .f-body { flex: 1 1 auto; min-width: 0; }
    .f-label { display: block; color: var(--on-surface-variant); }
    .f-value { display: block; color: var(--on-surface); font-weight: 600; }
    /* --outline is a 1px border token, specified for the 3:1 non-text floor. On
       16px text it measured 4.24:1 against the field's own surface, under AA, on
       the one line that tells a first-time driver what this control wants. The
       placeholder still reads as a placeholder on weight alone (500 vs 600). */
    .f-value.empty { color: var(--on-surface-variant); font-weight: 500; }
    .f-chev { flex: none; color: var(--on-surface-variant); display: inline-flex; }
    /* The road between the two fields. Not a left accent bar — it is a rule with
       a label on it, and the distance is the only thing on this screen that can
       make the ticket wrong, so it sits on the axis joining the two ends. */
    .leg { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; color: var(--on-surface-variant); }
    .leg .leg-line { flex: 1 1 auto; height: 1px; background: var(--outline); }
    .leg .leg-dist { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .leg-hint { margin: 8px 0 0; color: var(--error); }

    /* Route type: two roads, so a two-way switch and not a chip row. A chip
       implies filtering a set; this is one choice between two exclusive
       options, and the second bills materially more per km. */
    .seg-route { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
    /* min-height 52 was a fiction: a title-m name over a body-s note is 42px of
       content, so the box lands at 61 and the declaration describes nothing. The
       only real floor is the tap target, and the two rows are stretched to one
       height by the grid anyway. */
    .seg-route button { min-height: 44px; padding: 8px 10px; border: 1px solid var(--outline); border-radius: var(--radius-lg); background: var(--surface); color: var(--on-surface); font-family: inherit; font-size: inherit; text-align: left; cursor: pointer; }
    .seg-route button:hover { background: var(--surface-container); }
    .seg-route button[aria-pressed="true"] { border: 2px solid var(--primary-solid); background: var(--primary-solid); color: var(--on-primary); padding: 7px 9px; }
    .seg-route .sr-name { display: block; font-weight: 600; }
    .seg-route .sr-note { display: block; margin-top: 2px; color: var(--on-surface-variant); }
    .seg-route button[aria-pressed="true"] .sr-note { color: var(--on-primary); }


    /* Passenger: the app's own vocabulary, one row, 44px — the same recipe as
       the Passenger screen's filter chips, so the two screens teach one chip. */
    .pt-row { display: flex; flex-wrap: wrap; gap: 8px; }
    /* font-size: inherit is the same load-bearing line it is on .row-btn: a
       <button> inherits the UA's 13.333px control size, so the shared .chip —
       which sets font-family but not font-size — would have painted these four
       labels two steps under the title-m they sit beside. */
    .pt-row .chip { font-size: inherit; }

    /* Copied from trip-tickets.html rather than re-derived: the quantity stepper
       is the one control two screens already share. */
    .fare-qty { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
    .fare-qty button { width: 48px; height: 48px; padding: 0; border-radius: var(--radius-full); border: 1px solid var(--primary-solid); background: var(--primary-solid); color: var(--on-primary); font: inherit; font-size: 20px; line-height: 1; cursor: pointer; flex: none; }
    .fare-qty button:not(:disabled):hover,
    .fare-qty button:not(:disabled):active { background: var(--primary-solid-hover); border-color: var(--primary-solid-hover); color: var(--on-primary); }
    /* The glyph and its fill composite together under opacity, so the old .55
       that held 3.77:1 against a pale --surface fill only reaches 2.41:1 once
       the fill is the brand orange. .8 is the floor that clears 3:1 on the
       brightest card this can sit on (3.73:1), and the fill still lifts off the
       enabled orange enough to read disabled without turning grey. Hover and
       press are scoped :not(:disabled) so a disabled stepper keeps this fill. */
    .fare-qty button:disabled { opacity: .8; cursor: default; }
    .fare-qty .fq-value { flex: 1 1 auto; text-align: center; color: var(--on-surface); }

    /* ── shared with passenger.html, kept because this screen uses them ── */
    /* Copied rather than renamed so a chip, a picker row and a handoff are the
       same 44px object on all seven screens. */
    .chip { min-height: 44px; min-width: 44px; padding: 0 10px; border-radius: var(--radius-full); border: 1px solid var(--outline); background: transparent; color: var(--glass-on-variant); cursor: pointer; font-family: inherit; }
    .chip:hover { background: rgba(120,130,150,.1); }
    /* 2px on the selected border and 1px less padding, so the chip does not
       grow by two when it is chosen. */
    .chip[aria-pressed="true"] { border: 2px solid var(--primary-solid); background: var(--primary-solid); color: var(--on-primary); padding: 0 9px; }
    .pick-row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 12px; border: 1px solid var(--outline); border-radius: var(--radius-lg); background: var(--surface); color: var(--on-surface); font-family: inherit; text-align: left; cursor: pointer; margin-top: 8px; width: 100%; }
    .pick-row:hover { background: var(--surface-container); }
    /* 2px border on the current terminal and 1px less padding, so choosing a row
       does not resize the list under the finger. */
    .pick-row[aria-current="true"] { border: 2px solid var(--primary-solid); background: var(--primary-solid); color: var(--on-primary); padding: 7px 11px; }
    .pick-row .pk-body { flex: 1 1 auto; min-width: 0; }
    .pick-row .pk-name { display: block; }
    .pick-row .pk-sub { display: block; margin-top: 2px; color: var(--on-surface-variant); }
    .pick-row[aria-current="true"] .pk-sub { color: var(--on-primary); }

    /* ── clicked = solid ─────────────────────────────────────────────────
       A chosen or held control inverts to the solid brand fill instead of the
       pale --primary-container tint, so one orange means one thing on this
       screen: primary CTA, selected option, held option. White on
       --primary-solid measures 5.18:1, so the note and sub lines stay full
       white and take their hierarchy from size and weight — anything under
       .91 alpha on this fill falls under 4.5:1, which is why the old .85
       sub-line opacity is gone rather than carried over. Selected darkens one
       step on hover/press, the same --primary-solid-hover move .primary-btn
       already makes, so the fill never sits dead under the cursor. */
    .seg-route button[aria-pressed="true"]:hover,
    .seg-route button[aria-pressed="true"]:active,
    .chip[aria-pressed="true"]:hover,
    .chip[aria-pressed="true"]:active,
    .pick-row[aria-current="true"]:hover,
    .pick-row[aria-current="true"]:active,
    .cal-btn.on:hover,
    .cal-btn.on:active,
    .seg-btn[aria-checked="true"]:hover,
    .seg-btn[aria-checked="true"]:active { background: var(--primary-solid-hover); border-color: var(--primary-solid-hover); }

    .seg-route button:not([aria-pressed="true"]):active,
    .chip:not([aria-pressed="true"]):active,
    .pick-row:not([aria-current="true"]):active,
    .cal-btn:not(.on):active,
    .seg-btn:not([aria-checked="true"]):active,
    .icon-btn:active,
    .nav-btn:not(:disabled):active,
    .proto-states button:not([aria-pressed="true"]):active { background: var(--primary-solid); border-color: var(--primary-solid); color: var(--on-primary); }

    /* Controls that are solid already — back and the commit — take the hover
       step on press too, so touch gets the feedback desktop gets from hover. */
    .back:hover,
    .back:active,
    .primary-btn:active { background: var(--primary-solid-hover); }

    /* The two disclosure rows invert the same way, and their children have to
       come with them: .f-label, .f-value and .f-chev each carry their own
       colour, so a fill alone would leave 8.8:1 ink on a 5.2:1 fill — worse
       than not inverting at all. .f-icon flips to the inverse chip so the
       leading glyph keeps its own 5.18:1. */
    .field:active { background: var(--primary-solid); border-color: var(--primary-solid); color: var(--on-primary); }
    .field:active .f-label,
    .field:active .f-value,
    .field:active .f-value.empty,
    .field:active .f-chev { color: var(--on-primary); }
    .field:active .f-icon { background: var(--on-primary); color: var(--primary-solid); }

    .pick-more { margin: 12px 0 0; padding: 12px 16px; border: 1px dashed var(--outline); border-radius: var(--radius-lg); color: var(--on-surface-variant); }
    .handoff { margin: 16px 0 0; padding: 12px 20px; border: 1px dashed var(--outline); border-radius: var(--radius-lg); background: rgba(255,255,255,.42); }
    .handoff p { color: var(--on-surface-variant); }
    .handoff .nb-title { color: var(--on-surface); margin: 0 0 4px; }
    :focus-visible { outline: 2px solid var(--primary-solid); outline-offset: 2px; border-radius: 6px; }

    /* The fare card. Amber because the trip IS running — the same invariant as
       the Home hero, the Trip card, the Trip-tickets card and the Passenger
       card. It is the one place on this screen where the amber is load-bearing
       rather than decorative: the money is trustworthy BECAUSE a trip is live. */
    /* .card's 20px margin-top is what spaces the form groups; the fare card is
       the first thing in its own section and had none, so it landed hard against
       the passenger card. It is a card, so it carries the card's margin. */
    .fare-card { margin-top: 20px; padding: 20px; }
    .fare-card .fc-eyebrow { color: var(--glass-on-variant); }
    .fare-card .fc-sub { margin: 2px 0 0; color: var(--glass-on-variant); }
    .glass.fare-solid { background: var(--secondary); }
    .glass.fare-solid::before, .glass.fare-solid::after { display: none; }
    /* The same safety net the other amber cards carry: --glass-on-variant is
       4.19:1 on #FFB300, just under AA, so any text in here that forgets its
       override fails silently. This lands first; the named rules below win on
       specificity, and they sit after it on source order too. */
    .fare-solid, .fare-solid p, .fare-solid span, .fare-solid b { color: var(--on-secondary-muted); }
    .fare-solid .fc-eyebrow { color: var(--on-secondary); }
    .fare-solid .fc-route { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
    .fare-solid .fc-route .arrow { color: var(--on-secondary-faint); flex: none; display: inline-flex; }
    /* Without this the line keeps --glass-on-variant, a cool grey-blue, and sits
       on the amber at 4.19:1. Every other ink on the card is on the
       --on-secondary scale, so the sub line belongs there too. */
    .fare-solid .fc-sub { color: var(--on-secondary-muted); }
    .fare-solid .calc { display: grid; gap: 0; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(61,46,0,.7); }
    .fare-solid .calc-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 8px 0; }
    .fare-solid .calc-row .k { color: var(--on-secondary-detail); }
    .fare-solid .calc-row .v { color: var(--on-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
    /* The sum rule doubles as the "these are the inputs" divider, so the total
       cannot be misread as another line of the same calculation. */
    .fare-solid .calc-row.sum { border-top: 1px solid rgba(61,46,0,.7); margin-top: 8px; padding-top: 12px; }
    .fare-solid .calc-row.sum .k { color: var(--on-secondary); font-weight: 600; }
    .fare-solid .calc-row.sum .v { font-size: 28px; line-height: 36px; font-weight: 700; }
    .fare-solid .fc-note { margin: 12px 0 0; }
    .fare-solid .st-pill { background: var(--on-secondary-container); }
    .fare-solid .st-pill-text { color: var(--secondary); }
    /* The footnote link lives inside the amber card so the rules it names are one
       tap from the number they produced. It keeps the shared 48px target and
       takes its colour from the card, not from --glass-accent-primary, which
       would be the action orange on amber. */
    .fare-solid .text-action { margin-top: 12px; color: var(--on-secondary); }
    .fare-solid .text-action:hover { color: var(--on-secondary); }

    /* ── the one committing action ────────────────────────────────────── */
    /* Solid, and the only solid primary in the viewport. Amber on this screen
       means "a trip is running", so the commit stays --primary-solid (Home and
       Trip parity) or amber would carry two meanings at once. */
    .primary-btn.wide { width: 100%; justify-content: center; }
    .block-reason { margin-top: 20px; color: var(--on-surface-variant); }
    .commit-hint { margin: 12px 0 0; color: var(--on-surface-variant); }

    /* ── the ledger: what this screen has already committed ─────────────── */
    /* Item 6. A screen that does not exit has to show its own results, or a
       fare that lands wrong can only be found by leaving it. The rows reuse
       .ticket-row and its parts as Trip tickets writes them, so the ticket
       looks the same on both screens, and the id rides under the peso
       instead of spending a 62px column the route needs. One difference:
       align-items is flex-start here, not center, for the same reason .trip-head
       is — a two-line route would otherwise float the peso between its own
       lines. Top-aligned, the peso sits on the route's cap line either way.
       ponytail: exact parity with Trip tickets, where rows never wrap. */

    /* The route is measured, not assumed. The middle column is 247px and the
       longest pair in the seed, "Subic Bay Freeport → San Fernando", is 289px
       at 16/600 and still 252px at 14/600, so no size on the scale can hold it
       and an ellipsis would swallow the destination the conductor is checking.
       It wraps instead. Each stop name carries .nm so the name itself can
       never be cut: a destination split across two lines is not a destination
       anyone can check. The arrow sits at the end of the origin span, leaving
       exactly one legal break — the space before the destination — so the wrap
       always reads "Subic Bay Freeport →" / "San Fernando". A single name can
       only overflow this column if it is longer than 247px of 16/600 Poppins
       (the longest measured, "Subic Bay Freeport", is 152px), which no
       terminal name on file comes near. */
    .row-card:hover { background: rgba(120,130,150,.1); }
    .rec-cap { margin: 12px 0 0; color: var(--glass-on-variant); }
    .ticket-route .nm { white-space: nowrap; }

    /* prototype state control (outside the phone) */
    .proto-states { position: fixed; left: 18px; bottom: 18px; z-index: 50; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 16px; background: var(--surface-lowest); border: 1px solid #dcdde1; box-shadow: 0 10px 24px rgba(20,22,28,.12); font-family: var(--font); }
    .proto-states span { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #6b6e75; font-weight: 600; }
    .proto-states .seg { display: flex; flex-wrap: wrap; gap: 6px; max-width: 232px; }
    .proto-states button { font: inherit; font-size: 12px; padding: 7px 10px; border-radius: 999px; border: 1px solid #d4d5d9; background: #fff; color: #33363c; cursor: pointer; }
    .proto-states button:hover { background: #F1F2F4; }
    .proto-states button[aria-pressed="true"]:hover { background: #A93A09; border-color: #A93A09; }
    .proto-states button[aria-pressed="true"] { background: #C2410C; border-color: #C2410C; color: #fff; }

    @media (max-width: 480px) {
      body { padding: 0; display: block; }
      .phone-frame { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; }
      .phone-frame::before, .phone-frame::after, .hardware-button { display: none; }
      .phone-screen { width: 100%; height: 100%; border-radius: 0; }
      .proto-states { display: none; }
    }
    @media (max-height: 927px) { .phone-frame { zoom: .9; } }
    @media (max-height: 840px) { .phone-frame { zoom: .82; } }
    @media (max-height: 771px) { .phone-frame { zoom: .74; } }
    @media (max-height: 702px) { .phone-frame { zoom: .66; } }
  </style>
</head>
<body>
  <div class="phone-frame" data-phone-shell data-platform="neutral">
    <span class="hardware-button volume" aria-hidden="true"></span>
    <span class="hardware-button power" aria-hidden="true"></span>

    <section class="phone-screen" data-od-id="phone-screen" data-phone-screen>
      <main class="phone-content" data-phone-content>
        <!-- APP CONTENT START -->
        <div id="app">
          <!-- 0. Section chrome, as the other five section screens wear it. The
               subtitle names the trip this fare is being added to, because the
               ticket is stored against a trip id and nothing else. -->
          <header class="chrome readable" data-od-id="at-chrome">
            <button type="button" class="back" data-act="back" data-od-id="at-back" aria-label="Back to Trip tickets">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <div class="title-card">
              <h1 class="chrome-title title-m">Add ticket</h1>
              <p class="chrome-sub body-s" id="chromeSub">One boarding, priced</p>
            </div>
          </header>

          <div class="app-scroll" id="scroll">
            <div class="readable">
              <!-- 1. The fare rules. A fresh install has none, and the app has
                   no calculator at all, so without this screen a conductor
                   cannot price anything. The state is a branch, not a toast. -->
              <section data-od-id="at-rules" id="rulesSection" hidden>
                <div id="rulesSlot"></div>
              </section>

              <!-- 2. The four inputs, in decision order. Each is a control that
                   opens its own sheet, so no control on this screen is a
                   dead-end and none of them can be typed into wrongly. -->
              <section data-od-id="at-form" id="formSection" hidden>
                <div class="card" data-od-id="at-route-card">
                  <button type="button" class="field" data-act="pick-board" data-od-id="at-board" aria-describedby="legLine">
                    <span class="f-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10.5c0 5-8 11-8 11s-8-6-8-11a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10.2" r="2.6"/></svg></span>
                    <span class="f-body">
                      <span class="f-label label-s" id="boardLabel">BOARDING POINT</span>
                      <span class="f-value title-m" id="boardValue">Choose where they get on</span>
                    </span>
                    <span class="f-chev" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
                  </button>

                  <button type="button" class="field" data-act="pick-drop" data-od-id="at-drop">
                    <span class="f-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10.5c0 5-8 11-8 11s-8-6-8-11a8 8 0 1 1 16 0Z"/><path d="M14.4 10.2 12 12.6l-2.4-2.4"/></svg></span>
                    <span class="f-body">
                      <span class="f-label label-s" id="dropLabel">DESTINATION</span>
                      <span class="f-value title-m" id="dropValue">Choose where they get off</span>
                    </span>
                    <span class="f-chev" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
                  </button>

                  <p class="leg body-s" id="legLine">
                    <span class="leg-line" aria-hidden="true"></span>
                    <span class="leg-dist" id="legDist">Distance is not set until both ends are chosen</span>
                  </p>
                </div>
                <p class="leg-hint body-s" id="legWarn" hidden></p>

                <!-- 3. Which road. SCTEX is the expressway the app already
                     stores as usesSctex on the trip. -->
                <div class="card" data-od-id="at-road-card">
                  <div class="sec-head">
                    <h2 class="sec-title label-s">ROAD</h2>
                  </div>
                  <div class="seg-route" id="roadSeg" role="group" aria-label="Route type"></div>
                </div>

                <!-- 4. Who is riding. The four store values, then how many of
                     them share the fare. -->
                <div class="card" data-od-id="at-pax-card">
                  <div class="sec-head">
                    <h2 class="sec-title label-s">PASSENGER</h2>
                  </div>
                  <div class="pt-row" id="ptSeg" role="group" aria-label="Passenger type"></div>
                  <div class="fare-qty" data-od-id="at-qty">
                    <button type="button" id="qtyDown" data-act="qty-down" data-od-id="at-qty-down" aria-label="One passenger fewer">&minus;</button>
                    <span class="fq-value title-m" id="qtyValue" aria-live="polite" data-od-id="at-qty-value">1 passenger</span>
                    <button type="button" id="qtyUp" data-act="qty-up" data-od-id="at-qty-up" aria-label="One passenger more">+</button>
                  </div>
                </div>
              </section>

              <!-- 5. The money. Amber, and last, because it is the sum of the
                   four above and the conductor checks it before committing. -->
              <section data-od-id="at-fare" id="fareSection" hidden>
                <div id="fareSlot"></div>
              </section>

              <section data-od-id="at-commit" id="commitSection" hidden>
                <p class="body-s block-reason" id="blockReason" hidden></p>
                <button type="button" class="primary-btn wide" id="recordBtn" data-act="record" data-od-id="at-record">
                  <span id="recordLabel">Record ticket</span>
                </button>
                <p class="body-s commit-hint" id="commitHint" hidden></p>
              </section>

              <!-- 6. What has already been committed on this trip. Newest
                   first, so the row directly under the fare card is always the
                   ticket the conductor just recorded. -->
              <section data-od-id="at-recent" id="recentSection" hidden>
                <div class="sec-head">
                  <h2 class="sec-title label-s">RECENT TICKETS</h2>
                  <span class="label-s" id="recentTotal" data-od-id="at-recent-total"></span>
                </div>
                <div class="list" id="recentList" data-od-id="at-recent-list"></div>
                <p class="body-s rec-cap" id="recentCap" data-od-id="at-recent-cap" hidden></p>
              </section>

              <div class="glass storage" data-od-id="storage-footer">

                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--glass-on-variant)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="7.5" ry="3.2"/><path d="M4.5 6v12c0 1.8 3.4 3.2 7.5 3.2s7.5-1.4 7.5-3.2V6"/><path d="M4.5 12c0 1.8 3.4 3.2 7.5 3.2s7.5-1.4 7.5-3.2"/></svg>
                <p class="body-s" id="storageNote"></p>
              </div>
            </div>
          </div>

          <div class="overlay-root" id="overlayRoot"></div>
        </div>
        <!-- APP CONTENT END -->
      </main>

      <div class="status-bar" aria-hidden="true">
        <span class="status-time">9:41</span>
        <span class="status-cutout-zone"></span>
        <span class="status-icons">
          <svg class="connectivity" viewBox="0 0 15 12"><path d="M1.5 10.5v-2m4 2v-4.5m4 4.5v-7m4 7v-9"/></svg>
          <svg class="wifi" viewBox="0 0 16 12"><path d="M1.5 4.7a9.2 9.2 0 0 1 13 0M4.2 7.3a5.4 5.4 0 0 1 7.6 0M6.9 10a1.55 1.55 0 0 1 2.2 0"/></svg>
          <svg class="battery" viewBox="0 0 20 11"><rect x=".75" y="1.25" width="16.5" height="8.5" rx="2"/><path d="M18.5 4v3M3.2 3.4h10.4v4.2H3.2z" fill="currentColor" stroke="none"/></svg>
        </span>
      </div>
      <div class="camera-dot" aria-hidden="true"></div>
      <div class="gesture-indicator" aria-hidden="true"></div>
    </section>
  </div>

  <div class="proto-states" role="group" aria-label="Prototype state preview">
    <span>Prototype states</span>
    <div class="seg" id="protoSeg">
      <button type="button" data-state="ready" aria-pressed="true">Ready</button>
      <button type="button" data-state="notrips" aria-pressed="false">No active trip</button>
      <button type="button" data-state="loading" aria-pressed="false">Loading</button>
      <button type="button" data-state="nofares" aria-pressed="false">No fare rules</button>
      <button type="button" data-state="error" aria-pressed="false">Error</button>
    </div>
  </div>
  <script>
  (function () {
  'use strict';

  /* ── icons (src/icons.tsx) ─────────────────────────────────────────── */
  const ICONS = {
    chevron: '<path d="M9 5l7 7-7 7"/>',
    arrow: '<path d="M5 12h13M13 6l6 6-6 6"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    ticket: '<path d="M3 9.5V7.5a1.5 1.5 0 0 1 1.5-1.5h15A1.5 1.5 0 0 1 21 7.5v2a2.5 2.5 0 0 0 0 5v2a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 16.5v-2a2.5 2.5 0 0 0 0-5Z"/><path d="M14 6v12"/>',
    person: '<circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/>',
    route: '<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6h5a4 4 0 0 1 0 8h-3a4 4 0 0 0 0 8h5"/>',
    terminal: '<path d="M4 17.5V8.2a2 2 0 0 1 1.4-1.9l6-1.9a2 2 0 0 1 2.6 1.9v11.2"/><path d="M4 17.5h16M7.5 13.5h2.5M14 13.5h2.5"/>',
    fare: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M9.4 10h4.1a1.9 1.9 0 0 1 0 3.8h-4.1"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 14.4a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5v.2a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h.1a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1a1.6 1.6 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    lock: '<rect x="4.5" y="10" width="15" height="10" rx="2.5"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/>',
    database: '<ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v12c0 1.8 3.4 3.2 7.5 3.2s7.5-1.4 7.5-3.2V6"/><path d="M4.5 12c0 1.8 3.4 3.2 7.5 3.2s7.5-1.4 7.5-3.2"/>'
  };
  const icon = (name, size, color, sw) =>
    '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" stroke="' + color +
    '" stroke-width="' + (sw || 1.9) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';

  const $ = id => document.getElementById(id);
  /* A count and its noun are one thing, so they break together: the ledger cap
     is the only place here where a bare number could end a line on its own,
     and a line that reads "14" is a line nobody can parse. NBSP costs no
     horizontal space and no glyph, so every other caller is unaffected. */
  const plural = (n, one, many) => n + '\u00A0' + (n === 1 ? one : many);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  /* Times are printed the way the app prints them, and the space between the
     time and the meridiem is a no-break one: a ledger row that can break between
     "6:41" and "AM" is a row that reads as a different time. */
  const clock = d => {
    const h = d.getHours() % 12 || 12;
    const m = String(d.getMinutes()).padStart(2, '0');
    return h + ':' + m + '\u00A0' + (d.getHours() < 12 ? 'AM' : 'PM');
  };
  const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();


  /* ── the fare rules ────────────────────────────────────────────────── */
  /* The app STORES all of this and CALCULATES none of it. fareStore.ts creates
     the table and reads it back, and writes no defaults; FareSettingsScreen's
     EMPTY_VALUES leaves every field blank on a fresh install. So the values
     below are a configuration, not a constant — which is why "No fare rules" is
     one of this screen's five states instead of an edge case.

     These are the ten fields of the complete-form fixture in
     src/lib/fareFormat.test.ts:76-87, already in the units
     toStoredFareValues writes them in (:104-109): money in centavos,
     distance in thousandths of a km, percentages in hundredths of a point. */
  const FARE_CONFIG = {
    minimumFareCentavos: 5000,        /* '50'   → 5000            */
    minimumDistanceMilli: 4500,        /* '4.5'  → 4500            */
    ratePerKmCentavos: 175,            /* '1.75' → 175             */
    sctexRatePerKmCentavos: 225,       /* '2.25' → 225             */
    specialRatePerKmCentavos: 100,     /* '1.00' → 100             */
    sctexKmAdjustmentMilli: 500        /* '0.5'  → 500             */
  };
  /* deluxe_rate_per_km, sctex_deluxe_rate_per_km, deluxe_discount_bp and
     sctex_discount_bp exist in the same table and are deliberately NOT read
     here: Deluxe is a service level chosen in Fare Settings, not something a
     conductor decides at a roadside stop, and both discounts are already folded
     into special_rate_per_km as it is stored. The Fare rules sheet says so. */

  /* ── terminals ─────────────────────────────────────────────────────── */
  /* The five the app actually seeds, verbatim from the v4 seed
     (src/data/tripTicketsStore.ts:457-476), with km_marker in thousandths.
     The stored name is one string, "Terminal, Municipality", and the screen
     splits it rather than storing the split — the pair the conductor reads is
     the pair the seed wrote. */
  const STOPS = [
    { id: 'san-antonio',  name: 'San Antonio',         muni: 'Zambales',           km: 62400,  seeded: false },
    { id: 'iba',          name: 'Iba',                 muni: 'Zambales',           km: 96800,  seeded: true  },
    { id: 'balanga',      name: 'Balanga',             muni: 'Bataan',             km: 121400, seeded: false },
    { id: 'dinalupihan',  name: 'Dinalupihan',         muni: 'Bataan',             km: 150800, seeded: false },
    { id: 'san-rafael',   name: 'San Rafael',          muni: 'Zambales',           km: 176200, seeded: false },
    { id: 'porac',        name: 'Porac',               muni: 'Pampanga',           km: 205600, seeded: false },
    { id: 'candaba',      name: 'Candaba',             muni: 'Pampanga',           km: 216300, seeded: false },
    { id: 'santa-cruz',   name: 'Santa Cruz',          muni: 'Olongapo',           km: 228000, seeded: true  },
    { id: 'olongapo',     name: 'Olongapo',            muni: 'Olongapo',           km: 232400, seeded: true  },
    { id: 'subic',        name: 'Subic',               muni: 'Subic',              km: 249600, seeded: true  },
    { id: 'norzagaray',   name: 'Norzagaray',          muni: 'Bulacan',            km: 259700, seeded: false },
    { id: 'subic-bay',    name: 'Subic Bay Freeport',  muni: 'Subic',              km: 258900, seeded: false },
    { id: 'san-fernando', name: 'San Fernando',        muni: 'Pampanga',           km: 262400, seeded: false },
    { id: 'marquez',      name: 'Marques',             muni: 'Bulacan',            km: 271800, seeded: false },
    { id: 'meycauayan',   name: 'Meycauayan',          muni: 'Bulacan',            km: 286500, seeded: false },
    { id: 'cubi',         name: 'Cubao',               muni: 'Quezon City',        km: 301200, seeded: false },
    { id: 'caloocan',     name: 'Caloocan',            muni: 'Kalakhang Maynila',  km: 314200, seeded: true  }
  ];
  /* The twelve unseeded terminals are PLACED on the seeded corridor's scale, not
     measured from it: they are ordered along the same Olongapo → Caloocan axis
     the five km_markers define, and a trip's distance is a subtraction of two of
     them, so their positions only have to be consistent with each other. They
     are not in the app's seed, and a real install would carry the ones its
     operator actually configured. The five seeded ones are the five that are. */

  const ROADS = [
    { key: 'ordinary', label: 'Ordinary', note: 'National road' },
    { key: 'sctex', label: 'SCTEX', note: 'Subic–Clark–Tarlac' }
  ];
  const PT_ORDER = ['REGULAR', 'STUDENT', 'SENIOR_CITIZEN', 'PWD'];
  const PT_LABEL = { REGULAR: 'Regular', STUDENT: 'Student', SENIOR_CITIZEN: 'Senior citizen', PWD: 'PWD' };
  const PT_CHIP = { REGULAR: 'Regular', STUDENT: 'Student', SENIOR_CITIZEN: 'Senior', PWD: 'PWD' };
  const SPECIAL = { STUDENT: 1, SENIOR_CITIZEN: 1, PWD: 1 };
  /* The ledger row's fare-type chip, using the .cat pairs this file already
     carries for Trip tickets. */
  const catClass = pt => ({ REGULAR: 'regular', STUDENT: 'student', SENIOR_CITIZEN: 'senior', PWD: 'pwd' })[pt];


  const QTY_MIN = 1;
  const QTY_MAX = 20;

  /* Item 6. The ledger below is capped, and the cap is the same 6 Trip tickets
     keeps, so "the list" means one length on both screens. */
  const RECENT_LIMIT = 6;
  const FIRST_TICKET_ID = 9021;
  /* The ledger is a store, not a decoration, so it needs ids the way the
     ticket table has them. Restarted with every seed so all five previews show
     the same trip at the same point in its morning. */
  let nextTicketId = FIRST_TICKET_ID;


  /* ── the trip this ticket is recorded against ──────────────────────── */
  /* Trip #7, Santa Cruz → Caloocan, which is 86.2 km on the seeded markers.
     usesSctex is a column on the TRIP row (tripTicketsStore.ts:756) and it
     prices every ticket on the trip, so the road below is that column — not a
     per-ticket field the ticket table could hold. */
  const TRIP = {
    id: 900, number: 7, status: 'ACTIVE',
    origin: 'Santa Cruz, Olongapo',
    destination: 'Caloocan, Kalakhang Maynila',
    usesSctex: true,
    /* 78 minutes ago on the clock, not on a fixed date. A trip stamped in the
       past would put every ledger row before the fare the conductor is pricing
       right now, which is the one ordering this screen must never show. The
       floor is midnight, so at 00:20 the trip is twenty minutes old and says so
       rather than starting yesterday. */
    startedAt: new Date(Math.max(dayStart(new Date()), Date.now() - 78 * 60000))
  };


  /* ── integer formatters ────────────────────────────────────────────── */
  /* The app's scales are integers end to end (fareFormat.ts keeps money in
     centavos and distance in thousandths and does the arithmetic as string
     math). These do the same, so a prototype total and a stored fare cannot
     drift by a rounding step that only exists in the prototype. */
  const fmtKm = milli => {
    const whole = Math.floor(milli / 1000);
    const frac = String(milli % 1000).padStart(3, '0').replace(/0+$/, '');
    return (frac ? whole + '.' + frac : whole) + ' km';
  };
  const pesos = centavos => '₱' + Math.floor(centavos / 100) + '.' + String(centavos % 100).padStart(2, '0');
  /* formatScaled trims trailing zeros — 2.50 stores as 2.5 and 10.00 as 10 — so
     a per-km rate is printed the way Fare Settings prints it back. */
  const rateText = centavos => {
    const whole = Math.floor(centavos / 100);
    const frac = String(centavos % 100).padStart(2, '0').replace(/0+$/, '');
    return '₱' + (frac ? whole + '.' + frac : whole);
  };

  /* ── the calculator ────────────────────────────────────────────────── */
  /* The app has no fare calculator anywhere: insertTicket is handed
     farePerPassenger as an input (tripTicketsStore.ts:753-759) and never
     derives it. This is that missing function, written to the four column names
     in the fare table. The one rule it has to invent is the order the two
     minimums apply in, and it is stated in the Fare rules sheet rather than
     buried here. */
  function price(q, cfg) {
    const from = stopById(q.board);
    const to = stopById(q.drop);
    /* These four sentences are the app's own, verbatim from insertTicket
       (:798-815) and addTripState.ts:35-42. The prototype has to catch them
       because the store will, and it says them the same way so the conductor is
       not shown a refusal they have never seen. */
    if (from && to && from.id === to.id) return { ok: false, reason: 'Origin and destination are the same terminal.' };
    if (!from || !to) return { ok: false, reason: 'A selected terminal no longer exists. Re-choose the route.' };
    if (from.km === null || to.km === null) return { ok: false, reason: 'A terminal KM marker is not configured.' };
    const distMilli = Math.abs(to.km - from.km);
    if (distMilli === 0) return { ok: false, reason: 'The route distance is zero. Choose different terminals.' };

    const isSpecial = !!SPECIAL[q.pt];
    const rate = isSpecial ? cfg.specialRatePerKmCentavos
      : (q.road === 'sctex' ? cfg.sctexRatePerKmCentavos : cfg.ratePerKmCentavos);
    /* max(distance, minimum distance) first, then the toll-road adjustment on
       top: the adjustment is distance the driver is billed FOR, not distance
       they drove, so it cannot be what the floor is measured against. */
    const adjMilli = q.road === 'sctex' ? cfg.sctexKmAdjustmentMilli : 0;
    const flooredMilli = Math.max(distMilli, cfg.minimumDistanceMilli);
    const billableMilli = flooredMilli + adjMilli;
    /* rate is centavos per km and billable is thousandths of a km, so the
       product is thousandths of a centavo: divide by 1000, half-up. */
    const raw = Math.floor((rate * billableMilli + 500) / 1000);
    const each = Math.max(cfg.minimumFareCentavos, raw);
    return {
      ok: true, from: from, to: to, distMilli: distMilli, adjMilli: adjMilli,
      flooredMilli: flooredMilli, billableMilli: billableMilli, rate: rate,
      each: each, total: each * q.qty, qty: q.qty, isSpecial: isSpecial,
      minFareBinds: raw < cfg.minimumFareCentavos,
      minDistBinds: distMilli < cfg.minimumDistanceMilli
    };
  }
  const stopById = id => STOPS.filter(function (s) { return s.id === id; })[0] || null;

  /* ── the ledger this trip has already collected ────────────────────── */
  /* Item 6, and the reason the screen needs one. A bus that left 78 minutes ago
     has taken boardings all morning, so an empty list under the commit button
     would misstate the trip the conductor is in the middle of. These seven are
     not invented figures: they go through the SAME price() the form uses, on
     real pairs of the seeded terminals, walking north the way the trip runs, so
     every peso in the list is one the calculator would actually produce. */
  /* Declared oldest first — the order this bus actually took them, northbound,
     each group's destination ahead of where it boarded, which a southbound
     reading would not be. The store this feeds is newest first, so the row
     nearest the commit button is the last boarding and the list reads downward
     through the trip's morning. Note how many of these are the minimum fare: a
     short urban run at 1.75-2.25 a kilometre is mostly a ₱50 fare, and the ledger
     is where that stops being an abstraction. */
  const SEED_LOG = [
    { from: 'santa-cruz',     to: 'olongapo',       pt: 'REGULAR',        qty: 1, agoMin: 71 },
    { from: 'olongapo',       to: 'subic',         pt: 'REGULAR',        qty: 3, agoMin: 62 },
    { from: 'subic',          to: 'subic-bay',     pt: 'SENIOR_CITIZEN', qty: 1, agoMin: 53 },
    { from: 'subic-bay',      to: 'san-fernando',  pt: 'STUDENT',        qty: 2, agoMin: 44 },
    { from: 'san-fernando',   to: 'meycauayan',    pt: 'REGULAR',        qty: 4, agoMin: 35 },
    { from: 'meycauayan',     to: 'cubi',          pt: 'PWD',            qty: 1, agoMin: 26 },
    { from: 'cubi',           to: 'caloocan',      pt: 'REGULAR',        qty: 2, agoMin: 15 }
  ];

  /* One shape for a recorded ticket, from the seed and from the press alike, so
     a row can never be built from a cheaper path than the commit that made it. */
  function makeTicket(p, road, pt, issuedAt, id) {
    return {
      id: id, issuedAt: issuedAt, road: road, pt: pt, qty: p.qty,
      from: p.from, to: p.to, each: p.each, total: p.total,
      distMilli: p.distMilli, adjMilli: p.adjMilli, billableMilli: p.billableMilli,
      rate: p.rate, minFareBinds: p.minFareBinds, minDistBinds: p.minDistBinds
    };
  }

  function seedLog() {
    nextTicketId = FIRST_TICKET_ID;
    const now = Date.now();
    return SEED_LOG.map(function (r) {
      const p = price({ board: r.from, drop: r.to, road: 'sctex', pt: r.pt, qty: r.qty }, FARE_CONFIG);
      return makeTicket(p, 'sctex', r.pt, new Date(now - r.agoMin * 60000), nextTicketId++);
    }).reverse();   /* newest first, the order the list reads in */
  }

  const findTicket = id => state.log.filter(function (t) { return t.id === id; })[0] || null;


  /* ── state ─────────────────────────────────────────────────────────── */
  const state = {
    trip: TRIP,
    fares: FARE_CONFIG,
    board: 'santa-cruz',
    drop: 'caloocan',
    road: TRIP.usesSctex ? 'sctex' : 'ordinary',
    pt: 'REGULAR',
    qty: 1,
    log: seedLog(),
    preview: 'ready',
    sheet: null,
    ticket: null,
    lastFocus: null
  };

  /* The record and the ledger are separate numbers on purpose. c.priced is the
     ticket being composed; c.logTotal is what has been saved. The chrome shows
     the first, the list head shows the second, and nothing adds them together —
     a running fare that reads as a collected one is how a shift gets counted
     twice. */
  function compute() {

    const view = state.preview === 'loading' ? 'loading'
      : state.preview === 'error' ? 'error'
      : state.preview === 'notrips' ? 'notrips'
      : state.preview === 'nofares' ? 'nofares'
      : 'ready';
    const t = state.trip;
    /* No fares means no number, and a ticket with a wrong number is worse than
       no ticket: the form stays live so the driver keeps their work, but nothing
       can be committed and the reason is on screen. So price() is only ever
       handed a configuration that exists. */
    const priced = (view === 'ready' || view === 'nofares') && state.fares
      ? price({ board: state.board, drop: state.drop, road: state.road, pt: state.pt, qty: state.qty }, state.fares)
      : null;
    return {
      view: view, t: t, priced: priced,
      board: stopById(state.board), drop: stopById(state.drop),
      road: state.road, pt: state.pt, qty: state.qty, cfg: state.fares,
      onTrip: !!(t && t.status === 'ACTIVE'),
      log: state.log, recent: state.log.slice(0, RECENT_LIMIT),
      logTotal: state.log.reduce(function (s, t2) { return s + t2.total; }, 0),
      logPax: state.log.reduce(function (s, t2) { return s + t2.qty; }, 0),
      capped: state.log.length > RECENT_LIMIT
    };
  }


  /* ── chrome ────────────────────────────────────────────────────────── */
  /* The fare card and its breakdown sit below the fold: four inputs, two cards
     and a storage note come first, and that is 1367px of content in a 718px
     column. So the total is ALSO carried in the chrome, which never scrolls. A
     conductor setting a quantity watches the number they are about to commit
     change without scrolling to look for it — and the amber card below is then
     the derivation of the figure already on screen, not the only place the
     figure is. */
  function renderChrome(c) {
    const sub = $('chromeSub');
    if (c.view === 'loading') { sub.textContent = 'Reading local records…'; return; }
    if (c.view === 'error') { sub.textContent = 'Records unavailable'; return; }
    if (c.view === 'notrips') { sub.textContent = 'No trip running'; return; }
    /* Terminals are deliberately absent: they are the first thing in the form
       100px below, and at quantity 20 the peso string alone grows ~25px. The

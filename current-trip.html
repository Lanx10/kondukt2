  function renderActions(c) {
    const bar = $('actionBar');
    bar.hidden = !c.live;
    if (!c.live) return;
    const t = c.totals;
    $('endCount').textContent = 'Closes the run and sends it to History';
    const btn = $('endBtn');
    if (state.ending || c.view === 'ending') {
      btn.disabled = true;
      $('endLabel').textContent = 'Ending\u2026';
    } else {
      btn.disabled = false;
      $('endLabel').textContent = 'End trip';
    }
  }

  function renderNote(c) {
    const p = $('storageNote');
    if (c.view === 'empty') {
      p.textContent = 'Nothing is running, so there is nothing to read. The store positively reported no active trip \u2014 this is not a loading state waiting to resolve.';
      return;
    }
    if (c.view === 'loading') {
      p.textContent = 'Reading the active trip and its tickets.';
      return;
    }
    if (c.view === 'error') {
      p.textContent = 'The trips table could not be read. Nothing was written and the run is untouched.';
      return;
    }
    /* Two floors, not one. applyFare floors on ₱50.00 and then again on 4.5 km,
       and 2 of the 13 floored rows were stopped by the distance, so counting
       every atFloor as "the ₱50 minimum" misattributed them. The per-row word in
       the ledger says which, and this sentence has to agree with it. */
    const byFare = c.tickets.filter(function (t) { return t.atFloor === 'fare'; }).length;
    const byDistance = c.tickets.filter(function (t) { return t.atFloor === 'distance'; }).length;
    const priced = c.totals.count - byFare - byDistance;
    p.textContent = 'Every figure here is a sum of stored rows: ' + plural(c.totals.count, 'boarding', 'boardings') +
      ', ' + plural(c.totals.passengers, 'passenger', 'passengers') + ', ' + pesos(c.totals.collection) +
      ' collected. ' + priced + ' of ' + c.totals.count +
      ' are priced above both floors by distance, ' + byFare + ' land on the ' + pesos(c.fare.minimumFareCentavos) +
      ' minimum fare and ' + byDistance + ' on the 4.5 km minimum distance, which at these rates is most of a provincial run.';
  }

  /* ── whole-screen states ───────────────────────────────────────────── */
  function stateHTML(c) {
    if (c.view === 'loading') {
      return '<div class="card" data-od-id="ct-loading">' +
        '<div class="skeleton" aria-hidden="true">' +
        '<div class="sk" style="height:13px;width:30%"></div>' +
        '<div class="sk" style="height:34px;width:56%;margin-top:12px"></div>' +
        '<div class="sk" style="height:8px;margin-top:20px"></div>' +
        '<div class="sk" style="height:60px;margin-top:24px"></div>' +
        '<div class="sk" style="height:60px;margin-top:12px"></div>' +
        '</div></div>' +
        '<p class="sr-only" role="status">Reading the running trip.</p>';
    }
    if (c.view === 'error') {
      return '<div class="state error" data-od-id="ct-error" role="alert">' +
        '<h3 class="title-m">The current trip could not be read</h3>' +
        '<p class="body-s">The records on this device could not be read, so the totals and the ledger are unknown. Nothing was written and the run is still open.</p>' +
        '<p class="body-s">The app has no network path for this screen. Retry, and if it keeps failing the device is the thing to check.</p>' +
        '<button type="button" class="pick-row" data-act="retry" data-od-id="ct-retry" style="justify-content:center">' +
        icon('retry', 18, 'currentColor') + '<span class="pk-name body-m">Retry</span></button>' +
        '</div>';
    }
    /* empty: no active trip. The screen positively reported it, so this is not a
       flash of an empty state on launch. */
    return '<div class="state" data-od-id="ct-empty">' +
      '<div class="st-icon" style="width:48px;height:48px;background:var(--tertiary-container);color:var(--on-tertiary-container)">' +
      icon('bus', 28, 'currentColor', 1.7) + '</div>' +
      '<h3 class="title-m" style="margin-top:16px">No active trip</h3>' +
      '<p class="body-s">Start a trip before recording passenger tickets. A boarding is always added to a run, so with nothing running there is nothing to add one to.</p>' +
      '<div class="handoff" data-od-id="ct-empty-handoff">' +
      '<p class="nb-title label-s">WHERE A TRIP STARTS</p>' +
      '<p class="body-s">Trips are started on the Trip screen, which is also where the Dashboard sends you. There is no way to start one from here.</p>' +
      '</div>' +
      '<a class="primary-btn wide" style="margin-top:16px;justify-content:center" href="trip.html" data-od-id="ct-empty-start">Start trip</a>' +
      '</div>';
  }

  function renderStates(c) {
    const whole = !c.live;
    $('stateSection').hidden = !whole;
    $('stateSlot').innerHTML = whole ? stateHTML(c) : '';
    $('runSection').hidden = !c.live;
    $('ledgerSection').hidden = !c.live;
  }

  /* ── overlays ──────────────────────────────────────────────────────── */
  function closeOverlay() {
    const root = $('overlayRoot');
    if (!root.firstChild) return;
    /* Focus goes back where it came from, and only if that control still exists —
       a re-render between open and close will have replaced it. */
    if (state.lastFocus && state.lastFocus.isConnected) state.lastFocus.focus();
    root.innerHTML = '';
    state.sheet = null;
  }

  function openSheet(html) {
    state.lastFocus = document.activeElement;
    $('overlayRoot').innerHTML = '<div class="scrim bottom" data-scrim="1">' + html + '</div>';
    state.sheet = html;
    const af = $('overlayRoot').querySelector('[data-autofocus]');
    if (af) af.focus();
  }

  function detailRow(k, v) {
    return '<div class="detail-row"><span class="k body-m">' + k + '</span><span class="v body-m tabular">' + v + '</span></div>';
  }

  function sheet(title, sub, body) {
    return '<div class="sheet bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">' +
      '<div class="sheet-head">' +
      '<div class="sheet-titles">' +
      '<h2 class="headline-s" id="sheetTitle">' + title + '</h2>' +
      (sub ? '<p class="body-s muted">' + sub + '</p>' : '') +
      '</div>' +
      '<button type="button" class="icon-btn" data-act="close" data-od-id="ct-sheet-close" data-autofocus aria-label="Close">' +
      icon('close', 20, 'currentColor') + '</button>' +
      '</div>' +
      '<div class="sheet-body">' + body + '</div>' +
      '</div>';
  }

  function handoff(title, body) {
    return '<div class="handoff" data-od-id="ct-handoff">' +
      '<p class="nb-title label-s">' + title + '</p>' +
      '<p class="body-s">' + body + '</p></div>';
  }

  /* ── the end-trip confirm ──────────────────────────────────────────── */
  /* The one irreversible write on the screen, so it names what it destroys.
     "This closes the active trip" is true and useless: a conductor who has just
     carried 46 people needs to know the run number, the head count and the cash
     before the last tap, and needs to know where the record goes. */
  function endSheetHTML(c) {
    const t = c.totals;
    const rows = [
      detailRow('Trip', '#' + c.trip.number),
      detailRow('Route', c.trip.from + ' \u2192 ' + c.trip.to),
      detailRow('Started', clock(c.trip.startedAt)),
      detailRow('Boardings', String(t.count)),
      detailRow('Passengers', String(t.passengers)),
      detailRow('Collected', pesos(t.collection))
    ].join('');
    return sheet('End trip #' + c.trip.number + '?',
      c.trip.from + ' \u2192 ' + c.trip.to,
      '<div class="detail-card">' + rows + '</div>' +
      '<p class="body-s commit-hint">The run is stamped ended at ' + clock(new Date()) + ' and moves to History. The ' +
      plural(t.count, 'boarding', 'boardings') + ' and the ' + pesos(t.collection) +
      ' stay with it, and nothing on this screen can reopen it \u2014 ending a trip is not undoable from here.</p>' +
      '<div class="sheet-actions">' +
      '<button type="button" class="ghost label-l" data-act="close" data-od-id="ct-end-cancel">Keep running</button>' +
      '<button type="button" class="destructive label-l" data-act="confirm-end" data-od-id="ct-end-confirm">End trip</button>' +
      '</div>' +
      handoff('WHAT THE APP DOES NEXT', 'endActiveTrip writes the end clock and the status in one transaction. The observation then reports no active trip, so this screen swaps to the empty state on its own \u2014 no navigation and no refresh.'));
  }

  function backSheetHTML(c) {
    return sheet('Leave this screen?',
      c.live ? 'Trip #' + c.trip.number + ' keeps running' : 'Nothing is running',
      handoff('BACK GOES TO TRIP', 'The run does not stop when this screen closes. A boarding is recorded on Trip tickets, and ending the run happens here or on the Trip screen \u2014 nowhere else.') +
      '<p class="body-s commit-hint">' + (c.live
        ? 'Leaving costs nothing. The trip stays open and every boarding is still counted.'
        : 'With no run open there is nothing to lose.') + '</p>');
  }

  function renderOverlay() {
    $('overlayRoot').innerHTML = state.sheet || '';
  }

  /* ── prototype states, outside the phone ───────────────────────────── */
  function syncProto() {
    Array.prototype.forEach.call($('protoSeg').querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.state === state.preview ? 'true' : 'false');
    });
  }

  function setPreview(v) {
    state.preview = v;
    state.sheet = null;
    state.ending = v === 'ending';
    syncProto();
    render();
  }

  /* ── one render ────────────────────────────────────────────────────── */
  function render() {
    const c = compute();
    renderChrome(c);
    renderStates(c);
    if (c.live) { renderRun(c); renderLedger(c); }
    renderActions(c);
    renderNote(c);
    /* Last, so a sheet survives the render that opened it: state.sheet holds the
       markup and renderOverlay re-emits it, which means the sheet's controls are
       rebuilt rather than left stale. */
    renderOverlay();
  }

  /* ── wiring ────────────────────────────────────────────────────────── */
  document.addEventListener('click', function (e) {
    const t = e.target;

    /* Scrim close by attribute test and never by closest(): the sheet markup
       contains its own data-* attributes, and a close that walks up from a node
       inside the sheet would close the sheet on any tap that missed a control. */
    if (t.hasAttribute && t.hasAttribute('data-scrim')) { closeOverlay(); return; }

    const proto = t.closest && t.closest('#protoSeg button');
    if (proto) { setPreview(proto.dataset.state); return; }

    const act = t.closest && t.closest('[data-act]');
    if (!act) return;
    const c = compute();

    switch (act.dataset.act) {
      case 'back':
        openSheet(backSheetHTML(c));
        break;
      case 'close':
        closeOverlay();
        break;
      case 'retry':
        setPreview('ready');
        break;
      case 'end':
        openSheet(endSheetHTML(c));
        break;
      case 'confirm-end':
        state.sheet = null;
        state.ending = true;
        render();
        break;
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeOverlay();
  });

  syncProto();
  render();
  })();

  </script>
</body>
</html>

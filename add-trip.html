    const sec = $('commitSection');
    if (c.view !== 'ready' && c.view !== 'nofares') { sec.hidden = true; return; }
    sec.hidden = false;

    const reason = $('blockReason');
    const hint = $('commitHint');
    const btn = $('startBtn');
    let why = '';

    if (c.started) {
      why = 'Trip #' + c.started.number + ' is running. It ends on the Dashboard, where the next trip is started.';
    } else if (c.view === 'nofares') {
      why = 'No fare rules are set, so this trip cannot be started.';
    } else if (!c.m || !c.m.ok) {
      why = c.m ? c.m.reason : 'Choose an origin and a destination.';
    }
    reason.hidden = !why;
    if (why) reason.textContent = why;

    btn.disabled = !!(c.started || c.view !== 'ready' || !c.m || !c.m.ok);
    $('startLabel').textContent = c.started ? 'Trip #' + c.started.number + ' running' : 'Start trip';

    /* The press writes three columns and nothing else — a trip is a route, not a
       fare. The hint says where they go, because "the trip number is issued now"
       is the only part of this the app does at press time. */
    hint.hidden = !c.started;
    if (c.started) {
      hint.textContent = 'Trip #' + c.started.number + ' is stored with its two ends, its start time and its route distance. ' +
        'Fares are priced per boarding, on the trip, later.';
    }
  }

  function startTrip(c) {
    if (c.started || c.view !== 'ready' || !c.m || !c.m.ok) return;
    /* startTrip(origin, destination, usesSctex) is the entire write. The number
       is the row's own id and the started_at is the clock, both filled in by the
       store. Nothing here is a fare, because the app has no fare column on a
       trip to fill. It also skips the store's two trip-level guards, which are
       the first thing to restore in a port: a trip already running (:811) and a
       terminal that is present but inactive (:828). */
    const t = {
      number: c.next,
      originId: state.origin,
      destinationId: state.destination,
      usesSctex: state.road === 'sctex',
      from: c.m.from.name + ' · ' + c.m.from.muni,
      to: c.m.to.name + ' · ' + c.m.to.muni,
      at: clock(new Date()),
      distMilli: c.m.distMilli,
      billableMilli: c.m.billableMilli,
      rate: c.m.rate
    };
    state.started = t;
    state.sheet = startedSheetHTML(compute());
  }

  function renderNote(c) {
    const p = $('storageNote');
    if (c.started) {
      p.textContent = 'One row stored. No fare is written at this step — the trip is the only thing that exists until a boarding is added to it.';
      return;
    }
    p.textContent = 'Starting a trip stores where it leaves from, where it is going, when it started, the route distance in km, and that it is running. ' +
      'No passenger and no fare yet — those are added to the trip afterwards.';
  }

  /* ── whole-screen states ───────────────────────────────────────────── */
  /* Four of the five views. Three replace the screen, because a form that cannot
     do anything is worse than no form; the fourth — no fare rules — sits under a
     form that still works, because a route can be chosen on a device that has no
     rates and choosing it is not wasted. */
  function stateHTML(c) {
    if (c.view === 'loading') {
      return '<div class="card" data-od-id="at-loading">' +
        '<div class="skeleton" aria-hidden="true">' +
        '<div class="sk" style="height:13px;width:34%"></div>' +
        '<div class="sk" style="height:60px;margin-top:12px"></div>' +
        '<div class="sk" style="height:13px;width:22%;margin-top:20px"></div>' +
        '<div class="sk" style="height:60px;margin-top:12px"></div>' +
        '<div class="sk" style="height:44px;margin-top:24px"></div>' +
        '</div></div>' +
        '<p class="sr-only" role="status">Reading local records.</p>';
    }
    if (c.view === 'error') {
      return '<div class="state error" data-od-id="at-error">' +
        '<h3 class="title-m">Local records unavailable</h3>' +
        '<p class="body-s">The trips table could not be read, so there is no number to give this trip and nothing safe to write.</p>' +
        '<p class="body-s">The app has no network path for this screen. Retry, and if it keeps failing the device is the thing to check.</p>' +
        '<button type="button" class="pick-row center" data-act="retry" data-od-id="at-retry">' +
        icon('check', 18, 'currentColor') + '<span class="pk-name body-m">Retry</span></button>' +
        '</div>';
    }
    if (c.view === 'noterminals') {
      return '<div class="state" data-od-id="at-noterminals">' +
        '<h3 class="title-m">No terminals on this device</h3>' +
        '<p class="body-s">A trip is a difference between two KM markers, so a device with no terminals cannot record one.</p>' +
        '<p class="body-s">In the app this is Settings &rarr; Terminals, which writes the name and the KM marker together. Five of the seventeen are seeded; the rest are added by the operator.</p>' +
        '<div class="handoff" data-od-id="at-noterminals-handoff">' +
        '<p class="nb-title label-s">HANDOFF</p>' +
        '<p class="body-s">Terminals live in Settings. There is no way to add one from this screen, and no way to add a trip without two.</p>' +
        '</div></div>';
    }
    /* nofares — under the form, never in place of it. */
    return '<div class="state" data-od-id="at-nofares">' +
      '<h3 class="title-m">No fare rules set</h3>' +
      '<p class="body-s">Fare settings are created empty, so a device that has never opened them has no rate and no minimum. A trip is still worth recording — the route does not depend on a peso — but nothing can be billed against it yet.</p>' +
      '<button type="button" class="pick-row center" data-act="rules" data-od-id="at-nofares-rules">' +
      icon('fare', 18, 'currentColor') + '<span class="pk-name body-m">See what a rate would be used for</span></button>' +
      '</div>';
  }

  function renderStates(c) {
    const whole = c.view === 'loading' || c.view === 'error' || c.view === 'noterminals';
    $('formSection').hidden = whole;
    $('stateSection').hidden = !(whole || c.view === 'nofares');
    $('stateSlot').innerHTML = (whole || c.view === 'nofares') ? stateHTML(c) : '';
  }

  /* ── overlays ──────────────────────────────────────────────────────── */
  function closeOverlay() {
    const root = $('overlayRoot');
    if (!root.firstChild) return;
    /* Focus goes back where it came from, and only if that control still exists —
       a re-render between open and close will have replaced it. */
    if (state.lastFocus && state.lastFocus.isConnected) state.lastFocus.focus();
    root.innerHTML = '';
    state.sheet = null;
  }

  function openSheet(html, scrimClass) {
    state.lastFocus = document.activeElement;
    $('overlayRoot').innerHTML = '<div class="scrim ' + (scrimClass || 'bottom') + '" data-scrim="1">' + html + '</div>';
    state.sheet = html;
    const af = $('overlayRoot').querySelector('[data-autofocus]');
    if (af) af.focus();
  }

  function detailRow(k, v) {
    return '<div class="detail-row"><span class="k body-m">' + k + '</span><span class="v body-m tabular">' + v + '</span></div>';
  }

  function sheet(title, sub, body) {
    return '<div class="sheet bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">' +
      '<div class="sheet-head">' +
      '<div class="sheet-titles">' +
      '<h2 class="headline-s" id="sheetTitle">' + title + '</h2>' +
      (sub ? '<p class="body-s muted">' + sub + '</p>' : '') +
      '</div>' +
      '<button type="button" class="icon-btn" data-act="close" data-od-id="at-sheet-close" data-autofocus aria-label="Close">' +
      icon('close', 20, 'currentColor') + '</button>' +
      '</div>' +
      '<div class="sheet-body">' + body + '</div>' +
      '</div>';
  }

  function handoff(title, body) {
    return '<div class="handoff" data-od-id="at-handoff">' +
      '<p class="nb-title label-s">' + title + '</p>' +
      '<p class="body-s">' + body + '</p></div>';
  }

  /* ── the two pickers ───────────────────────────────────────────────── */
  /* One list, two callers: the same seeded rows open for either end, and the
     distance is quoted against the OTHER end because that is the only number a
     conductor choosing a terminal is actually shopping on. */
  function stopSheetHTML(which, c) {
    const from = which === 'origin' ? state.destination : state.origin;
    const chosen = which === 'origin' ? state.origin : state.destination;
    const other = from ? stopById(from) : null;
    const rows = state.stops.map(function (s) {
      const dist = other && s.km !== null && other.km !== null
        ? ' · ' + fmtKm(Math.abs(s.km - other.km)) + ' away'
        : '';
      return '<button type="button" class="pick-row" data-stop="' + s.id + '" data-od-id="at-stop-' + s.id + '"' +
        (chosen === s.id ? ' aria-current="true"' : '') + '>' +
        '<span class="f-icon" aria-hidden="true" style="width:32px;height:32px">' + icon('terminal', 18, 'currentColor', 1.8) + '</span>' +
        '<span class="pk-body"><span class="pk-name body-m">' + s.name + '</span>' +
        '<span class="pk-sub body-s">' + s.muni + dist + '</span></span>' +
        (chosen === s.id ? '<span class="f-chev" aria-hidden="true">' + icon('check', 18, 'currentColor') + '</span>' : '') +
        '</button>';
    }).join('');

    return sheet(
      which === 'origin' ? 'Where does the bus leave?' : 'Where is the bus going?',
      plural(state.stops.length, 'terminal', 'terminals') + ' on this device',
      rows + '<p class="pick-more body-s">A terminal with no KM marker cannot be used as either end of a route.</p>'
    );
  }

  /* ── the rules sheet ───────────────────────────────────────────────── */
  /* The five values this screen prints, and the two decisions the app leaves
     open that a reader of this screen has to be told about. Both are stated
     here rather than in code, because a prototype that hides an invented rule
     behind a plausible number is worse than one that admits to it. The toll
     road's extra half kilometre is read from the table and applied to the
     billable distance, but it is not a row here — the card above already
     shows route and billable as two numbers. */
  function rulesSheetHTML(c) {
    const cfg = c.cfg || state.fares;
    const rows = [
      detailRow('Rate per km', rateText(cfg.ratePerKmCentavos)),
      detailRow('SCTEX rate per km', rateText(cfg.sctexRatePerKmCentavos)),
      detailRow('Minimum distance', fmtKm(cfg.minimumDistanceMilli)),
      detailRow('Minimum fare', pesos(cfg.minimumFareCentavos)),
      detailRow('Special rate per km', rateText(cfg.specialRatePerKmCentavos))
    ].join('');

    return sheet('Fare rules', 'The rates and floors this trip is read against',
      '<div class="detail-card">' + rows + '</div>' +
      '<p class="body-s commit-hint">These are read from the fare settings table, which is created empty and filled by Fare settings. A trip stores none of them: it stores the route distance it was started with and no road, and every boarding on it is priced from the values above at the moment it is added.</p>' +
      handoff('THE ROAD THE TRIP DOES NOT KEEP', 'This screen asks for the road, because the road moves every peso on the run, and the store is then handed that answer and throws it away — there is no road column on a trip, so a boarding on an SCTEX trip is priced on the ordinary rate until one is added. The switch is here to show the decision a conductor is already making; the column is the port\'s first job.') +
      handoff('HOW A BOARDING IS PRICED', 'A boarding takes the rate for its road, multiplies it by the billable distance, rounds down, and compares the result with the minimum fare. The floor comes last, so a short trip is never billed below ' + pesos(cfg.minimumFareCentavos) + '.') +
      handoff('THE ORDER THIS SCREEN CHOSE', 'The minimum distance is applied to the ROUTE distance first, and the half kilometre a toll road bills is added after it, not before. That half kilometre is distance a driver is billed for and not distance they drive, so it cannot be part of what the floor is measured against. The app does not compute any of this — this order is a prototype decision, and it is the one thing here that could reasonably be written the other way.') +
      handoff('WHAT IS NOT HERE', 'The Deluxe rate and both discount fields are set in Fare settings and are not read by this screen: Deluxe is a service level, not something a conductor decides at a roadside stop, and the discounts are already folded into the special rate as it is stored. The special rate is shown because it is a stored value, not because this screen can produce it.')
    );
  }

  /* ── after the press ───────────────────────────────────────────────── */
  /* The one thing the press did, stated, plus the two places it can go next. A
     sheet rather than a toast: the trip number is a reference the conductor may
     have to read out, and a toast is gone in two seconds. */
  function startedSheetHTML(c) {
    const t = c.started;
    const road = t.usesSctex ? 'SCTEX' : 'Ordinary';
    const rows = [
      detailRow('Trip', '#' + t.number),
      detailRow('Leaves from', t.from),
      detailRow('Going to', t.to),
      detailRow('Road', road),
      detailRow('Route distance', fmtKm(t.distMilli)),
      detailRow('Billable distance', fmtKm(t.billableMilli)),
      detailRow('Rate per km', rateText(t.rate)),
      detailRow('Started', t.at)
    ].join('');

    return sheet('Trip #' + t.number + ' is running', t.from + ' → ' + t.to,
      '<div class="detail-card">' + rows + '</div>' +
      '<p class="body-s commit-hint">The trip keeps the route distance it was started with, but neither the billable distance nor the rate. Those two are shown so the road choice can be checked; the boarding screen recomputes them from the same values.</p>' +
      '<a class="primary-btn wide" href="add-ticket.html" data-od-id="at-started-add">Add the first boarding</a>' +
      handoff('WHERE THIS GOES NEXT', 'A boarding is added to this trip and prices itself against it. The Dashboard shows the running trip and is where the next one is started — not this screen, which will offer Trip #' + t.number + ' again until this one ends.')
    );
  }

  /* ── back ──────────────────────────────────────────────────────────── */
  function backSheetHTML(c) {
    const running = !!c.started;
    return sheet(running ? 'Leave while this trip runs?' : 'Leave this screen?',
      running ? 'Trip #' + c.started.number + ' keeps running' : 'Nothing has been stored yet',
      handoff('BACK GOES TO THE DASHBOARD', 'A trip is started from the Dashboard, which is also where a running trip ends. A trip cannot be started from anywhere else in the app, so this screen is a detail of the Dashboard rather than a page of its own.') +
      '<p class="body-s commit-hint">' + (running
        ? 'The trip stays open on the Dashboard. Adding a boarding is the only thing that changes it.'
        : 'Choosing a route and leaving costs nothing. The commit is the only write on this screen.') + '</p>');
  }


  function renderOverlay() {
    $('overlayRoot').innerHTML = state.sheet || '';
  }

  /* ── prototype states, outside the phone ───────────────────────────── */
  function syncProto() {
    Array.prototype.forEach.call($('protoSeg').querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.state === state.preview ? 'true' : 'false');
    });
  }

  function setPreview(v) {
    state.preview = v;
    /* A state switch is a different device, so a trip that was started on the
       previous one does not exist on this one. */
    state.started = null;
    state.sheet = null;
    syncProto();
    render();
  }

  /* ── one render ────────────────────────────────────────────────────── */
  function render() {
    const c = compute();
    renderChrome(c);
    renderForm(c);
    renderStates(c);
    renderCommit(c);
    renderNote(c);
    /* Last, so a sheet survives the render that opened it: state.sheet holds the
       markup and renderOverlay re-emits it, which means the sheet's inputs are
       rebuilt rather than left stale. */
    renderOverlay();
  }

  /* ── wiring ────────────────────────────────────────────────────────── */
  document.addEventListener('click', function (e) {
    const t = e.target;

    /* Scrim close by attribute test and never by closest(): the sheet markup
       contains its own data-* attributes, and a close that walks up from a node
       inside the sheet would close the sheet on any tap that missed a control. */
    if (t.hasAttribute && t.hasAttribute('data-scrim')) { closeOverlay(); return; }

    const proto = t.closest && t.closest('#protoSeg button');
    if (proto) { setPreview(proto.dataset.state); return; }

    const road = t.closest && t.closest('[data-road]');
    if (road) {
      state.road = road.dataset.road;
      render();
      return;
    }

    const stop = t.closest && t.closest('[data-stop]');
    if (stop) {
      const id = stop.dataset.stop;
      /* Which end is being filled is a property of the sheet, not of the row, so
         the same list markup opens for both and cannot set the wrong one. */
      if (state.sheetKind === 'origin') state.origin = id; else state.destination = id;
      state.sheet = null;
      state.sheetKind = null;
      render();
      return;
    }

    const act = t.closest && t.closest('[data-act]');
    if (!act) return;
    const c = compute();

    switch (act.dataset.act) {
      case 'back':
        openSheet(backSheetHTML(c), 'center');
        break;
      case 'close':
        closeOverlay();
        break;
      case 'clear':
        state.origin = null;
        state.destination = null;
        state.sheet = null;
        render();
        break;
      case 'swap': {
        const o = state.origin;
        state.origin = state.destination;
        state.destination = o;
        render();
        break;
      }
      case 'pick-origin':
        state.sheetKind = 'origin';
        openSheet(stopSheetHTML('origin', c));
        break;
      case 'pick-destination':
        state.sheetKind = 'destination';
        openSheet(stopSheetHTML('destination', c));
        break;
      case 'rules':
        openSheet(rulesSheetHTML(c));
        break;
      case 'retry':
        setPreview('ready');
        break;
      case 'start':
        startTrip(c);
        render();
        break;
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeOverlay();
  });

  buildControls();
  syncProto();
  render();
  })();

  </script>
</body>
</html>
